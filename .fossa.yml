# FOSSA license analysis settings.
version: 3

# Development-only MCP Inspector for the manual test:inspector gate. It has its own npm lockfile
# outside the pnpm workspace and is never built into or shipped with Authrim.
targets:
  exclude:
    - type: npm
      path: packages/ar-agent-access/tools/mcp-inspector

paths:
  exclude:
    - ./packages/ar-agent-access/tools/mcp-inspector
