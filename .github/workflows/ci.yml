name: CI

on:
  pull_request:
    branches:
      - main
      - develop

# Restrict GITHUB_TOKEN permissions (OpenSSF Scorecard)
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm run security:audit

      - name: Verify MCP server ownership registry
        run: pnpm run security:mcp-registry

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment variables
        run: |
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-login-ui/.env
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-admin-ui/.env

      - name: Run linter
        run: pnpm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment variables
        run: |
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-login-ui/.env
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-admin-ui/.env

      - name: Run type checking
        run: pnpm run typecheck

  api-tests:
    name: API Tests with Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment variables
        run: |
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-login-ui/.env
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-admin-ui/.env

      - name: Check canonical test quality
        run: node scripts/check-test-quality.mjs

      - name: Run API tests with coverage
        run: AUTHRIM_SECURITY_REGRESSION_SUITE=true pnpm run test:coverage:api

      - name: Run canonical integration tests
        env:
          AUTHRIM_TEST_REPORT: ${{ runner.temp }}/authrim-integration-tests.json
        run: AUTHRIM_SECURITY_REGRESSION_SUITE=true pnpm run test:integration

      - name: Run OAuth and OIDC regression gate
        env:
          AUTHRIM_TEST_REPORT: ${{ runner.temp }}/authrim-oauth-oidc-regressions.json
        run: pnpm run test:oauth-oidc-regressions

      - name: Type-check security matrices
        run: pnpm run test:security-matrices:typecheck

      - name: Run security matrices
        env:
          AUTHRIM_TEST_REPORT: ${{ runner.temp }}/authrim-security-matrices.json
        run: pnpm run test:security-matrices

      - name: Comment coverage summary
        if: ${{ github.event_name == 'pull_request' && success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHRIM_INTEGRATION_REPORT: ${{ runner.temp }}/authrim-integration-tests.json
          AUTHRIM_OAUTH_OIDC_REPORT: ${{ runner.temp }}/authrim-oauth-oidc-regressions.json
          AUTHRIM_SECURITY_MATRICES_REPORT: ${{ runner.temp }}/authrim-security-matrices.json
        run: node scripts/ci-pr-coverage-comment.mjs

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment variables
        run: |
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-login-ui/.env
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-admin-ui/.env

      - name: Run UI tests
        run: pnpm run test:ui

  control-plane-tests:
    name: Tenant D1 Control Plane Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tenant D1 control-plane tests
        run: pnpm run control-plane:test

      - name: Run Phase 9 local release gate
        run: pnpm run control-plane:phase9-local-gate

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment variables
        run: |
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-login-ui/.env
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-admin-ui/.env

      - name: Build project
        run: pnpm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  format:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting
        run: pnpm run format:check

  lint-and-test:
    name: Lint, Type Check, and Test
    runs-on: ubuntu-latest
    needs:
      - dependency-audit
      - lint
      - typecheck
      - api-tests
      - ui-tests
      - control-plane-tests
      - build
      - format
    if: ${{ always() }}

    steps:
      - name: Check parallel CI jobs
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "One or more parallel CI jobs did not pass."
          exit 1

      - name: Mark CI gate as passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: echo "All parallel CI jobs passed."

  e2e-and-accessibility:
    name: E2E and Accessibility Tests
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: false # Temporarily disabled

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment variables
        run: |
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-login-ui/.env
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-admin-ui/.env

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build UI
        run: pnpm --filter=@authrim/ar-login-ui --filter=@authrim/ar-admin-ui build

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  lighthouse:
    name: Lighthouse Performance Tests
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: false # Temporarily disabled

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment variables
        run: |
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-login-ui/.env
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-admin-ui/.env

      - name: Build UI
        run: pnpm --filter=@authrim/ar-login-ui --filter=@authrim/ar-admin-ui build

      - name: Run Lighthouse CI
        run: pnpm run test:lighthouse

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 30
