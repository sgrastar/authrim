name: CI

on:
  pull_request:
    branches:
      - main
      - develop

# Restrict GITHUB_TOKEN permissions (OpenSSF Scorecard)
permissions:
  contents: read
  issues: write
  pull-requests: write

# A newer commit makes earlier PR checks obsolete. Cancel superseded runs so
# resource-heavy TypeScript builds and coverage suites cannot pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm run security:audit

      - name: Verify MCP server ownership registry
        run: pnpm run security:mcp-registry

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Reject tracked internal files
        run: bash scripts/check-private-files.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI contracts
        run: pnpm openapi:validate

      - name: Setup environment variables
        run: |
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-login-ui/.env
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-admin-ui/.env

      - name: Run linter
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: pnpm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    env:
      TURBO_CONCURRENCY: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment variables
        run: |
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-login-ui/.env
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-admin-ui/.env

      - name: Run type checking
        run: pnpm run typecheck

      - name: Verify release migration candidate for main
        if: github.base_ref == 'main'
        run: pnpm migrate:release:check

  # The API tests of the packages, one job per shard (scripts/ci-test-shards.mjs), so the workflow
  # takes as long as its slowest shard instead of the sum of all packages. A shard that is still
  # long is cut into parts with `vitest --shard` (PARTS in that script), one job per part. The
  # entries below are checked against `node scripts/ci-test-shards.mjs matrix` by
  # scripts/ci-test-shards.test.mjs. Each job hands its coverage on to the summary job, which merges
  # the parts of a package back into one result.
  api-package-tests:
    name: API Tests (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: management, id: management-1, part: '1', vitestShard: '--shard=1/4' }
          - { shard: management, id: management-2, part: '2', vitestShard: '--shard=2/4' }
          - { shard: management, id: management-3, part: '3', vitestShard: '--shard=3/4' }
          - { shard: management, id: management-4, part: '4', vitestShard: '--shard=4/4' }
          - { shard: auth, id: auth, part: '', vitestShard: '' }
          - { shard: core, id: core, part: '', vitestShard: '' }
          - { shard: services, id: services, part: '', vitestShard: '' }
    env:
      TURBO_CONCURRENCY: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment variables
        run: |
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-login-ui/.env
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-admin-ui/.env

      - name: Check that every tested package belongs to a shard
        run: node scripts/ci-test-shards.mjs check

      # Turbo replays the build of a package whose inputs did not change (tests always run: they
      # read files outside their package, such as the root migrations, that the cache key does not
      # cover). A pull request restores the cache of its own earlier runs, so only the first run of
      # a branch starts cold. The parts of a shard build the same things and share one cache entry:
      # the first to finish saves it, the others only log that it exists.
      - name: Restore Turbo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .turbo/cache
          key: turbo-api-${{ matrix.shard }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-api-${{ matrix.shard }}-${{ runner.os }}-

      - name: Run API tests with coverage
        run: >-
          AUTHRIM_SECURITY_REGRESSION_SUITE=true
          pnpm exec turbo run test $(node scripts/ci-test-shards.mjs filters ${{ matrix.shard }})
          -- --coverage ${{ matrix.vitestShard }}

      # Staged under ci-coverage/packages/... so that downloading it into the workspace puts each
      # file back where the summary script looks for it. The coverage of one part of a split
      # package goes to coverage-parts/<part>/ instead, where scripts/ci-merge-coverage.mjs finds
      # it (the parts of a package would otherwise overwrite each other).
      - name: Collect package coverage
        env:
          PART: ${{ matrix.part }}
        run: |
          mkdir -p ci-coverage
          for dir in packages/*/coverage; do
            [ -d "$dir" ] || continue
            if [ -n "$PART" ]; then
              target="ci-coverage/$(dirname "$dir")/coverage-parts/$PART"
            else
              target="ci-coverage/$dir"
            fi
            mkdir -p "$target"
            cp "$dir"/coverage-summary.json "$dir"/coverage-final.json "$target/" 2>/dev/null || true
          done

      - name: Upload package coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authrim-api-coverage-${{ matrix.id }}
          path: ci-coverage
          if-no-files-found: error
          retention-days: 1

  # The suites that run across packages (integration, security regressions, evidence checks). They
  # do not depend on the package tests, so they run next to them.
  api-suite-tests:
    name: API Repository Suites
    runs-on: ubuntu-latest
    env:
      TURBO_CONCURRENCY: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment variables
        run: |
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-login-ui/.env
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-admin-ui/.env

      - name: Check canonical test quality
        run: node scripts/check-test-quality.mjs

      - name: Prepare repository suite reports
        run: mkdir -p ci-reports

      - name: Restore Turbo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .turbo/cache
          key: turbo-api-suites-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-api-suites-${{ runner.os }}-

      # The suites run the packages' tests and import their built output.
      - name: Build API packages
        run: pnpm run build:api

      - name: Run canonical integration tests
        env:
          AUTHRIM_TEST_REPORT: ${{ github.workspace }}/ci-reports/authrim-integration-tests.json
        run: AUTHRIM_SECURITY_REGRESSION_SUITE=true pnpm run test:integration

      - name: Run OAuth and OIDC regression gate
        env:
          AUTHRIM_TEST_REPORT: ${{ github.workspace }}/ci-reports/authrim-oauth-oidc-regressions.json
        run: pnpm run test:oauth-oidc-regressions

      - name: Type-check security matrices
        run: pnpm run test:security-matrices:typecheck

      - name: Run security matrices
        env:
          AUTHRIM_TEST_REPORT: ${{ github.workspace }}/ci-reports/authrim-security-matrices.json
        run: pnpm run test:security-matrices

      # Ledger, evidence files and independent checks (some run regression tests). The monthly
      # report is written outside the repository: committing it stays a manual review step.
      - name: Run ASVS evidence checks
        run: >-
          node scripts/asvs-check.mjs
          --json-output ci-reports/asvs-coverage-summary.json
          --report-root "$RUNNER_TEMP/asvs-reports"

      - name: Run Phase 1 scale-out correctness tests
        env:
          AUTHRIM_TEST_REPORT: ${{ github.workspace }}/ci-reports/authrim-scale-out-phase1-tests.json
        run: pnpm run test:scale-out-phase1

      - name: Upload repository suite reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authrim-api-test-evidence
          path: ci-reports/
          if-no-files-found: error
          retention-days: 1

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment variables
        run: |
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-login-ui/.env
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-admin-ui/.env

      - name: Run UI tests
        run: pnpm run test:ui

      - name: Install Playwright Chromium for admin console stories
        run: pnpm --filter=@authrim/ar-admin-console exec playwright install --with-deps chromium

      - name: Run admin console story tests (interactions + accessibility)
        run: pnpm --filter=@authrim/ar-admin-console test:stories

  control-plane-tests:
    name: Tenant D1 Control Plane Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare repository suite reports
        run: mkdir -p ci-reports

      - name: Run tenant D1 control-plane tests
        env:
          AUTHRIM_TEST_REPORT: ${{ github.workspace }}/ci-reports/authrim-control-plane-tests.json
        run: pnpm run control-plane:test

      - name: Run Phase 9 local release gate
        run: pnpm run control-plane:phase9-local-gate

      - name: Upload control-plane repository suite report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authrim-control-plane-test-evidence
          path: ci-reports/authrim-control-plane-tests.json
          if-no-files-found: error
          retention-days: 1

  coverage-summary:
    name: Repository Test Suites Summary
    runs-on: ubuntu-latest
    needs:
      - api-package-tests
      - api-suite-tests
      - control-plane-tests
      - lint
      - typecheck
      - build

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download API coverage and repository suite reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: authrim-api-test-evidence
          path: ci-reports

      - name: Download package coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: authrim-api-coverage-*
          merge-multiple: true
          path: .

      - name: Merge the coverage of split packages
        run: node scripts/ci-merge-coverage.mjs

      - name: Export compact package coverage summary
        env:
          AUTHRIM_COVERAGE_STATS_OUTPUT: ${{ github.workspace }}/ci-reports/authrim-package-coverage.json
        run: node scripts/ci-pr-coverage-comment.mjs

      - name: Download control-plane repository suite report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: authrim-control-plane-test-evidence
          path: ci-reports

      - name: Download package build sizes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: authrim-package-sizes
          path: ci-reports

      - name: Comment coverage summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHRIM_INTEGRATION_REPORT: ci-reports/authrim-integration-tests.json
          AUTHRIM_OAUTH_OIDC_REPORT: ci-reports/authrim-oauth-oidc-regressions.json
          AUTHRIM_SECURITY_MATRICES_REPORT: ci-reports/authrim-security-matrices.json
          AUTHRIM_SCALE_OUT_PHASE1_REPORT: ci-reports/authrim-scale-out-phase1-tests.json
          AUTHRIM_CONTROL_PLANE_REPORT: ci-reports/authrim-control-plane-tests.json
          AUTHRIM_COVERAGE_STATS_REPORT: ci-reports/authrim-package-coverage.json
          AUTHRIM_PACKAGE_SIZES_REPORT: ci-reports/authrim-package-sizes.json
        run: node scripts/ci-pr-coverage-comment.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      TURBO_CONCURRENCY: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment variables
        run: |
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-login-ui/.env
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-admin-ui/.env

      - name: Build API, Setup, and shared packages
        run: pnpm run build:api
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Build Login UI
        run: pnpm run build:login-ui
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Build Admin UI
        run: pnpm run build:admin-ui
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Build admin console
        run: pnpm run build:admin-console
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Verify admin console dev mock is absent from the build
        run: pnpm --filter=@authrim/ar-admin-console check:dev-mock-guard

      - name: Test package size reporting
        run: node --test scripts/ci-package-sizes.test.mjs scripts/ci-test-shards.test.mjs scripts/ci-merge-coverage.test.mjs

      - name: Measure all package build sizes
        run: node scripts/ci-package-sizes.mjs ci-reports/authrim-package-sizes.json

      - name: Upload package build sizes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authrim-package-sizes
          path: ci-reports/authrim-package-sizes.json
          if-no-files-found: error
          retention-days: 7

  format:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting
        run: pnpm run format:check

  lint-and-test:
    name: Lint, Type Check, and Test
    runs-on: ubuntu-latest
    needs:
      - dependency-audit
      - lint
      - typecheck
      - api-package-tests
      - api-suite-tests
      - ui-tests
      - control-plane-tests
      - coverage-summary
      - build
      - format
    if: ${{ always() }}

    steps:
      - name: Check parallel CI jobs
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "One or more parallel CI jobs did not pass."
          exit 1

      - name: Mark CI gate as passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: echo "All parallel CI jobs passed."

  e2e-and-accessibility:
    name: E2E and Accessibility Tests
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: false # Temporarily disabled

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment variables
        run: |
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-login-ui/.env
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-admin-ui/.env

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build UI
        run: pnpm --filter=@authrim/ar-login-ui --filter=@authrim/ar-admin-ui build

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  lighthouse:
    name: Lighthouse Performance Tests
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: false # Temporarily disabled

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment variables
        run: |
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-login-ui/.env
          echo "PUBLIC_API_BASE_URL=http://localhost:8786" > packages/ar-admin-ui/.env

      - name: Build UI
        run: pnpm --filter=@authrim/ar-login-ui --filter=@authrim/ar-admin-ui build

      - name: Run Lighthouse CI
        run: pnpm run test:lighthouse

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 30
