name: Deploy Test Environments

# Triggers: push to develop only (i.e. after a PR is merged).
# Running on PRs is intentionally disabled to avoid deploying unreviewed code
# with repository Cloudflare secrets.
on:
  push:
    branches:
      - develop
  workflow_dispatch:

# Restrict GITHUB_TOKEN permissions (OpenSSF Scorecard)
permissions:
  contents: read

jobs:
  deploy-and-validate:
    name: Deploy and validate ${{ matrix.hostname }}
    runs-on: ubuntu-latest

    # Only run on the main repository (skip forks).
    if: github.repository == 'sgrastar/authrim'

    strategy:
      fail-fast: false
      matrix:
        include:
          - env_name: test
            hostname: test.authrim.com
            config_secret: AUTHRIM_TEST_CONFIG
            lock_secret: AUTHRIM_TEST_LOCK
            keys_secret: AUTHRIM_TEST_KEYS_TAR_B64

    concurrency:
      group: deploy-${{ matrix.env_name }}
      cancel-in-progress: false

    env:
      AUTHRIM_ENV_NAME: ${{ matrix.env_name }}
      AUTHRIM_HOSTNAME: ${{ matrix.hostname }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Use warn level to suppress Wrangler binding output that may contain resource IDs.
      WRANGLER_LOG: warn

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore generated environment from secrets
        env:
          AUTHRIM_ENV_CONFIG: ${{ secrets[matrix.config_secret] }}
          AUTHRIM_ENV_LOCK: ${{ secrets[matrix.lock_secret] }}
          AUTHRIM_ENV_KEYS_TAR_B64: ${{ secrets[matrix.keys_secret] }}
        run: node scripts/ci-restore-generated-env.mjs

      - name: Deploy environment
        run: |
          pnpm setup:deploy -- \
            --env "$AUTHRIM_ENV_NAME" \
            --source "$GITHUB_WORKSPACE" \
            --keys-dir "$GITHUB_WORKSPACE/.authrim-keys/$AUTHRIM_ENV_NAME" \
            --yes

      - name: Validate generated environment
        run: pnpm exec tsx test/environment-validation/validate-generated-env.ts --env "$AUTHRIM_ENV_NAME"

      - name: Run public API smoke
        run: pnpm exec tsx test/environment-validation/smoke-generated-api.ts --env "$AUTHRIM_ENV_NAME"

      - name: Run Admin API smoke
        run: pnpm exec tsx test/environment-validation/smoke-generated-admin-api.ts --env "$AUTHRIM_ENV_NAME"

      - name: Run auth flow smoke
        run: pnpm exec tsx test/environment-validation/smoke-generated-auth-flow.ts --env "$AUTHRIM_ENV_NAME"

      - name: Run approval and protected-resource smoke
        run: pnpm exec tsx test/environment-validation/smoke-generated-approvals.ts --env "$AUTHRIM_ENV_NAME"

      - name: Run server-surface smoke
        run: pnpm exec tsx test/environment-validation/smoke-generated-server-surfaces.ts --env "$AUTHRIM_ENV_NAME"

      - name: Deployment summary
        if: success()
        env:
          GIT_REF: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          echo "✅ Successfully deployed and validated $AUTHRIM_HOSTNAME"
          echo "Environment: $AUTHRIM_ENV_NAME"
          echo "Branch: $GIT_REF"
          echo "Commit: $GIT_SHA"
