name: Release Supply Chain Evidence

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  agent-access-evidence:
    name: Agent Access SBOM and Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Agent Access
        run: pnpm --filter @authrim/ar-agent-access build

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: authrim.spdx.json
          artifact-name: authrim-sbom.spdx.json
          upload-release-assets: false

      - name: Attest Agent Access build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: packages/ar-agent-access/dist/**

      - name: Attest Agent Access SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: packages/ar-agent-access/dist/**
          sbom-path: authrim.spdx.json
