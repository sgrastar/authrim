openapi: 3.2.0
info:
  title: Authrim Async Authorization API
  version: 0.4.2
  summary: Device Authorization and CIBA endpoints.
  description: Initial OpenAPI contract for `@authrim/ar-async`.
servers:
  - url: https://{tenant_domain}
    variables:
      tenant_domain:
        default: auth.example.com
tags:
  - name: Device Authorization
  - name: CIBA
paths:
  /device_authorization:
    post:
      tags:
        - Device Authorization
      summary: Start an OAuth Device Authorization Grant.
      description: >-
        With tenant assurance enabled and a default FAL of FAL3 (with fal3_requires_par), which
        needs a pushed, signed authorization request, every request is refused with
        unauthorized_client. Assurance settings that cannot be read return 503
        temporarily_unavailable.
      requestBody:
        $ref: '#/components/requestBodies/DeviceAuthorization'
      responses:
        '200':
          $ref: '#/components/responses/DeviceAuthorization'
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /device:
    get:
      tags:
        - Device Authorization
      summary: Render the device verification page.
      responses:
        '200':
          description: HTML device verification page.
    post:
      tags:
        - Device Authorization
      summary: Submit a device user code.
      requestBody:
        $ref: '#/components/requestBodies/FormOrJson'
      responses:
        '200':
          $ref: '#/components/responses/Any'
  /api/devices/verify:
    post:
      tags:
        - Device Authorization
      summary: Verify or approve a device authorization request.
      description: >-
        A code requested before the user last withdrew the client's consent cannot be approved:
        400 consent_withdrawn, and the device has to start again. Consent state that cannot be
        read returns 503 temporarily_unavailable and leaves the code pending. The per-IP user code
        rate limit fails closed: without a working rate limiter, or when the device code store
        cannot answer, the code is not read and the response is 503 temporarily_unavailable.
      security:
        - sessionCookie: []
        - sessionHeader: []
      requestBody:
        $ref: '#/components/requestBodies/DeviceVerify'
      responses:
        '200':
          $ref: '#/components/responses/DeviceVerify'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/devices/lookup:
    post:
      tags:
        - Device Authorization
      summary: Show which application a pending user code belongs to.
      description: >-
        Lets the signed-in user see the application and the scopes a user code asks for before
        deciding it with /api/devices/verify. It decides nothing. It needs the same session as the
        decision, and a code that does not exist counts against the same per-IP user code rate
        limit (429 slow_down once blocked). A code that is no longer pending returns 400
        invalid_code with its state in code_status (approved, denied or expired) and
        decided_by_self, true only when the signed-in user is the one who approved it (a denial
        records no user), so a browser that lost the answer to its approval can tell whether it
        was saved; who else decided a code is never disclosed. An unknown or expired code returns
        404 invalid_code. Without a working rate
        limiter, or when the device code store cannot answer, it returns 503
        temporarily_unavailable.
      security:
        - sessionCookie: []
        - sessionHeader: []
      requestBody:
        $ref: '#/components/requestBodies/DeviceLookup'
      responses:
        '200':
          $ref: '#/components/responses/DeviceLookup'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /bc-authorize:
    post:
      tags:
        - CIBA
      summary: Start a CIBA backchannel authentication request.
      description: >-
        With tenant assurance enabled and a default FAL of FAL3 (with fal3_requires_par), which
        needs a pushed, signed authorization request, every request is refused with
        unauthorized_client. Assurance settings that cannot be read return 503
        temporarily_unavailable.
      requestBody:
        $ref: '#/components/requestBodies/CibaAuthorization'
      responses:
        '200':
          $ref: '#/components/responses/CibaAuthorization'
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/ciba/pending:
    get:
      tags:
        - CIBA
      summary: List pending CIBA requests for the current user/session.
      description: >-
        The pending, unexpired requests addressed to the signed-in user, across clients: by the
        subject resolved from a signed hint or, failing that, by its login_hint. At most 50 are
        returned, oldest first among those found; a user with more sees the rest as earlier ones
        are decided or expire. The user is taken from the session, never from parameters; a
        login_hint or user_id naming someone else is refused with 403. When the store cannot
        produce a complete list right now (its address index is being brought up to date), the
        response is 503 temporarily_unavailable rather than a partial list: retry. created_at
        and expires_at are epoch milliseconds.
      security:
        - sessionCookie: []
        - sessionHeader: []
      responses:
        '200':
          $ref: '#/components/responses/CibaPending'
        '401':
          $ref: '#/components/responses/CibaAuthenticationRequired'
        '403':
          $ref: '#/components/responses/CibaInsufficientPermissions'
        '503':
          $ref: '#/components/responses/Error'
  /api/ciba/requests/{auth_req_id}:
    get:
      tags:
        - CIBA
      summary: Get a pending CIBA request.
      security:
        - sessionCookie: []
        - sessionHeader: []
      parameters:
        - name: auth_req_id
          in: path
          required: true
          schema:
            type: string
      description: >-
        One request of the signed-in user. 404 when it does not exist (or expired and was
        removed); 503 temporarily_unavailable when the store cannot be read right now.
      responses:
        '200':
          $ref: '#/components/responses/CibaDetails'
        '401':
          $ref: '#/components/responses/CibaAuthenticationRequired'
        '403':
          $ref: '#/components/responses/CibaInsufficientPermissions'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/ciba/approve:
    post:
      tags:
        - CIBA
      summary: Approve a CIBA request.
      description: >-
        A request made before the user last withdrew the client's consent cannot be approved: 400
        consent_withdrawn, and the client has to start again. Consent state that cannot be read
        returns 503 temporarily_unavailable and leaves the request pending.
      security:
        - sessionCookie: []
        - sessionHeader: []
      requestBody:
        $ref: '#/components/requestBodies/CibaDecision'
      responses:
        '200':
          $ref: '#/components/responses/CibaDecision'
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/CibaAuthenticationRequired'
        '403':
          $ref: '#/components/responses/CibaInsufficientPermissions'
  /api/ciba/deny:
    post:
      tags:
        - CIBA
      summary: Deny a CIBA request.
      security:
        - sessionCookie: []
        - sessionHeader: []
      requestBody:
        $ref: '#/components/requestBodies/CibaDecision'
      responses:
        '200':
          $ref: '#/components/responses/CibaDecision'
        '401':
          $ref: '#/components/responses/CibaAuthenticationRequired'
        '403':
          $ref: '#/components/responses/CibaInsufficientPermissions'
  /api/ciba/conformance-action:
    post:
      tags:
        - CIBA
      summary: Execute a short-lived capability-authorized CIBA conformance action.
      description: Internal automation endpoint available only after an expiring capability is provisioned.
      parameters:
        - name: secret
          in: query
          required: true
          schema:
            type: string
            minLength: 32
        - name: auth_req_id
          in: query
          required: true
          schema:
            type: string
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [allow, deny]
      responses:
        '200':
          description: Action completed.
        '401':
          description: Capability is invalid or expired.
  /api/ciba/test:
    get:
      tags:
        - CIBA
      summary: Render the CIBA test console.
      description: >-
        Available only when ENABLE_TEST_ENDPOINTS is `true`. Returns 404 otherwise, including in
        normal production mode.
      responses:
        '200':
          description: HTML CIBA test console.
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Test endpoints are disabled.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: authrim_session
    sessionHeader:
      type: apiKey
      in: header
      name: X-Session-Id
  requestBodies:
    JsonObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    FormOrJson:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
        application/x-www-form-urlencoded:
          schema:
            type: object
            additionalProperties: true
    DeviceAuthorization:
      required: false
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/DeviceAuthorizationRequest'
          example:
            client_id: client_123
            scope: openid profile email
    DeviceVerify:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceVerifyRequest'
          example:
            user_code: WDJB-MJHT
            approve: true
    DeviceLookup:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceLookupRequest'
          example:
            user_code: WDJB-MJHT
    CibaAuthorization:
      required: false
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/CibaAuthorizationRequest'
          example:
            scope: openid profile email
            client_id: client_123
            login_hint: user@example.com
            binding_message: Approve sign-in
    CibaDecision:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CibaDecisionRequest'
          example:
            auth_req_id: auth_req_123
            user_id: user_123
  responses:
    Error:
      description: OAuth error response.
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: string
              error_description:
                type: string
    Ok:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Any:
      description: Successful JSON or HTML response.
    DeviceAuthorization:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceAuthorizationResponse'
          example:
            device_code: GmRhmhcxhwAzkoEqiMEg_DnyEysNkuNhszIySk9eS
            user_code: WDJB-MJHT
            verification_uri: https://auth.example.com/device
            verification_uri_complete: https://auth.example.com/device?user_code=WDJB-MJHT&tenant_hint=tenant_123
            expires_in: 600
            interval: 5
    DeviceVerify:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceVerifyResponse'
          example:
            success: true
            message: Device authorized successfully
    DeviceLookup:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceLookupResponse'
          example:
            client_id: client_123
            client_name: Acme TV
            client_uri: https://tv.example.com
            logo_uri: https://tv.example.com/logo.png
            scopes:
              - openid
              - profile
            expires_at: 1770000600000
    CibaAuthorization:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CibaAuthorizationResponse'
          example:
            auth_req_id: 1c266114-a1be-4252-8ad1-04986c5b9ac1
            expires_in: 300
            interval: 5
    CibaPending:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CibaPendingResponse'
          example:
            requests:
              - auth_req_id: auth_req_123
                client_id: client_123
                client_name: Example App
                client_logo_uri: https://example.com/logo.png
                scope: openid profile email
                binding_message: Approve sign-in
                user_code: '123456'
                created_at: 1770000000000
                expires_at: 1770000300000
                status: pending
    CibaDetails:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CibaDetailsResponse'
          example:
            auth_req_id: auth_req_123
            client:
              client_id: client_123
              client_name: Example App
              logo_uri: https://example.com/logo.png
              is_trusted: false
            scope: openid profile email
            binding_message: Approve sign-in
            user_code: '123456'
            created_at: 1770000000000
            expires_at: 1770000300000
            time_remaining: 240
            status: pending
    CibaDecision:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CibaDecisionResponse'
          example:
            success: true
            message: Authentication request approved
    CibaAuthenticationRequired:
      description: An authenticated end-user session is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CibaErrorResponse'
          example:
            error: login_required
            error_description: Authentication is required
    CibaInsufficientPermissions:
      description: The authenticated user does not own the CIBA request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CibaErrorResponse'
          example:
            error: access_denied
            error_description: Insufficient permissions
  schemas:
    CibaErrorResponse:
      type: object
      properties:
        error:
          type: string
        error_description:
          type: string
      required:
        - error
        - error_description
      additionalProperties: true
    DeviceAuthorizationRequest:
      type: object
      properties:
        client_id:
          type: string
          example: client_123
        scope:
          type: string
          example: openid profile email
      required:
        - client_id
    DeviceAuthorizationResponse:
      type: object
      properties:
        device_code:
          type: string
          example: GmRhmhcxhwAzkoEqiMEg_DnyEysNkuNhszIySk9eS
        user_code:
          type: string
          example: WDJB-MJHT
        verification_uri:
          type: string
          format: uri
          example: https://auth.example.com/device
        verification_uri_complete:
          type: string
          format: uri
          example: https://auth.example.com/device?user_code=WDJB-MJHT&tenant_hint=tenant_123
        expires_in:
          type: integer
          example: 600
        interval:
          type: integer
          example: 5
      required:
        - device_code
        - user_code
        - verification_uri
        - verification_uri_complete
        - expires_in
        - interval
    DeviceVerifyRequest:
      type: object
      properties:
        user_code:
          type: string
          example: WDJB-MJHT
        approve:
          type: boolean
          default: true
          example: true
        user_id:
          type: string
          example: user_123
        sub:
          type: string
          example: user@example.com
      required:
        - user_code
    DeviceVerifyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Device authorized successfully
        error:
          type: string
          example: invalid_code
        error_description:
          type: string
          example: Invalid or expired user code
      required:
        - success
    DeviceLookupRequest:
      type: object
      properties:
        user_code:
          type: string
          example: WDJB-MJHT
      required:
        - user_code
    DeviceLookupResponse:
      type: object
      properties:
        client_id:
          type: string
          example: client_123
        client_name:
          type: string
          example: Acme TV
        client_uri:
          type: string
          format: uri
          example: https://tv.example.com
        logo_uri:
          type: string
          format: uri
          example: https://tv.example.com/logo.png
        scopes:
          type: array
          items:
            type: string
          example:
            - openid
            - profile
        expires_at:
          type: integer
          description: Epoch milliseconds.
          example: 1770000600000
      required:
        - client_id
        - client_name
        - scopes
        - expires_at
    CibaAuthorizationRequest:
      type: object
      properties:
        scope:
          type: string
          example: openid profile email
        client_id:
          type: string
          example: client_123
        client_secret:
          type: string
          example: client_secret
        login_hint:
          type: string
          example: user@example.com
        binding_message:
          type: string
          example: Approve sign-in to Example App
        user_code:
          type: string
          example: '123456'
        requested_expiry:
          type: integer
          example: 300
      required:
        - scope
        - client_id
    CibaAuthorizationResponse:
      type: object
      properties:
        auth_req_id:
          type: string
          example: 1c266114-a1be-4252-8ad1-04986c5b9ac1
        expires_in:
          type: integer
          example: 300
        interval:
          type: integer
          example: 5
      required:
        - auth_req_id
        - expires_in
    CibaPendingResponse:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/CibaPendingRequest'
      required:
        - requests
    CibaPendingRequest:
      type: object
      properties:
        auth_req_id:
          type: string
          example: auth_req_123
        client_id:
          type: string
          example: client_123
        client_name:
          type: string
          example: Example App
        client_logo_uri:
          type:
            - string
            - 'null'
          example: https://example.com/logo.png
        scope:
          type: string
          example: openid profile email
        binding_message:
          type:
            - string
            - 'null'
          example: Approve sign-in
        user_code:
          type:
            - string
            - 'null'
          example: '123456'
        created_at:
          type: integer
          description: Epoch milliseconds.
          example: 1770000000000
        expires_at:
          type: integer
          description: Epoch milliseconds.
          example: 1770000300000
        status:
          type: string
          example: pending
    CibaDetailsResponse:
      type: object
      properties:
        auth_req_id:
          type: string
          example: auth_req_123
        client:
          type: object
          properties:
            client_id:
              type: string
              example: client_123
            client_name:
              type: string
              example: Example App
            logo_uri:
              type:
                - string
                - 'null'
              example: https://example.com/logo.png
            is_trusted:
              type: boolean
              example: false
        scope:
          type: string
          example: openid profile email
        binding_message:
          type:
            - string
            - 'null'
          example: Approve sign-in
        user_code:
          type:
            - string
            - 'null'
          example: '123456'
        created_at:
          type: integer
          description: Epoch milliseconds.
          example: 1770000000000
        expires_at:
          type: integer
          description: Epoch milliseconds.
          example: 1770000300000
        time_remaining:
          type: integer
          description: Seconds until expires_at.
          example: 240
        status:
          type: string
          example: pending
      required:
        - auth_req_id
        - client
        - scope
        - created_at
        - expires_at
        - time_remaining
        - status
    CibaDecisionRequest:
      type: object
      properties:
        auth_req_id:
          type: string
          example: auth_req_123
        user_id:
          type: string
          example: user_123
        sub:
          type: string
          example: user@example.com
        nonce:
          type: string
          example: nonce_123
        reason:
          type: string
          example: user_denied
      required:
        - auth_req_id
    CibaDecisionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Authentication request approved
        error:
          type: string
          example: invalid_request
        error_description:
          type: string
          example: auth_req_id is required
        retry_after:
          type: integer
          example: 60
      required:
        - success
