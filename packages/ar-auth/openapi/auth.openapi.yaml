                - directory_unavailable
            transaction_id:
              type: string
              example: damt_recovery_123
            transaction_token:
              type: string
              example: recovery-transaction-token
            expires_at:
              type: integer
              example: 1770000600000
            masked_email:
              type: string
              example: al***@example.com
          required:
            - required
            - reason
            - transaction_id
            - transaction_token
            - expires_at
            - masked_email
