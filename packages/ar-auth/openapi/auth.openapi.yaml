components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: authrim_session
  parameters:
    ClientIdQuery:
      name: client_id
      in: query
      required: false
      schema:
        type: string
  requestBodies:
    JsonObject:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonObject'
    FormOrJson:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonObject'
        application/x-www-form-urlencoded:
          schema:
            type: object
            additionalProperties: true
    PushedAuthorization:
      required: false
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/PushedAuthorizationRequest'
          example:
            client_id: client_123
            redirect_uri: https://app.example.com/callback
            response_type: code
            scope: openid profile email
            code_challenge: rfc7636-code-challenge
            code_challenge_method: S256
    PasskeyRegisterOptions:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasskeyRegisterOptionsRequest'
          example:
            email: user@example.com
            name: Example User
    PasskeyRegisterVerify:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasskeyRegisterVerifyRequest'
          example:
            userId: user_123
            credential:
              id: credential-id
              type: public-key
              response: {}
            deviceName: MacBook Pro
    PasskeyLoginOptions:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasskeyLoginOptionsRequest'
          example: {}
    PasskeyLoginVerify:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasskeyLoginVerifyRequest'
          example:
            challengeId: challenge_123
            credential:
              id: credential-id
              type: public-key
              response: {}
    EmailCodeSend:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailCodeSendRequest'
          example:
            email: user@example.com
    EmailCodeVerify:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailCodeVerifyRequest'
          example:
            email: user@example.com
            code: '123456'
    TotpLoginStart:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TotpLoginStartRequest'
          example:
            identifier: user@example.com
    TotpLoginVerify:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TotpLoginVerifyRequest'
          example:
            challenge_id: 2c2f1c47-9f40-4bc1-a5e3-a19f1cb1a44e
            code: '123456'
            authorization_challenge_id: ach_123
            defer_authorization_continuation: false
    TotpSignupOptions:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TotpSignupOptionsRequest'
          example:
            email: user@example.com
            name: Example User
            label: Authenticator app
            custom_fields: {}
    TotpSignupActivate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TotpSignupActivateRequest'
          example:
            challenge_id: 2c2f1c47-9f40-4bc1-a5e3-a19f1cb1a44e
            code: '123456'
    DirectoryPasswordLogin:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DirectoryPasswordLoginRequest'
          example:
            username: alice
            password: correct-horse-battery-staple
            invite_token: invite-token-if-admin-invitation-fallback-is-required
    DirectoryMigrationPasskeyOptions:
