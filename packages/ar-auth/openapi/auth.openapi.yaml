          type: string
          example: MacBook Pro
      required:
        - userId
        - credential
    PasskeyRegisterVerifyResponse:
      type: object
      properties:
        verified:
          type: boolean
          example: true
        passkeyId:
          type: string
          example: passkey_123
        sessionId:
          type: string
          example: sess_123
        message:
          type: string
          example: Passkey registered successfully
        userId:
          type: string
          example: user_123
        user:
          $ref: '#/components/schemas/AuthUser'
      required:
        - verified
        - passkeyId
        - sessionId
        - message
        - userId
        - user
    PasskeyLoginOptionsRequest:
      type: object
