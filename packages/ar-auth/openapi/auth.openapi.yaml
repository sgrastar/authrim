openapi: 3.2.0
info:
  title: Authrim Authentication API
  version: 0.3.3
  summary: Browser and API authentication endpoints.
  description: >
    Initial OpenAPI contract for endpoints owned by `@authrim/ar-auth`. This document intentionally
    contains route contracts only; do not add secrets, private test credentials, or vulnerability
    notes.
  x-authrim-coverage: initial route inventory
servers:
  - url: https://{tenant_domain}
    variables:
      tenant_domain:
        default: auth.example.com
tags:
  - name: Health
  - name: OAuth
  - name: Passkeys
  - name: Email Codes
  - name: TOTP
  - name: Directory Password
  - name: DID
  - name: Anonymous Login
  - name: Upgrade
  - name: Consent
  - name: Sessions
  - name: Logout
  - name: DID Auth
  - name: Login Challenges
  - name: Login Runtime
  - name: Direct Auth
  - name: Invitations
  - name: Registration
  - name: Auth
paths:
  /api/auth/health:
    get:
      tags:
        - Health
      summary: Return authentication Worker health.
      responses:
        '200':
          $ref: '#/components/responses/AuthHealth'
  /authorize:
    get:
      tags:
        - OAuth
      summary: Start or continue an OAuth/OIDC authorization request.
      parameters:
        - $ref: '#/components/parameters/ClientIdQuery'
        - name: redirect_uri
          in: query
          schema:
            type: string
        - name: response_type
          in: query
          schema:
            type: string
        - name: scope
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Any'
        '302':
          description: Redirect response.
    post:
      tags:
        - OAuth
      summary: Submit an OAuth/OIDC authorization request.
      requestBody:
        $ref: '#/components/requestBodies/FormOrJson'
      responses:
        '200':
          $ref: '#/components/responses/Any'
        '302':
          description: Redirect response.
  /par:
    post:
      tags:
        - OAuth
      summary: Create a pushed authorization request.
      requestBody:
        $ref: '#/components/requestBodies/PushedAuthorization'
      responses:
        '201':
          $ref: '#/components/responses/PushedAuthorization'
        '400':
          $ref: '#/components/responses/Error'
      description: Stores OAuth/OIDC authorization parameters and returns a request_uri per RFC 9126.
    get:
      tags:
        - Auth
      operationId: getPar
      summary: Reject non-POST PAR requests.
      description: The pushed authorization request endpoint only supports POST. GET returns a
        method-not-allowed OAuth-style error.
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /flow/login:
    get:
      tags:
        - OAuth
      summary: Render a built-in login flow page when enabled.
      responses:
        '200':
          $ref: '#/components/responses/Any'
    post:
      tags:
        - OAuth
      summary: Submit a built-in login flow step when enabled.
      requestBody:
        $ref: '#/components/requestBodies/FormOrJson'
      responses:
        '200':
          $ref: '#/components/responses/Any'
  /flow/confirm:
    get:
      tags:
        - OAuth
      summary: Render a built-in confirmation step when enabled.
      responses:
        '200':
          $ref: '#/components/responses/Any'
    post:
      tags:
        - OAuth
      summary: Submit a built-in confirmation step when enabled.
      requestBody:
        $ref: '#/components/requestBodies/FormOrJson'
      responses:
        '200':
          $ref: '#/components/responses/Any'
  /api/auth/passkeys/register/options:
    post:
      tags:
        - Passkeys
      summary: Create WebAuthn registration options.
      requestBody:
        $ref: '#/components/requestBodies/PasskeyRegisterOptions'
      responses:
        '200':
          $ref: '#/components/responses/PasskeyRegisterOptions'
  /api/auth/passkeys/register/verify:
    post:
      tags:
        - Passkeys
      summary: Verify WebAuthn registration and create a session.
      requestBody:
        $ref: '#/components/requestBodies/PasskeyRegisterVerify'
      responses:
        '200':
          $ref: '#/components/responses/PasskeyRegisterVerify'
  /api/auth/passkeys/login/options:
    post:
      tags:
        - Passkeys
      summary: Create discoverable WebAuthn login options.
      requestBody:
        $ref: '#/components/requestBodies/PasskeyLoginOptions'
      responses:
        '200':
          $ref: '#/components/responses/PasskeyLoginOptions'
  /api/auth/passkeys/login/verify:
    post:
      tags:
        - Passkeys
      summary: Verify WebAuthn login and create a session.
      requestBody:
        $ref: '#/components/requestBodies/PasskeyLoginVerify'
      responses:
        '200':
          $ref: '#/components/responses/PasskeyLoginVerify'
  /api/auth/email-codes/send:
    post:
      tags:
        - Email Codes
      summary: Send an email verification code.
      requestBody:
        $ref: '#/components/requestBodies/EmailCodeSend'
      responses:
        '200':
          $ref: '#/components/responses/EmailCodeSend'
  /api/auth/email-codes/verify:
    post:
      tags:
        - Email Codes
      summary: Verify an email code and create a session.
      requestBody:
        $ref: '#/components/requestBodies/EmailCodeVerify'
      responses:
        '200':
          $ref: '#/components/responses/EmailCodeVerify'
  /api/auth/totp/login/start:
    post:
      tags:
        - TOTP
      summary: Start TOTP login.
      description: Creates a short-lived TOTP login challenge for an email or username identifier.
      requestBody:
        $ref: '#/components/requestBodies/TotpLoginStart'
      responses:
        '200':
          $ref: '#/components/responses/TotpLoginStart'
        '400':
          $ref: '#/components/responses/Error'
  /api/auth/totp/login/verify:
    post:
      tags:
        - TOTP
      summary: Verify TOTP login.
      description: Verifies a TOTP code, creates an Authrim browser session, and optionally continues an OIDC authorization challenge.
      requestBody:
        $ref: '#/components/requestBodies/TotpLoginVerify'
      responses:
        '200':
          $ref: '#/components/responses/TotpSession'
        '400':
          $ref: '#/components/responses/Error'
  /api/auth/totp/signup/options:
    post:
      tags:
        - TOTP
      summary: Start TOTP signup.
      description: Creates a short-lived TOTP enrollment challenge, synthetic pending credential metadata, secret, and otpauth URI for first-code activation. The user and stored credential are created when activation succeeds.
      requestBody:
        $ref: '#/components/requestBodies/TotpSignupOptions'
      responses:
        '201':
          $ref: '#/components/responses/TotpSignupOptions'
        '400':
          $ref: '#/components/responses/Error'
  /api/auth/totp/signup/activate:
    post:
      tags:
        - TOTP
      summary: Activate TOTP signup.
      description: Verifies the first TOTP code, creates and activates the stored credential, generates backup codes, and creates a browser session.
      requestBody:
        $ref: '#/components/requestBodies/TotpSignupActivate'
      responses:
        '200':
          $ref: '#/components/responses/TotpSignupActivate'
        '400':
          $ref: '#/components/responses/Error'
  /api/auth/directory-password/login:
    post:
      tags:
        - Directory Password
      summary: Authenticate with a directory password and create a managed browser session.
      requestBody:
        $ref: '#/components/requestBodies/DirectoryPasswordLogin'
      responses:
        '200':
          $ref: '#/components/responses/DirectoryPasswordLogin'
  /api/auth/directory-password/migration/passkey/options:
    post:
      tags:
        - Directory Password
      summary: Create WebAuthn registration options for a directory password migration transaction.
      requestBody:
        $ref: '#/components/requestBodies/DirectoryMigrationPasskeyOptions'
      responses:
        '200':
          $ref: '#/components/responses/Any'
        '400':
          $ref: '#/components/responses/Any'
        '401':
          $ref: '#/components/responses/Any'
        '403':
          $ref: '#/components/responses/Any'
  /api/auth/directory-password/migration/passkey/verify:
    post:
      tags:
        - Directory Password
      summary: Verify WebAuthn registration for a directory password migration transaction and create a session.
      requestBody:
        $ref: '#/components/requestBodies/DirectoryMigrationPasskeyVerify'
      responses:
        '200':
          $ref: '#/components/responses/DirectoryPasswordLogin'
        '400':
          $ref: '#/components/responses/Any'
        '401':
          $ref: '#/components/responses/Any'
        '403':
          $ref: '#/components/responses/Any'
  /api/auth/directory-password/migration/email-code/send:
    post:
      tags:
        - Directory Password
      summary: Send an email code for a directory password migration fallback or recovery transaction.
      requestBody:
        $ref: '#/components/requestBodies/DirectoryMigrationEmailCodeSend'
      responses:
        '200':
          $ref: '#/components/responses/Any'
        '400':
          $ref: '#/components/responses/Any'
        '401':
          $ref: '#/components/responses/Any'
        '403':
          $ref: '#/components/responses/Any'
        '429':
          $ref: '#/components/responses/Any'
  /api/auth/directory-password/migration/email-code/verify:
    post:
      tags:
        - Directory Password
      summary: Verify an email code for a directory password migration fallback or recovery transaction and create a session.
      requestBody:
        $ref: '#/components/requestBodies/DirectoryMigrationEmailCodeVerify'
      responses:
        '200':
          $ref: '#/components/responses/DirectoryPasswordLogin'
        '400':
          $ref: '#/components/responses/Any'
        '401':
          $ref: '#/components/responses/Any'
        '403':
          $ref: '#/components/responses/Any'
  /api/auth/directory-connectors/heartbeat/{tenantId}/{connectorId}:
    post:
      tags:
        - Directory Password
      summary: Record a Wordwarden connector instance heartbeat.
      description: >
        Accepts a small HMAC-signed heartbeat from Authrim Wordwarden direct or tunnel transports.
        The heartbeat key is separate from the password verification key. The payload must not
        contain user PII, LDAP secrets, or raw LDAP internal values.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: connectorId
          in: path
          required: true
          schema:
            type: string
            pattern: '^wwcon_[a-zA-Z0-9]{16}$'
        - name: X-Authrim-Heartbeat-Key-Id
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
        - name: X-Authrim-Heartbeat-Timestamp
          in: header
          required: true
          schema:
            type: string
          description: Unix epoch milliseconds or ISO-8601 timestamp within the accepted clock skew.
        - name: X-Authrim-Heartbeat-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: '^(sha256=)?[a-fA-F0-9]{64}$'
      requestBody:
        $ref: '#/components/requestBodies/DirectoryConnectorHeartbeat'
      responses:
        '200':
          $ref: '#/components/responses/DirectoryConnectorHeartbeat'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
  /api/auth/directory-relay/connect/{tenantId}/{connectorId}:
    get:
      tags:
        - Directory Password
      summary: Register a Wordwarden outbound relay WebSocket connection.
      description: >
        Upgrades to a WebSocket used by Authrim Wordwarden for outbound directory password
        verification relay. The connector authenticates inside the WebSocket protocol with a
        short-lived HMAC challenge response.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: connectorId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]{1,64}$'
      responses:
        '101':
          description: WebSocket connection accepted.
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '426':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/auth/dids/challenge:
    post:
      tags:
        - DID
      summary: Create a DID authentication challenge.
      requestBody:
        $ref: '#/components/requestBodies/DIDChallenge'
      responses:
        '200':
          $ref: '#/components/responses/DIDChallenge'
  /api/auth/dids/verify:
    post:
      tags:
        - DID
      summary: Verify a DID authentication proof and create a session.
      requestBody:
        $ref: '#/components/requestBodies/DIDVerify'
      responses:
        '200':
          $ref: '#/components/responses/DIDVerify'
  /api/auth/dids:
    get:
      tags:
        - DID
      summary: List linked DIDs for the current session.
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/DIDList'
  /api/auth/dids/{did}:
    delete:
      tags:
        - DID
      summary: Unlink a DID from the current session.
      security:
        - sessionCookie: []
      parameters:
        - name: did
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/DIDUnlink'
  /api/auth/anon-login/challenge:
    post:
      tags:
        - Anonymous Login
      summary: Create an anonymous-login challenge.
      requestBody:
        $ref: '#/components/requestBodies/AnonLoginChallenge'
      responses:
        '200':
          $ref: '#/components/responses/AnonLoginChallenge'
  /api/auth/anon-login/verify:
    post:
      tags:
        - Anonymous Login
      summary: Verify anonymous-login challenge and create or resume an anonymous session.
      requestBody:
        $ref: '#/components/requestBodies/AnonLoginVerify'
      responses:
        '200':
          $ref: '#/components/responses/AnonLoginVerify'
  /api/auth/upgrade:
    post:
      tags:
        - Upgrade
      summary: Start an anonymous-user upgrade.
      requestBody:
        $ref: '#/components/requestBodies/UpgradeStart'
      responses:
        '200':
          $ref: '#/components/responses/UpgradeStart'
  /api/auth/upgrade/complete:
    post:
      tags:
        - Upgrade
      summary: Complete an anonymous-user upgrade.
      requestBody:
        $ref: '#/components/requestBodies/UpgradeComplete'
      responses:
        '200':
          $ref: '#/components/responses/UpgradeComplete'
  /api/auth/upgrade/status:
    get:
      tags:
        - Upgrade
      summary: Return anonymous-user upgrade eligibility and history.
      responses:
        '200':
          $ref: '#/components/responses/UpgradeStatus'
  /api/auth/consents:
    get:
      tags:
        - Consent
      summary: Return consent request state for a consent challenge.
      responses:
        '200':
          $ref: '#/components/responses/ConsentGet'
    post:
      tags:
        - Consent
      summary: Submit a consent decision.
      requestBody:
        $ref: '#/components/requestBodies/FormOrJson'
      responses:
        '200':
          $ref: '#/components/responses/Any'
  /auth/consent:
    get:
      tags:
        - Consent
      summary: Render built-in consent page when enabled.
      responses:
        '200':
          $ref: '#/components/responses/Any'
    post:
      tags:
        - Consent
      summary: Submit built-in consent page decision when enabled.
      requestBody:
        $ref: '#/components/requestBodies/FormOrJson'
      responses:
        '200':
          $ref: '#/components/responses/Any'
  /api/sessions:
    post:
      tags:
        - Sessions
      summary: Issue a short-lived session handoff token.
      requestBody:
        $ref: '#/components/requestBodies/SessionIssue'
      responses:
        '200':
          $ref: '#/components/responses/SessionIssue'
  /api/sessions/verify:
    post:
      tags:
        - Sessions
      summary: Verify a session handoff token and create an RP session.
      requestBody:
        $ref: '#/components/requestBodies/SessionVerify'
      responses:
        '200':
          $ref: '#/components/responses/SessionVerify'
  /api/sessions/status:
    get:
      tags:
        - Sessions
      summary: Return current browser session status.
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/SessionStatus'
  /api/sessions/refresh:
    post:
      tags:
        - Sessions
      summary: Refresh current browser session expiration.
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/SessionRefresh'
  /session/check:
    get:
      tags:
        - Sessions
      summary: OIDC Session Management check-session iframe endpoint.
      responses:
        '200':
          $ref: '#/components/responses/Any'
  /logout:
    get:
      tags:
        - Logout
      summary: Start front-channel logout.
      responses:
        '200':
          $ref: '#/components/responses/Any'
        '302':
          description: Redirect response.
  /logout/backchannel:
    post:
      tags:
        - Logout
      summary: Receive OIDC back-channel logout token.
      requestBody:
        $ref: '#/components/requestBodies/FormOrJson'
      responses:
        '200':
          $ref: '#/components/responses/Any'
  /api/auth/dids/register/challenge:
    post:
      tags:
        - DID Auth
      operationId: postApiAuthDidsRegisterChallenge
      summary: Create a DID registration challenge for the current session.
      description:
        Creates a DID proof challenge for an authenticated browser session so the DID can be
        linked to the current user.
      responses:
        '200':
          $ref: '#/components/responses/DIDRegisterChallenge'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      requestBody:
        $ref: '#/components/requestBodies/DIDRegisterChallenge'
      security:
        - sessionCookie: []
  /api/auth/dids/register/verify:
    post:
      tags:
        - DID Auth
      operationId: postApiAuthDidsRegisterVerify
      summary: Verify and link a DID registration proof.
      description:
        Verifies the DID proof for a prior registration challenge and links the DID to the
        current authenticated session user.
      responses:
        '200':
          $ref: '#/components/responses/DIDRegisterVerify'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      requestBody:
        $ref: '#/components/requestBodies/DIDRegisterVerify'
      security:
        - sessionCookie: []
  /api/auth/login-challenges:
    get:
      tags:
        - Login Challenges
      operationId: getApiAuthLoginChallenges
      summary: Read login challenge metadata.
      description:
        Returns client display metadata, OIDC prompt metadata, session mode, handoff methods,
        and web-origin policy for a login or re-auth challenge.
      responses:
        '200':
          $ref: '#/components/responses/LoginChallenge'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      parameters:
        - name: challenge_id
          in: query
          required: true
          schema:
            type: string
          description: Challenge id returned by the authorization flow.
  /api/v1/login/interactions/start:
    post:
      tags:
        - Login Runtime
      operationId: postApiV1LoginInteractionsStart
      summary: Start or resume a LoginUI runtime Flow interaction.
      description: >
        Creates a LoginUI runtime Flow interaction for login, registration, approve, or account flows,
        or resumes an existing interaction when a signed resume request is supplied. The endpoint is
        feature-flagged and returns a signed runtime contract without AdminUI editor state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                flow_kind:
                  type: string
                  example: login
                target_type:
                  type: string
                  enum:
                    - tenant
                    - oidc_client
                    - saml_sp
                target_id:
                  type:
                    - string
                    - 'null'
                client_id:
                  type: string
                saml_sp_id:
                  type: string
                scope:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  description: Requested scopes used to filter Flow consent policy bindings.
                requested_scope:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  description: Requested scopes used to filter Flow consent policy bindings.
                locale:
                  type: string
                  description: Preferred language for runtime Flow content.
                requested_locale:
                  type: string
                  description: Preferred language for runtime Flow content.
                authorization_challenge_id:
                  type: string
                  description: >
                    OIDC authorization login challenge to continue when the Flow completes without
                    a direct authentication endpoint returning the continuation URL.
                saml_request_id:
                  type: string
                  description: SAML IdP request identifier to continue after the Flow completes.
                saml_sp_entity_id:
                  type: string
                  description: SAML service provider entity ID for Flow protocol continuation.
                return_to:
                  type: string
                  description: LoginUI return mode associated with the protocol request.
                resume_interaction_id:
                  type: string
                contract_hash:
                  type: string
                signature:
                  type: string
      responses:
        '200':
          description: Runtime interaction state and signed contract.
          content:
            application/json:
              schema:
                type: object
                required:
                  - schema_version
                  - interaction
                  - contract
                  - contract_hash
                  - signature
                  - expires_in
                  - resumed
                properties:
                  schema_version:
                    type: string
                  interaction:
                    type: object
                    additionalProperties: true
                  assignment:
                    type: object
                    additionalProperties: true
                  contract:
                    type: object
                    additionalProperties: true
                  contract_hash:
                    type: string
                  signature:
                    type: string
                  expires_in:
                    type: integer
                  resumed:
                    type: boolean
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/login/interactions/{interaction_id}/email-verification/challenge:
    post:
      tags:
        - Login Runtime
      operationId: postApiV1LoginInteractionsInteractionIdEmailVerificationChallenge
      summary: Create an Email Verification Protocol nonce for the active runtime Flow step.
      description: >
        Returns a short-lived nonce only when mail OTP is enabled and the active Flow step is an
        explicit email-verification step, or its mail-OTP branch leads directly to one. A response
        with available=false means the client must use the normal mail-OTP path.
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - step_id
                - contract_hash
                - signature
              properties:
                step_id:
                  type: string
                contract_hash:
                  type: string
                signature:
                  type: string
      responses:
        '200':
          description: Email Verification Protocol availability and, when available, its nonce.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Set to no-store when a nonce is returned.
          content:
            application/json:
              schema:
                type: object
                required:
                  - available
                properties:
                  available:
                    type: boolean
                  challenge_id:
                    type: string
                  nonce:
                    type: string
                  expires_in:
                    type: integer
                  interaction_id:
                    type: string
                  step_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/login/interactions/{interaction_id}/submit:
    post:
      tags:
        - Login Runtime
      operationId: postApiV1LoginInteractionsInteractionIdSubmit
      summary: Submit the active LoginUI runtime Flow step.
      description: >
        Advances the active runtime Flow step after verifying CSRF, interaction state, expiry,
        contract hash, HMAC signature, and current step identity. Step input is interpreted by the
        active runtime component; consent-policy input records consent item decisions for the
        authenticated user.
      parameters:
        - name: interaction_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - step_id
                - contract_hash
                - signature
              properties:
                step_id:
                  type: string
                node_id:
                  type: string
                selected_handle:
                  type: string
                contract_hash:
                  type: string
                signature:
                  type: string
                input:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Updated runtime interaction state and next step.
          content:
            application/json:
              schema:
                type: object
                required:
                  - schema_version
                  - interaction
                  - step
                  - completed
                  - output
                properties:
                  schema_version:
                    type: string
                  interaction:
                    type: object
                    additionalProperties: true
                  step:
                    type:
                      - object
                      - 'null'
                    additionalProperties: true
                  completed:
                    type: boolean
                  output:
                    type:
                      - object
                      - 'null'
                    additionalProperties: true
                    properties:
                      action:
                        type: string
                        description: Runtime completion action, such as complete or continue_protocol.
                      redirect_url:
                        type: string
                        description: URL that LoginUI should navigate to after Flow completion.
                      protocol_continuation:
                        type: object
                        additionalProperties: true
                        description: Protocol-specific continuation metadata for OIDC, SAML, or direct flows.
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
