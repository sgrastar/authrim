      required:
        - error
    SetupTokenVerifyRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    SetupTokenVerifyResponse:
      type: object
      required:
        - valid
        - user
      properties:
        valid:
          type: boolean
          enum:
            - true
        user:
          type: object
          required:
            - id
            - email
          properties:
            id:
              type: string
            email:
              type: string
              format: email
            name:
              type:
                - string
                - 'null'
    FlowCancelRequest:
      type: object
      required:
        - sessionId
      properties:
        sessionId:
          type: string
    FlowCancelResponse:
      oneOf:
        - type: object
          required:
            - success
            - sessionId
          properties:
            success:
              type: boolean
              enum:
                - true
            sessionId:
              type: string
        - type: object
          required:
            - success
            - error
          properties:
            success:
              type: boolean
              enum:
                - false
            error:
              $ref: '#/components/schemas/FlowError'
    FlowInitRequest:
      type: object
      required:
        - flowType
        - clientId
      properties:
        flowType:
          type: string
          enum:
            - login
            - authorization
            - consent
            - logout
        clientId:
          type: string
        tenantId:
          type: string
        oauthParams:
          $ref: '#/components/schemas/OAuthFlowParams'
    OAuthFlowParams:
      type: object
      properties:
        responseType:
          type: string
        redirectUri:
          type: string
          format: uri
        scope:
          type: string
        state:
          type: string
        nonce:
          type: string
        codeChallenge:
          type: string
        codeChallengeMethod:
          type: string
        acrValues:
          type: string
        loginHint:
          type: string
        prompt:
          type: string
        maxAge:
          type: integer
      additionalProperties: false
    FlowInitResponse:
      type: object
      required:
        - sessionId
        - uiContractVersion
        - uiContract
      properties:
        sessionId:
          type: string
        uiContractVersion:
          type: string
          enum:
            - '0.1'
        uiContract:
          $ref: '#/components/schemas/UIContract'
    UIContract:
      type: object
      description: Server-driven Flow Engine UI contract for the current node.
      additionalProperties: true
      properties:
        version:
          type: string
        sessionId:
          type: string
        nodeId:
          type: string
        capabilities:
          type: array
          items:
            type: object
            additionalProperties: true
    FlowSubmitRequest:
      type: object
      required:
        - sessionId
        - requestId
        - capabilityId
        - response
      properties:
        sessionId:
          type: string
        requestId:
          type: string
        capabilityId:
          type: string
        response:
          description: Capability-specific response payload.
        tenantId:
          type: string
        clientId:
          type: string
    FlowSubmitResponse:
      oneOf:
        - type: object
          required:
            - type
            - uiContract
          properties:
            type:
              type: string
              enum:
                - continue
            uiContract:
              $ref: '#/components/schemas/UIContract'
        - type: object
          required:
            - type
            - redirect
          properties:
            type:
              type: string
              enum:
                - redirect
            redirect:
              $ref: '#/components/schemas/FlowRedirect'
        - type: object
          required:
            - type
            - error
          properties:
            type:
              type: string
              enum:
                - error
            error:
              $ref: '#/components/schemas/FlowError'
    FlowRedirect:
      type: object
      required:
        - url
        - method
      properties:
        url:
          type: string
          format: uri
        method:
          type: string
          enum:
            - GET
            - POST
        params:
          type: object
          additionalProperties:
            type: string
    FlowError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    MethodNotAllowedError:
      allOf:
        - $ref: '#/components/schemas/Error'
      example:
        error: invalid_request
        error_description: Method not allowed
    LoginChallengeResponse:
      type: object
      required:
        - challenge_id
        - client
        - session_mode
        - handoff_methods
        - web_origin_registry
      properties:
        challenge_id:
          type: string
          example: chal_123
        client:
          type: object
          required:
            - client_id
            - client_name
          properties:
            client_id:
              type: string
              example: client_123
            client_name:
              type: string
              example: Example App
            logo_uri:
              type: string
              format: uri
              example: https://app.example.com/logo.png
            client_uri:
              type: string
              format: uri
              example: https://app.example.com/
            policy_uri:
              type: string
              format: uri
              example: https://app.example.com/privacy
            tos_uri:
              type: string
              format: uri
              example: https://app.example.com/terms
        scope:
          type: string
          example: openid profile email
        login_hint:
          type: string
          example: user@example.com
        oidc:
          type: object
          properties:
            prompt:
              type: string
              example: login
            max_age:
              type: integer
              example: 3600
            acr_values:
              type: array
              items:
                type: string
              example:
                - urn:mace:incommon:iap:bronze
            nonce_present:
              type: boolean
              example: true
            claims_present:
              type: boolean
              example: false
        session_mode:
          type: string
          enum:
            - managed_browser_session
            - cookie_session
            - token_session
          example: managed_browser_session
        handoff_methods:
          type: array
          items:
            type: string
            enum:
              - cookie_session_finalize
              - dpop_token_verify
          example:
            - cookie_session_finalize
        web_origin_registry:
          type: object
          required:
            - origins
          properties:
            origins:
              type: array
              items:
                type: object
                required:
                  - origin
                  - client_ids
                  - cors
                  - csp
                  - handoff_allowed
                  - iframe_allowed
                properties:
                  origin:
                    type: string
                    format: uri
                    example: https://app.example.com
                  client_ids:
                    type: array
                    items:
                      type: string
                    example:
                      - client_123
                  cors:
                    type: object
                    properties:
                      allowed:
                        type: boolean
                        example: true
                  csp:
                    type: object
                    properties:
                      frame_ancestors:
                        type: array
                        items:
                          type: string
                        example:
                          - https://app.example.com
                  handoff_allowed:
                    type: boolean
                    example: true
                  iframe_allowed:
                    type: boolean
                    example: false
                  environment:
                    type: string
                    example: production
    DirectSessionStatusResponse:
      type: object
      required:
        - session
        - user
      properties:
        session:
          type: object
          required:
            - id
            - userId
            - createdAt
            - expiresAt
          properties:
            id:
              type: string
              example: g1:apac:3:sess_123
            userId:
              type: string
              example: user_123
            createdAt:
              type: integer
              example: 1770000000000
            expiresAt:
              type: integer
              example: 1770086400000
            data:
              type: object
              additionalProperties: true
        user:
          type: object
          required:
            - id
            - emailVerified
          properties:
            id:
              type: string
              example: user_123
            email:
              type:
                - string
                - 'null'
              format: email
              example: user@example.com
            name:
              type:
                - string
                - 'null'
              example: Example User
            emailVerified:
              type: boolean
              example: true
            createdAt:
              type: integer
              example: 1770000000000
            updatedAt:
              type: integer
              example: 1770000000000
            lastLoginAt:
              type:
                - integer
                - 'null'
              example: 1770000000000
    InvitationValidateResponse:
      type: object
      required:
        - valid
        - invitation_id
        - tenant_id
        - tenant_name
        - expires_at
      properties:
        valid:
          type: boolean
          enum:
            - true
        invitation_id:
          type: string
          example: inv_123
        tenant_id:
          type: string
          example: tenant_123
        tenant_name:
          type: string
          example: Example Tenant
        invited_email:
          type:
            - string
            - 'null'
          format: email
          example: user@example.com
        expires_at:
          type: integer
          example: 1770000000
    RegistrationFieldsResponse:
      type: object
      required:
        - fields
      properties:
        fields:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id:
                type: string
                example: claim_email
              name:
                type: string
                example: email
              display_name:
                type: string
                example: Email address
              data_type:
                type: string
                example: string
              required:
                type: boolean
                example: true
    SetupStatusResponse:
      type: object
      required:
        - initialized
        - setup_disabled
        - setup_token_valid
      properties:
        initialized:
          type: boolean
          example: false
        setup_disabled:
          type: boolean
          example: false
        setup_token_valid:
          type: boolean
          example: true
    FlowStateResponse:
      type: object
      required:
        - state
        - uiContract
      properties:
        state:
          type: object
          required:
            - currentNodeId
            - visitedNodeIds
            - completedCapabilities
          properties:
            currentNodeId:
              type: string
              example: email-code
            visitedNodeIds:
              type: array
              items:
                type: string
              example:
                - start
                - email-code
            completedCapabilities:
              type: array
              items:
                type: string
              example:
                - identifier
        uiContract:
          $ref: '#/components/schemas/UIContract'
