              type: integer
              example: 1770000600000
            campaign_id:
              type: string
              example: damc_123
            state:
              type: string
              example: passkey_required
            reason:
              anyOf:
                - type: string
                  example: immediate
                - type: 'null'
            passkey_required_at:
              anyOf:
                - type: integer
                  example: 1770000000000
                - type: 'null'
