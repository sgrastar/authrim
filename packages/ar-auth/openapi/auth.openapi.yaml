      description:
        Creates an email-code challenge for Direct Auth after validating the client, channel,
        origin, and requested email identifier. For an eligible explicit email-verification Flow,
        a valid Email Verification Protocol presentation completes verification without sending a
        code; missing, unsupported, or invalid presentations use the normal mail-OTP response.
      responses:
