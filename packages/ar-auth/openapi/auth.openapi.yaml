      type: object
      properties:
        id:
          type: string
          example: did:web:example.com#key-1
        type:
          type: string
          example: JsonWebKey2020
        controller:
          type: string
          example: did:web:example.com
        publicKeyJwk:
          type: object
          additionalProperties: true
    DIDChallengeResponse:
      type: object
      properties:
        challenge_id:
          type: string
          example: challenge_123
        challenge:
          type: string
          example: Sign this challenge
        nonce:
          type: string
          example: nonce_123
        allowed_verification_methods:
