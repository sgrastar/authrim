        messageId:
          type: string
          example: msg_123
      required:
        - success
        - message
    EmailCodeVerifyRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        code:
          type: string
          example: '123456'
      required:
        - email
        - code
    EmailCodeVerifyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        sessionId:
          type: string
          example: sess_123
        userId:
          type: string
          example: user_123
