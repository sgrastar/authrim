      additionalProperties: false
      properties:
        transaction_id:
          type: string
          example: damt_email_123
        transaction_token:
          type: string
          example: migration-email-token
        expires_at:
          type: integer
          example: 1770000600000
        masked_email:
          type: string
          example: al***@example.com
      required:
        - transaction_id
        - transaction_token
        - expires_at
        - masked_email
    DIDChallengeRequest:
      type: object
      properties:
        did:
          type: string
          example: did:web:example.com
        nonce:
          type: string
          example: nonce_123
      required:
        - did
