        - challengeId
        - credential
    PasskeyLoginVerifyResponse:
      type: object
      properties:
        verified:
          type: boolean
          example: true
        sessionId:
          type: string
          example: sess_123
        userId:
          type: string
          example: user_123
        user:
          $ref: '#/components/schemas/AuthUser'
      required:
        - verified
        - sessionId
        - userId
        - user
    EmailCodeSendRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          example: Example User
        custom_fields:
          type: object
          additionalProperties: true
      required:
        - email
    EmailCodeSendResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
