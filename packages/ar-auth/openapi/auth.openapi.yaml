        - success
        - sessionId
        - userId
        - user
    TotpLoginStartRequest:
      type: object
      additionalProperties: false
      required:
        - identifier
      properties:
        identifier:
          type: string
          minLength: 1
          description: Email address or username/user identifier.
    TotpLoginStartResponse:
      type: object
      required:
        - challenge_id
        - expires_in
      properties:
        challenge_id:
          type: string
        expires_in:
          type: integer
          minimum: 1
    TotpLoginVerifyRequest:
      type: object
      additionalProperties: false
      required:
        - challenge_id
        - code
      properties:
        challenge_id:
          type: string
        code:
          type: string
          pattern: '^(?:[0-9]{6}|[0-9]{8})$'
        authorization_challenge_id:
          type: string
        defer_authorization_continuation:
          type: boolean
          default: false
    TotpSignupOptionsRequest:
      type: object
      additionalProperties: true
      required:
        - email
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        label:
          type: string
          maxLength: 100
        custom_fields:
          type: object
          additionalProperties: true
        human_verification_response:
          type: string
        cf_turnstile_response:
          type: string
        authorization_challenge_id:
          type: string
    TotpSignupActivateRequest:
      type: object
      additionalProperties: false
      required:
        - challenge_id
        - code
      properties:
        challenge_id:
          type: string
        code:
          type: string
          pattern: '^(?:[0-9]{6}|[0-9]{8})$'
        defer_authorization_continuation:
          type: boolean
          default: false
    TotpCredential:
      type: object
      required:
        - id
        - label
        - algorithm
        - digits
        - period
        - window
        - status
        - created_at
      properties:
        id:
          type: string
        label:
          type: string
        algorithm:
          type: string
          enum:
            - SHA1
            - SHA256
            - SHA512
        digits:
          type: integer
          enum:
            - 6
            - 8
        period:
          type: integer
        window:
          type: integer
        status:
          type: string
          enum:
            - pending
            - active
            - disabled
        created_at:
          type: integer
          format: int64
        activated_at:
          type:
            - integer
            - 'null'
          format: int64
        last_used_at:
          type:
            - integer
            - 'null'
          format: int64
    TotpProfile:
      type: object
      required:
        - algorithm
        - digits
        - period
        - window
      properties:
        algorithm:
          type: string
        digits:
          type: integer
        period:
          type: integer
        window:
          type: integer
    TotpSignupOptionsResponse:
      type: object
      required:
        - challenge_id
        - expires_in
        - credential
        - secret
        - otpauth_uri
        - profile
      properties:
        challenge_id:
          type: string
        expires_in:
          type: integer
        credential:
          $ref: '#/components/schemas/TotpCredential'
        secret:
          type: string
          description: Base32 TOTP secret shown once during enrollment.
        otpauth_uri:
          type: string
          format: uri
        profile:
          $ref: '#/components/schemas/TotpProfile'
    TotpSession:
      type: object
      required:
        - userId
        - createdAt
        - expiresAt
        - authTime
        - acr
        - amr
      properties:
        userId:
          type: string
        createdAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        authTime:
          type: integer
          format: int64
        acr:
          type: string
          example: urn:authrim:aal:2
        amr:
          type: array
          items:
            type: string
          example:
            - otp
            - totp
    TotpSessionResponse:
      type: object
      required:
        - success
        - sessionId
        - expires_in
        - session
        - user
        - redirect_url
      properties:
        success:
          type: boolean
        sessionId:
          type: string
        expires_in:
          type: integer
        session:
          $ref: '#/components/schemas/TotpSession'
        user:
          $ref: '#/components/schemas/AuthUser'
        authorization:
          type: object
          additionalProperties: true
        redirect_url:
          type: string
    TotpSignupActivateResponse:
      allOf:
        - $ref: '#/components/schemas/TotpSessionResponse'
        - type: object
          required:
            - ok
            - credential
            - backup_codes
          properties:
            ok:
              type: boolean
            credential:
              $ref: '#/components/schemas/TotpCredential'
            backup_codes:
              type: array
              items:
                type: string
    DirectoryPasswordLoginRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          example: alice
        password:
          type: string
          format: password
          example: correct-horse-battery-staple
        invite_token:
          type: string
