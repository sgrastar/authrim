openapi: 3.2.0
info:
  title: Authrim Authentication API
  version: 0.3.2
  summary: Browser and API authentication endpoints.
  description: >
    Initial OpenAPI contract for endpoints owned by `@authrim/ar-auth`. This document intentionally
    contains route contracts only; do not add secrets, private test credentials, or vulnerability
    notes.
  x-authrim-coverage: initial route inventory
servers:
  - url: https://{tenant_domain}
    variables:
      tenant_domain:
        default: auth.example.com
tags:
  - name: Health
  - name: OAuth
  - name: Passkeys
  - name: Email Codes
  - name: Directory Password
  - name: DID
  - name: Anonymous Login
  - name: Upgrade
  - name: Consent
  - name: Sessions
  - name: Logout
  - name: DID Auth
  - name: Login Challenges
  - name: Direct Auth
  - name: Invitations
  - name: Registration
  - name: Auth
paths:
  /api/auth/health:
    get:
      tags:
        - Health
      summary: Return authentication Worker health.
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /authorize:
    get:
      tags:
        - OAuth
      summary: Start or continue an OAuth/OIDC authorization request.
      parameters:
        - $ref: "#/components/parameters/ClientIdQuery"
        - name: redirect_uri
          in: query
          schema:
            type: string
        - name: response_type
          in: query
          schema:
            type: string
        - name: scope
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Any"
        "302":
          description: Redirect response.
    post:
      tags:
        - OAuth
      summary: Submit an OAuth/OIDC authorization request.
      requestBody:
        $ref: "#/components/requestBodies/FormOrJson"
      responses:
        "200":
          $ref: "#/components/responses/Any"
        "302":
          description: Redirect response.
  /par:
    post:
      tags:
        - OAuth
      summary: Create a pushed authorization request.
      requestBody:
        $ref: "#/components/requestBodies/FormOrJson"
      responses:
        "201":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/Error"
    get:
      tags:
        - Auth
      operationId: getPar
      summary: GET /par
      description: Route coverage stub generated from the Worker route table. Replace this with a detailed
        request and response contract when changing this API.
      x-authrim-route-coverage: inferred-from-source
      responses:
        "200":
          $ref: "#/components/responses/Any"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /flow/login:
    get:
      tags:
        - OAuth
      summary: Render a built-in login flow page when enabled.
      responses:
        "200":
          $ref: "#/components/responses/Any"
    post:
      tags:
        - OAuth
      summary: Submit a built-in login flow step when enabled.
      requestBody:
        $ref: "#/components/requestBodies/FormOrJson"
      responses:
        "200":
          $ref: "#/components/responses/Any"
  /flow/confirm:
    get:
      tags:
        - OAuth
      summary: Render a built-in confirmation step when enabled.
      responses:
        "200":
          $ref: "#/components/responses/Any"
    post:
