            $ref: '#/components/schemas/FlowStateResponse'
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    Error:
      type: object
      additionalProperties: true
      properties:
        error:
          type: string
        error_description:
          type: string
        message:
          type: string
        webauthn_signal:
          $ref: '#/components/schemas/WebAuthnSignalHint'
    WebAuthnSignalHint:
      type: object
      description:
        Optional browser-side WebAuthn Signal API hint. When unknown_credential is true, clients
        that just received a WebAuthn credential assertion may call
        PublicKeyCredential.signalUnknownCredential() for that credential ID.
      properties:
        unknown_credential:
          type: boolean
    AuthHealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: ar-auth
        version:
          type: string
          example: 0.1.0
        codeVersion:
          type: string
          example: a1b2c3d4
        deployTime:
          type: string
          example: 2026-06-20T00:00:00Z
        timestamp:
          type: string
          format: date-time
          example: 2026-06-20T00:00:00.000Z
      required:
        - status
        - service
        - version
        - codeVersion
        - deployTime
        - timestamp
    PushedAuthorizationRequest:
      type: object
      properties:
        client_id:
          type: string
          example: client_123
        redirect_uri:
          type: string
          format: uri
          example: https://app.example.com/callback
        response_type:
          type: string
          example: code
        scope:
          type: string
          example: openid profile email
        state:
          type: string
          example: state_123
        code_challenge:
          type: string
          example: rfc7636-code-challenge
        code_challenge_method:
          type: string
          example: S256
        nonce:
          type: string
          example: nonce_123
        request:
          type: string
          description: Signed request object JWT.
      required:
        - client_id
        - redirect_uri
        - response_type
    PushedAuthorizationResponse:
      type: object
      properties:
        request_uri:
          type: string
          example: urn:ietf:params:oauth:request_uri:par_123
        expires_in:
          type: integer
          example: 90
      required:
        - request_uri
        - expires_in
    AuthUser:
      type: object
      properties:
        id:
          type: string
          example: user_123
        email:
          anyOf:
            - type: string
              format: email
              example: user@example.com
            - type: 'null'
        name:
          anyOf:
            - type: string
              example: Example User
            - type: 'null'
        email_verified:
          oneOf:
            - type: boolean
              example: true
            - type: integer
              example: 1
        created_at:
          type: string
          example: 2026-06-20T00:00:00.000Z
        updated_at:
          type: string
          example: 2026-06-20T00:00:00.000Z
        last_login_at:
          anyOf:
            - type: string
              example: 2026-06-20T00:00:00.000Z
            - type: 'null'
        user_type:
          type: string
          example: anonymous
    WebAuthnOptions:
      type: object
      additionalProperties: true
      description: WebAuthn options generated by @simplewebauthn/server.
    WebAuthnCredential:
      type: object
      additionalProperties: true
      description: WebAuthn credential response from the browser.
    PasskeyRegisterOptionsRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          example: Example User
        custom_fields:
          type: object
          additionalProperties: true
      required:
        - email
    PasskeyRegisterOptionsResponse:
      type: object
      properties:
        options:
          $ref: '#/components/schemas/WebAuthnOptions'
