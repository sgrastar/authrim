        - username
        - password
    DirectoryMigrationPasskeyOptionsRequest:
      type: object
      additionalProperties: false
      properties:
        transaction_id:
          type: string
          minLength: 1
          example: damt_123
        transaction_token:
          type: string
          minLength: 1
          example: migration-transaction-token
        display_name:
          type: string
          maxLength: 160
          example: Example User
      required:
        - transaction_id
        - transaction_token
    DirectoryMigrationPasskeyVerifyRequest:
      type: object
      additionalProperties: false
      properties:
        transaction_id:
          type: string
          minLength: 1
          example: damt_123
        transaction_token:
          type: string
          minLength: 1
          example: migration-transaction-token
        challenge_id:
          type: string
          minLength: 1
          example: challenge_123
        credential:
          type: object
          additionalProperties: true
        device_name:
          type: string
          maxLength: 160
          example: Work laptop
      required:
        - transaction_id
        - transaction_token
        - challenge_id
        - credential
    DirectoryMigrationEmailCodeSendRequest:
      type: object
      additionalProperties: false
      properties:
        transaction_id:
          type: string
          minLength: 1
          example: damt_email_123
        transaction_token:
          type: string
          minLength: 1
          example: migration-email-token
      required:
        - transaction_id
        - transaction_token
    DirectoryMigrationEmailCodeVerifyRequest:
      type: object
      additionalProperties: false
      properties:
        transaction_id:
          type: string
          minLength: 1
          example: damt_email_123
        transaction_token:
          type: string
          minLength: 1
          example: migration-email-token
        challenge_id:
          type: string
          minLength: 1
          example: challenge_123
        code:
          type: string
          pattern: "^\\d{6}$"
          example: '123456'
      required:
        - transaction_id
        - transaction_token
        - challenge_id
        - code
    DirectoryConnectorHeartbeatRequest:
      type: object
      additionalProperties: false
      required:
        - instance_id
        - transport
        - version
        - started_at
        - health_status
        - config_fingerprint
      properties:
        instance_id:
          type: string
          maxLength: 128
          pattern: '^[a-zA-Z0-9._:-]+$'
          description: Immutable Wordwarden instance identifier persisted in the connector state directory.
        display_name:
          type: string
          maxLength: 128
          description: Human-readable operational display name. Not an identity boundary.
        transport:
          type: string
          enum:
            - relay
            - direct
            - tunnel
        version:
          type: string
          maxLength: 64
        release_channel:
          type: string
          maxLength: 32
          pattern: '^[a-zA-Z0-9_.-]{1,32}$'
          default: stable
        started_at:
          type: string
          format: date-time
        health_status:
          type: string
          enum:
            - healthy
            - degraded
            - unhealthy
        health_summary:
          type: object
          additionalProperties: true
          description: Redacted operational health summary. Must not include PII, LDAP secrets, or LDAP internal values.
        config_fingerprint:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        config_categories:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 64
        drift_severity:
          type: string
          enum:
            - none
            - warning
            - critical
          default: none
    DirectoryConnectorHeartbeatResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - status
        - instance_id
        - connector_id
      properties:
        ok:
          type: boolean
          enum:
            - true
        status:
          type: string
          enum:
            - connected
            - unhealthy
        instance_id:
          type: string
        connector_id:
          type: string
          pattern: '^wwcon_[a-zA-Z0-9]{16}$'
    BrowserSessionResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        expires_in:
          type: integer
          example: 86400
        session:
          type: object
          properties:
            userId:
              type: string
              example: user_123
            createdAt:
              type: integer
              example: 1770000000000
            expiresAt:
              type: integer
              example: 1770086400000
            authTime:
              type: integer
              example: 1770000000
            acr:
              type: string
              example: urn:mace:incommon:iap:bronze
            amr:
              type: array
              items:
                type: string
              example:
                - pwd
                - directory
          additionalProperties: true
        user:
          type: object
          properties:
            id:
              type: string
              example: user_123
            email:
              type: string
              format: email
              example: user@example.com
            name:
              anyOf:
                - type: string
                  example: Example User
                - type: 'null'
        authorization:
          type: object
          additionalProperties: true
        redirect_url:
          type: string
          format: uri
          example: https://app.example.com/callback?code=abc
      required:
        - ok
        - expires_in
        - session
        - user
    DirectoryPasswordLoginResponse:
