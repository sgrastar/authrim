          schema:
            type: string
        - name: Referer
          in: header
          description: Used for the origin when Origin is absent.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoffVerifyRequest'
      responses:
        '200':
          description: A DPoP-bound access token (and, when included, the session and user).
