      requestBody:
        $ref: '#/components/requestBodies/FacebookSignedRequest'
      responses:
        '200':
          description: The request was processed; Meta shows the person the status URL and code.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacebookDataDeletionResponse'
        '400':
          description: >-
            The signed request is missing, malformed, wrongly signed, not HMAC-SHA256, stale, a
            login-flow request (carries `code` or `oauth_token`), or one already processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '404':
          description: No Facebook Login provider of this tenant has this id or slug.
        '500':
          description: The app secret is unavailable or the unlink could not be completed safely.
        '503':
          description: >-
            `temporarily_unavailable`: another change to how the account signs in is running, or
            the account is not active (suspended, locked, being deleted) and nothing was done.
            Retry after the Retry-After delay. Never recorded as done.
  /api/external/{provider}/data-deletion/{code}:
    get:
      operationId: getFacebookDataDeletionStatusApi
      summary: Status of a Facebook data deletion request
      description: >-
        Public: the confirmation code is the only key. Shows only the request's state, as an HTML
        page, or as JSON when the request accepts `application/json` and not `text/html`.
      parameters:
        - $ref: '#/components/parameters/FacebookProvider'
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{22}$'
      responses:
        '200':
          description: The request's state.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacebookDataDeletionStatus'
            text/html:
              schema:
                type: string
        '404':
          description: No request has this confirmation code for this provider.
  /auth/external/{provider}/deauthorize:
    post:
      operationId: receiveFacebookDeauthorization
      summary: Facebook Deauthorize Callback
      description: >-
        Called by Meta with a `signed_request` when the person removes the app. Verified and
        handled like the data deletion callback (unlink, account kept, legal hold respected), but
        no status record is kept.
      parameters:
        - $ref: '#/components/parameters/FacebookProvider'
      requestBody:
        $ref: '#/components/requestBodies/FacebookSignedRequest'
      responses:
        '200':
          description: The request was processed.
        '400':
          description: >-
            The signed request is missing, malformed, wrongly signed, not HMAC-SHA256, stale, a
            login-flow request (carries `code` or `oauth_token`), or one already processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '404':
          description: No Facebook Login provider of this tenant has this id or slug.
        '500':
          description: The app secret is unavailable or the unlink could not be completed safely.
        '503':
          description: >-
            Another change to how the account signs in is running, or the account is not active
            (nothing was done); retry later.
  /api/external/{provider}/deauthorize:
    post:
      operationId: receiveFacebookDeauthorizationApi
      summary: Facebook Deauthorize Callback
      description: >-
        Called by Meta with a `signed_request` when the person removes the app. Verified and
        handled like the data deletion callback (unlink, account kept, legal hold respected), but
        no status record is kept.
      parameters:
        - $ref: '#/components/parameters/FacebookProvider'
      requestBody:
        $ref: '#/components/requestBodies/FacebookSignedRequest'
      responses:
        '200':
          description: The request was processed.
        '400':
          description: >-
            The signed request is missing, malformed, wrongly signed, not HMAC-SHA256, stale, a
            login-flow request (carries `code` or `oauth_token`), or one already processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '404':
          description: No Facebook Login provider of this tenant has this id or slug.
        '500':
          description: The app secret is unavailable or the unlink could not be completed safely.
        '503':
          description: >-
            Another change to how the account signs in is running, or the account is not active
            (nothing was done); retry later.
components:
  securitySchemes:
    authrimSession:
      type: apiKey
      in: cookie
      name: authrim_session
    externalProvisioningCookie:
      type: apiKey
      in: cookie
      name: authrim_external_provisioning_<digest-prefix>
      description: Dynamically named HttpOnly browser-binding cookie.
  parameters:
    FacebookProvider:
      name: provider
      in: path
      required: true
      description: The id or slug of a Facebook Login provider configuration of the tenant.
      schema:
        type: string
        minLength: 1
        maxLength: 256
  requestBodies:
    FacebookSignedRequest:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/FacebookSignedRequestForm'
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/FacebookSignedRequestForm'
  schemas:
    FacebookSignedRequestForm:
      type: object
      required:
        - signed_request
      properties:
        signed_request:
          type: string
          maxLength: 4096
          description: '`<signature>.<payload>`, each base64url (Meta signed request).'
    FacebookDataDeletionResponse:
      type: object
      additionalProperties: false
      required:
        - url
        - confirmation_code
      properties:
        url:
          type: string
          format: uri
          description: The status page of the request.
        confirmation_code:
          type: string
          pattern: '^[A-Za-z0-9_-]{22}$'
    FacebookDataDeletionStatus:
      type: object
      additionalProperties: false
      required:
        - confirmation_code
        - status
      properties:
        confirmation_code:
          type: string
          pattern: '^[A-Za-z0-9_-]{22}$'
        status:
          type: string
          enum:
            - pending
            - completed
            - retained
    HandoffVerifyRequest:
      type: object
      required:
        - handoff_token
        - state
        - client_id
      properties:
        handoff_token:
          type: string
        state:
          type: string
        client_id:
          type: string
    OAuthError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        error_description:
          type: string
    LinkedExternalIdentityList:
      type: object
      additionalProperties: false
      required:
        - identities
      properties:
        identities:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - providerId
              - providerName
              - linkedAt
            properties:
              id:
                type: string
              providerId:
                type: string
              providerName:
                type: string
              providerSlug:
                type: string
                description: The provider's slug, which the authentication-methods API uses as its id.
              providerEmail:
                type: string
              linkedAt:
                type: integer
                description: Milliseconds since the epoch.
              lastLoginAt:
                type: integer
                description: Milliseconds since the epoch.
    ExternalIdentityUnlinkResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - cleanup_pending
        - token_revocation
      properties:
        success:
          type: boolean
          const: true
        cleanup_pending:
          type: boolean
        operation_id:
          type: string
        token_revocation:
          type: object
          additionalProperties: false
          required:
            - attempted
            - access_token_revoked
            - refresh_token_revoked
          properties:
            attempted:
              type: boolean
            access_token_revoked:
              type: boolean
            refresh_token_revoked:
              type: boolean
            warnings:
              type: array
              maxItems: 8
              items:
                type: string
    ProvisioningStatusRequest:
      type: object
      additionalProperties: false
      required:
        - provisioning_token
        - tenant_id
      properties:
        provisioning_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        tenant_id:
          type: string
          minLength: 1
          maxLength: 256
    ProvisioningReadyResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - resume_url
      properties:
        status:
          type: string
          const: ready
        resume_url:
          type: string
          pattern: '^/auth/external/provisioning/resume\\?'
    ProvisioningPendingResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - retry_after_ms
      properties:
        status:
          type: string
          const: pending
        retry_after_ms:
          type: integer
          minimum: 250
          maximum: 2000
    ProvisioningFailedResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: failed
    ProvisioningErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          const: invalid_or_expired_provisioning_continuation
