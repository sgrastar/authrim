  /api/external/links:
    get:
      operationId: listLinkedExternalIdentities
      summary: List the external accounts linked to the current account
      security:
        - authrimSession: []
      responses:
        '200':
          description: The account's active linked external identities, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedExternalIdentityList'
        '401':
          description: A valid Authrim session is required.
        '500':
          description: The session or the linked identities could not be read.
    post:
      operationId: startExternalIdentityLink
      summary: Start linking an external account to the current account
      description: >-
        Requires a full (not guest) session authenticated within the tenant's re-authentication window (`self-service.reauth_ttl_seconds`, 60-1800 seconds, default 300). Returns the
        external start URL with a one-use link intent bound to this session; the provider's answer
        returns to the account page as `/account?social_link=linked` or
        `/account?social_link=error&reason=already_linked|email_not_verified|session_expired|cancelled|failed`.
        Linking never creates a session.
      security:
        - authrimSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - provider_id
              properties:
                provider_id:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: The provider's id or slug.
      responses:
        '200':
          description: The URL the browser navigates to.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - authorization_url
                properties:
                  authorization_url:
                    type: string
                    format: uri
        '400':
          description: '`provider_id` is missing.'
        '401':
          description: A valid Authrim session is required.
        '403':
          description: >-
            Re-authentication is required (`reauth_required`) or the session is a guest session
            (`guest_registration_required`).
        '404':
          description: The provider is unknown or disabled.
        '409':
          description: An account from this provider is already linked (`already_linked`).
  /api/external/links/{id}:
    delete:
      operationId: unlinkExternalIdentity
      summary: Unlink an external identity from the current account
      description: >-
        Revokes upstream tokens on a best-effort basis. Routed accounts durably schedule removal of
        the external-subject Lookup route before acknowledging the authority deletion.
      security:
        - authrimSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        '200':
          description: The local identity was unlinked or an exact prior operation was adopted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalIdentityUnlinkResponse'
        '400':
          description: >-
            Unlinking would remove the account's last way to sign in
            (`remaining_login_method_required`).
        '401':
          description: A valid Authrim session is required.
        '403':
          description: >-
            Re-authentication is required (`reauth_required`) or the session is a guest session
            (`guest_registration_required`).
        '404':
          description: The linked identity or prior unlink operation does not exist for this account.
        '409':
          description: >-
            Another removal of the account's sign-in methods is running (`operation_in_progress`).
        '500':
          description: The authority or durable cleanup operation could not be safely updated.
  /api/external/provisioning/status:
    post:
      operationId: getExternalIdpProvisioningStatus
      summary: Poll a pending external identity account provisioning operation
      description: >-
        Requires the browser-bound HttpOnly continuation cookie created by the external identity
        callback. The provisioning token is removed from the browser URL before this request.
      security:
        - externalProvisioningCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisioningStatusRequest'
      responses:
        '200':
          description: Provisioning is ready to resume.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisioningReadyResponse'
        '202':
          description: Provisioning remains pending.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisioningPendingResponse'
        '400':
          description: The continuation is malformed, expired, consumed, or not browser-bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisioningErrorResponse'
        '409':
          description: The durable account provisioning operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisioningFailedResponse'
  /auth/external/provisioning/resume:
    get:
      operationId: resumeExternalIdpProvisioning
      summary: Consume a ready external identity provisioning continuation
      description: >-
        Completes the routed JIT projection, consumes the one-time continuation, and resumes the
        original authorization flow. It never completes while the durable operation is pending.
      security:
        - externalProvisioningCookie: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
        - name: tenant
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        '302':
          description: Redirects to the original authorization callback or a generic login error.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
  /handoff/verify:
    post:
      operationId: verifyExternalHandoff
      summary: Exchange a handoff token for a DPoP-bound access token
      description: >-
        Redeems the one-time handoff artifact an external IdP login produced, for the client and
        state it was bound to, and returns an access token bound to the DPoP proof's key. With
        tenant assurance enabled and a default FAL of FAL3 (with fal3_requires_par), which needs
        a pushed, signed authorization request a handed-off login never had, every request is
        refused with unauthorized_client; assurance settings that cannot be read return 503
        temporarily_unavailable. Neither refusal spends the artifact. The request must come from
        an origin of the client's registered redirect URIs, given by Origin or, without it,
        Referer; a request with neither, or from another origin, is refused with 403.
      parameters:
        - name: DPoP
          in: header
          required: true
          schema:
            type: string
        - name: Origin
          in: header
          description: The requesting origin; one of the client's registered redirect URI origins.
          schema:
            type: string
        - name: Referer
          in: header
          description: Used for the origin when Origin is absent.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoffVerifyRequest'
      responses:
        '200':
          description: A DPoP-bound access token (and, when included, the session and user).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request, DPoP proof or handoff, or the required FAL not met.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: Unknown client, or an expired handoff session.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403':
          description: No Origin or Referer, or an origin the client has not registered.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '429':
          description: Too many handoff attempts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '503':
          description: Assurance settings are temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /auth/external/handoff/verify:
    post:
      operationId: verifyExternalHandoffAuthPath
