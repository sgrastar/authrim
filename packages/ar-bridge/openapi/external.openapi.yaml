openapi: 3.2.0
info:
  title: Authrim External Identity Bridge API
  version: 0.5.1
  description: >
    Browser continuation endpoints owned by the external identity bridge.

    When coordinated SAML DR export is enabled, every operation can additionally return HTTP 503
    while source updates are paused or update admission is unavailable. This availability response
    has Content-Type text/plain;charset=UTF-8, Cache-Control no-store, Retry-After 5, and the body
    "Service temporarily unavailable" (no response body for HEAD). Clients may retry after the
    indicated delay; a failed response does not establish whether an earlier write completed.
paths:
  /auth/external/{provider}/start:
    get:
      operationId: startExternalIdentityLogin
      summary: Start external identity provider login
      description: >-
        Starts sign-in with the provider identified by its id or slug. Sign-in requires client_id,
        code_challenge and code_challenge_method=S256. A one-use link_intent issued for the current
        browser session starts account linking instead; runtime_interaction_id is ignored for
        linking. The optional interaction association does not alter provider selection,
        client redirect validation, PKCE, or the normal authorization redirect. A tenant in lite
        Login UI mode starts only with lite_txn and lite_grant (a one-time start grant of the
        browser's lite transaction, bound to its __Host-authrim_lite cookie, the provider as named
        in the path and the tenant's current lite policy revision); such a start ignores every other query
        parameter and takes the client, the authorization challenge and the interaction from the
        transaction and the grant, and returns to the lite /callback with lite_txn and lite_grant
        (its failures too). A sign-in checks the provider's sign-in switch, a sign-up
        (purpose=signup, or a lite transaction made for sign-up) its sign-up switch; the callback
        then lets it sign in to an existing account only while sign-in is on, and create one only
        while sign-up is on.
      parameters:
        - name: provider
          in: path
          required: true
          description: The configured provider's id or slug.
          schema:
            type: string
        - name: client_id
          in: query
          description: Required for sign-in; not required for a validated account-link intent.
          schema:
            type: string
        - name: code_challenge
          in: query
          description: The client's PKCE challenge, required for sign-in.
          schema:
            type: string
        - name: code_challenge_method
          in: query
          description: Must be S256 for sign-in.
          schema:
            type: string
        - name: redirect_uri
          in: query
          description: The post-login redirect, subject to the existing client and tenant validation.
          schema:
            type: string
        - name: link_intent
          in: query
          description: One-use account-link intent bound to the current browser session.
          schema:
            type: string
        - name: purpose
          in: query
          required: false
          description: >-
            signup when started from the sign-up screen: the start checks the provider's sign-up
            switch and verifies human verification for sign-up (with the sign-in requirement as
            well). Any other value, or none, is a sign-in; a link, a re-authentication and a silent
            sign-in (prompt=none) are never a sign-up. Ignored for a lite Login UI tenant.
          schema:
            type: string
            enum:
              - login
              - signup
        - name: lite_txn
          in: query
          required: false
          description: >-
            Lite Login UI tenants only: the browser's lite transaction holding the start grant.
          schema:
            type: string
        - name: lite_grant
          in: query
          required: false
          description: >-
            Lite Login UI tenants only: the one-time start grant to consume. Without a grant that
            can be consumed for this browser and provider, the start answers 403
            lite_mode_endpoint_unavailable before anything else is done.
          schema:
            type: string
        - name: runtime_interaction_id
          in: query
          required: false
          description: >-
            Optional Flow interaction identifier for associating failed sign-in attempts with an
            existing interaction of this tenant. The value is trimmed and used only when it names
            an unexpired interaction in the created or active state. An absent, empty, malformed,
            unknown, expired, or other-tenant value is ignored. If the interaction cannot be checked,
            sign-in continues without this association. This parameter adds no rejection response
            and does not change the existing sign-in redirects or errors.
          schema:
            type: string
      responses:
        '302':
          description: Redirects to the provider, the client callback, or the account-link result.
          headers:
            Location:
              required: true
              schema:
                type: string
        '400':
          description: Existing sign-in validation failed, such as missing client PKCE or invalid human verification.
        '403':
          description: >-
            The provider is not permitted for the requested sign-in, sign-up or re-authentication, or a
            lite Login UI tenant's start has no start grant it can consume
            (lite_mode_endpoint_unavailable).
        '404':
          description: The provider is unknown or disabled, or a signup invitation is unavailable.
        '429':
          description: The authentication request rate limit was exceeded.
        '500':
          description: The external login could not be started.
        '503':
          description: Provider usage or re-authentication settings are temporarily unavailable.
  /api/external/{provider}/start:
