openapi: 3.2.0
info:
  title: Authrim Discovery API
  version: 0.3.3
  summary: OIDC/OAuth metadata and JWKS endpoints.
  description: Initial OpenAPI contract for `@authrim/ar-discovery`.
servers:
  - url: https://{tenant_domain}
    variables:
      tenant_domain:
        default: auth.example.com
tags:
  - name: Health
  - name: Discovery
paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Return discovery Worker health.
      responses:
        "200":
          $ref: "#/components/responses/DiscoveryHealth"
  /health/live:
    get:
      tags:
        - Health
      summary: Return liveness probe status.
      responses:
        "200":
          $ref: "#/components/responses/ProbeHealth"
  /health/ready:
    get:
      tags:
        - Health
      summary: Return readiness probe status.
      responses:
        "200":
          $ref: "#/components/responses/ProbeHealth"
  /.well-known/openid-configuration:
    get:
      tags:
        - Discovery
      summary: Return OpenID Provider metadata.
      responses:
        "200":
          $ref: "#/components/responses/OidcProviderMetadata"
  /.well-known/oauth-authorization-server:
    get:
      tags:
        - Discovery
      summary: Return OAuth Authorization Server metadata.
      responses:
        "200":
          $ref: "#/components/responses/OidcProviderMetadata"
  /.well-known/oauth-authorization-server/oauth/admin-agent:
    get:
      tags:
        - Discovery
      summary: Return dedicated Admin Agent authorization server metadata.
      responses:
        "200":
          $ref: "#/components/responses/AdminAgentAuthorizationServerMetadata"
        "404":
          $ref: "#/components/responses/AgentAccessNotFound"
        "503":
          $ref: "#/components/responses/AgentAccessUnavailable"
  /.well-known/oauth-protected-resource/mcp:
    get:
      tags:
        - Discovery
      summary: Return RFC 9728 metadata for the protected MCP resource.
      responses:
        "200":
          $ref: "#/components/responses/AgentProtectedResourceMetadata"
        "404":
          $ref: "#/components/responses/AgentAccessNotFound"
        "503":
          $ref: "#/components/responses/AgentAccessUnavailable"
  /.well-known/webfinger:
    get:
      tags:
        - Discovery
      summary: Return WebFinger metadata.
      parameters:
        - name: resource
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/WebFinger"
  /.well-known/jwks.json:
    get:
      tags:
        - Discovery
      summary: Return JSON Web Key Set.
      responses:
        "200":
          $ref: "#/components/responses/JWKS"
components:
  responses:
    Ok:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    DiscoveryHealth:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiscoveryHealth"
          example:
            status: ok
            service: op-discovery
            timestamp: 2026-06-19T00:00:00.000Z
    ProbeHealth:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProbeHealth"
          example:
            status: ok
            service: op-discovery
            version: 0.1.0
            timestamp: 2026-06-19T00:00:00.000Z
    OidcProviderMetadata:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OidcProviderMetadata"
          example:
            issuer: https://auth.example.com
            authorization_endpoint: https://auth.example.com/authorize
            token_endpoint: https://auth.example.com/token
            jwks_uri: https://auth.example.com/.well-known/jwks.json
            response_types_supported:
              - code
              - id_token
              - code id_token
            grant_types_supported:
              - authorization_code
              - refresh_token
              - refresh_token
            subject_types_supported:
              - public
              - pairwise
            code_challenge_methods_supported:
              - S256
    AgentProtectedResourceMetadata:
      description: RFC 9728 protected resource metadata.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentProtectedResourceMetadata"
    AdminAgentAuthorizationServerMetadata:
      description: RFC 8414 metadata for the dedicated Admin Agent issuer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAgentAuthorizationServerMetadata"
    AgentAccessNotFound:
      description: Agent access is disabled for the tenant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthMetadataError"
    AgentAccessUnavailable:
      description: Agent access configuration could not be evaluated safely.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthMetadataError"
    WebFinger:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebFingerResponse"
          example:
            subject: acct:user@example.com
            links:
              - rel: http://openid.net/specs/connect/1.0/issuer
                href: https://auth.example.com
    JWKS:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JwksResponse"
          example:
            keys:
              - kty: RSA
                kid: signing-key-1
                use: sig
                alg: RS256
  schemas:
    DiscoveryHealth:
      type: object
      required:
        - status
        - service
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          enum:
            - op-discovery
        timestamp:
          type: string
          format: date-time
    ProbeHealth:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties: true
    OidcProviderMetadata:
      type: object
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - jwks_uri
        - response_types_supported
        - grant_types_supported
        - subject_types_supported
      additionalProperties: true
      properties:
        issuer:
          type: string
          format: uri
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        userinfo_endpoint:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        registration_endpoint:
          type: string
          format: uri
        introspection_endpoint:
          type: string
          format: uri
        revocation_endpoint:
          type: string
          format: uri
        pushed_authorization_request_endpoint:
          type: string
          format: uri
        require_pushed_authorization_requests:
          type: boolean
        authorization_response_iss_parameter_supported:
          type: boolean
        request_parameter_supported:
          type: boolean
        request_uri_parameter_supported:
          type: boolean
        response_types_supported:
          type: array
          items:
            type: string
        response_modes_supported:
          type: array
          items:
            type: string
            enum:
              - query
              - fragment
              - form_post
              - query.jwt
              - fragment.jwt
              - form_post.jwt
              - jwt
        grant_types_supported:
          type: array
          items:
            type: string
        scopes_supported:
          type: array
          items:
            type: string
        claims_supported:
          type: array
          items:
            type: string
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
            enum:
              - RS256
              - ES256
        userinfo_signing_alg_values_supported:
          type: array
          items:
            type: string
            enum:
              - RS256
              - ES256
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_signing_alg_values_supported:
          type: array
          items:
            type: string
            enum:
              - RS256
              - ES256
        request_object_signing_alg_values_supported:
          type: array
          items:
            type: string
            enum:
              - none
              - RS256
              - ES256
              - PS256
              - EdDSA
        authorization_signing_alg_values_supported:
          type: array
          items:
            type: string
            enum:
              - RS256
              - ES256
        authorization_encryption_alg_values_supported:
          type: array
          items:
            type: string
            enum:
              - RSA-OAEP
              - RSA-OAEP-256
              - ECDH-ES
              - ECDH-ES+A128KW
              - ECDH-ES+A192KW
              - ECDH-ES+A256KW
        authorization_encryption_enc_values_supported:
          type: array
          items:
            type: string
            enum:
              - A128GCM
              - A192GCM
              - A256GCM
              - A128CBC-HS256
              - A192CBC-HS384
              - A256CBC-HS512
        dpop_signing_alg_values_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
    AgentProtectedResourceMetadata:
      type: object
      additionalProperties: false
      required:
        - resource
        - authorization_servers
        - scopes_supported
        - bearer_methods_supported
        - dpop_signing_alg_values_supported
      properties:
        resource:
          type: string
          format: uri
        authorization_servers:
          type: array
          minItems: 1
          items:
            type: string
            format: uri
        scopes_supported:
          $ref: "#/components/schemas/AgentScopes"
        bearer_methods_supported:
          type: array
          items:
            type: string
            enum:
              - header
        dpop_signing_alg_values_supported:
          type: array
          items:
            type: string
        resource_documentation:
          type: string
          format: uri
    AdminAgentAuthorizationServerMetadata:
      type: object
      additionalProperties: true
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - pushed_authorization_request_endpoint
        - jwks_uri
        - response_types_supported
        - grant_types_supported
        - token_endpoint_auth_methods_supported
        - code_challenge_methods_supported
        - scopes_supported
        - require_pushed_authorization_requests
      properties:
        issuer:
          type: string
          format: uri
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        pushed_authorization_request_endpoint:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        response_types_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
        scopes_supported:
          $ref: "#/components/schemas/AgentScopes"
        require_pushed_authorization_requests:
          type: boolean
        dpop_signing_alg_values_supported:
          type: array
          items:
            type: string
        client_id_metadata_document_supported:
          type: boolean
    AgentScopes:
      type: array
      items:
        type: string
        enum:
          - agent:read
          - agent:write
          - agent:execute
          - agent:admin
    OAuthMetadataError:
      type: object
      additionalProperties: true
      required:
        - error
      properties:
        error:
          type: string
        error_description:
          type: string
        message:
          type: string
    WebFingerResponse:
      type: object
      required:
        - subject
        - links
      properties:
        subject:
          type: string
        links:
          type: array
          items:
            type: object
            required:
              - rel
              - href
            properties:
              rel:
                type: string
              href:
                type: string
                format: uri
    JwksResponse:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              kty:
                type: string
              kid:
                type: string
              use:
                type: string
              alg:
                type: string
