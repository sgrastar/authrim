openapi: 3.2.0
info:
  title: Authrim Admin API
  version: 0.3.2
  summary: Authenticated tenant and platform administration API.
  description: >
    Initial OpenAPI contract for the Authrim Admin API implemented by the `@authrim/ar-management`
    Worker. This document is safe to keep near the package because it describes externally
    observable HTTP contracts only. Do not add secrets, environment-specific credentials,
    vulnerability notes, or private operational runbooks here.
  x-authrim-coverage: initial security-testing contract
servers:
  - url: https://{tenant_domain}
    variables:
      tenant_domain:
        default: auth.example.com
        description: Tenant runtime domain serving `/api/admin/*`.
security:
  - adminBearer: []
  - adminSessionCookie: []
tags:
  - name: Admin Access Control
  - name: Admin Attributes
  - name: Admin Audit
  - name: Admin IP Allowlist
  - name: Admin Miscellaneous
  - name: Admin Passkeys
  - name: Admin Policies
  - name: Admin ReBAC
  - name: Admin Roles
  - name: Admin Session
  - name: Admin Users
  - name: Approval Artifacts
  - name: Approval Receipts
  - name: Approvals
  - name: Clients
  - name: Compliance
  - name: Consent
  - name: Custom Claims
  - name: Data Retention
  - name: Database Connections
  - name: Diagnostic Logging
  - name: External Providers
  - name: Field Mapping
  - name: Flows
  - name: Health
  - name: Jobs
  - name: Logging - Administration
  - name: Logging - Destinations
  - name: Logging - Notifications
  - name: Logging - Policies
  - name: Machine Access
  - name: Organizations
  - name: Plugins
  - name: Policy Administration
  - name: ReBAC Administration
  - name: Roles
  - name: Security
  - name: Settings - Audit
  - name: Settings - Error Handling
  - name: Settings - General
  - name: Settings - Logging
  - name: Settings - Migration
  - name: Settings - OAuth and Tokens
  - name: Settings - PII
  - name: Settings - Rate Limits
  - name: Settings - Security
  - name: Settings - Storage and Runtime
  - name: Settings - UI
  - name: Stats
  - name: Step-Up Authentication
  - name: Storage Destinations
  - name: Support Operations
  - name: Tenant Domains
  - name: Tenants
  - name: Tombstones
  - name: User Attributes
  - name: Users
  - name: Verifiable Credentials
  - name: Webhooks
paths:
  /api/health:
    get:
      tags:
        - Health
      security: []
      summary: Return management Worker health.
      responses:
        "200":
          $ref: "#/components/responses/Ok"
      description: Get Health health in the Health area. Use this operation to retrieve health data
        without mutating tenant state.
  /health/live:
    get:
      tags:
        - Health
      security: []
      summary: Return liveness probe status.
      responses:
        "200":
          $ref: "#/components/responses/Ok"
      description: List Live in the Health area. Use this operation to retrieve live data without mutating
        tenant state.
  /health/ready:
    get:
      tags:
        - Health
      security: []
      summary: Return readiness probe status.
      responses:
        "200":
          $ref: "#/components/responses/Ok"
      description: List Ready in the Health area. Use this operation to retrieve ready data without
        mutating tenant state.
  /api/admin/me/session:
    get:
      tags:
        - Admin Session
      summary: Return the current Admin UI session and role status.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
      description: List Session in the Admin Session area. Use this operation to retrieve session data
        without mutating tenant state.
  /api/admin/logout:
    post:
      tags:
        - Admin Session
      summary: End the current Admin UI session.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Error"
      description: Create Logout in the Admin Session area. The request body is JSON unless the detailed
        schema for this operation states otherwise.
  /api/admin/sessions:
    get:
      tags:
        - Admin Miscellaneous
      summary: List admin sessions.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/AdminUserList"
      description: List Sessions in the Admin Miscellaneous area. Use this operation to retrieve session
        data without mutating tenant state.
  /api/admin/sessions/{id}:
    get:
      tags:
        - Admin Miscellaneous
      summary: Get an admin session.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - &a1
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/Error"
      description: Get Session in the Admin Miscellaneous area. Use this operation to retrieve session
        data without mutating tenant state.
    delete:
      tags:
        - Admin Miscellaneous
      summary: Revoke an admin session.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - *a1
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/Error"
      description: Delete Session in the Admin Miscellaneous area. The operation changes tenant state and
        should be protected by the documented admin authorization and audit controls.
  /api/admin/stats:
    get:
      tags:
        - Stats
      summary: Return tenant administration dashboard statistics.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
      description: Get Stat summary in the Stats area. Use this operation to retrieve stat data without
        mutating tenant state.
  /api/admin/users:
    get:
      tags:
        - Users
      summary: List end users.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/List"
      description: List Users in the Users area. Use this operation to retrieve user data without mutating
        tenant state.
    post:
      tags:
        - Users
      summary: Create an end user.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/AdminUserCreate"
      responses:
        "201":
          $ref: "#/components/responses/AdminUser"
        "400":
          $ref: "#/components/responses/Error"
      description: Create User in the Users area. The request body is JSON unless the detailed schema for
        this operation states otherwise.
  /api/admin/users/{id}:
    get:
      tags:
        - Users
      summary: Get an end user.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - &a2
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/AdminUserDetail"
        "404":
          $ref: "#/components/responses/Error"
      description: Get User in the Users area. Use this operation to retrieve user data without mutating
        tenant state.
    put:
      tags:
        - Users
      summary: Update an end user.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - *a2
      requestBody:
        $ref: "#/components/requestBodies/AdminUserUpdate"
      responses:
        "200":
          $ref: "#/components/responses/AdminUser"
        "400":
          $ref: "#/components/responses/Error"
      description: Replace User in the Users area. The request body is JSON unless the detailed schema for
        this operation states otherwise.
    delete:
      tags:
        - Users
      summary: Delete an end user.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - *a2
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/Error"
      description: Delete User in the Users area. The operation changes tenant state and should be
        protected by the documented admin authorization and audit controls.
  /api/admin/users/{id}/suspend:
    post:
      tags:
        - Users
      summary: Suspend an end user.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/AdminUserStatusChange"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
      description: Suspend User in the Users area. The request body is JSON unless the detailed schema for
        this operation states otherwise.
  /api/admin/users/{id}/lock:
    post:
      tags:
        - Users
      summary: Lock an end user.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/AdminUserStatusChange"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
      description: Lock User in the Users area. The request body is JSON unless the detailed schema for
        this operation states otherwise.
  /api/admin/users/{id}/activate:
    post:
      tags:
        - Users
      summary: Activate a suspended or locked end user.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/AdminUserStatusChange"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
      description: Activate User in the Users area. The request body is JSON unless the detailed schema
        for this operation states otherwise.
  /api/admin/users/{id}/sessions:
    delete:
      tags:
        - Users
      summary: Revoke all sessions for an end user.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
      description: Delete Session in the Users area. The operation changes tenant state and should be
        protected by the documented admin authorization and audit controls.
  /api/admin/users/{id}/avatar:
    post:
      tags:
        - Users
      summary: Upload an end-user avatar.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - &a3
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          $ref: "#/components/responses/Ok"
      description: Create Avatar in the Users area. The request body is JSON unless the detailed schema
        for this operation states otherwise.
    delete:
      tags:
        - Users
      summary: Delete an end-user avatar.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - *a3
      responses:
        "200":
          $ref: "#/components/responses/Ok"
      description: Delete Avatar in the Users area. The operation changes tenant state and should be
        protected by the documented admin authorization and audit controls.
  /api/admin/users/{id}/activity-log:
    get:
      tags:
        - Users
      summary: List activity for an end user.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/AdminClientList"
      description: Get Activity Log in the Users area. Use this operation to retrieve activity log data
        without mutating tenant state.
  /api/admin/clients:
    get:
      tags:
        - Clients
      summary: List OAuth/OIDC clients.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/List"
      description: List Clients in the Clients area. Use this operation to retrieve client data without
        mutating tenant state.
    post:
      tags:
        - Clients
      summary: Create an OAuth/OIDC client.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/AdminClientCreate"
      responses:
        "201":
          $ref: "#/components/responses/AdminClient"
        "400":
          $ref: "#/components/responses/Error"
      description: Create Client in the Clients area. The request body is JSON unless the detailed schema
        for this operation states otherwise.
  /api/admin/clients/{id}:
    get:
      tags:
        - Clients
      summary: Get an OAuth/OIDC client.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - &a4
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/AdminClient"
        "404":
          $ref: "#/components/responses/Error"
      description: Get Client in the Clients area. Use this operation to retrieve client data without
        mutating tenant state.
    put:
      tags:
        - Clients
      summary: Update an OAuth/OIDC client.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - *a4
      requestBody:
        $ref: "#/components/requestBodies/AdminClientUpdate"
      responses:
        "200":
          $ref: "#/components/responses/AdminClientMutation"
        "400":
          $ref: "#/components/responses/Error"
      description: Replace Client in the Clients area. The request body is JSON unless the detailed schema
        for this operation states otherwise.
    delete:
      tags:
        - Clients
      summary: Delete an OAuth/OIDC client.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - *a4
      responses:
        "200":
          $ref: "#/components/responses/Ok"
      description: Delete Client in the Clients area. The operation changes tenant state and should be
        protected by the documented admin authorization and audit controls.
  /api/admin/clients/bulk:
    delete:
      tags:
        - Clients
      summary: Bulk delete OAuth/OIDC clients.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
      description: Delete Bulk in the Clients area. The operation changes tenant state and should be
        protected by the documented admin authorization and audit controls.
  /api/admin/clients/{id}/regenerate-secret:
    post:
      tags:
        - Clients
      summary: Regenerate a confidential client's secret.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
      description: Regenerate secret for Client in the Clients area. The request body is JSON unless the
        detailed schema for this operation states otherwise.
  /api/admin/clients/{id}/usage:
    get:
      tags:
        - Clients
      summary: Return client usage metrics.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
      description: Get Usage in the Clients area. Use this operation to retrieve usage data without
        mutating tenant state.
  /api/admin/webhooks:
    get:
      tags:
        - Webhooks
      summary: List webhook configurations.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum:
              - tenant
              - client
        - name: clientId
          in: query
          required: false
          schema:
            type: string
        - name: activeOnly
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Webhook list response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - webhooks
                  - total
                properties:
                  webhooks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Webhook"
                  total:
                    type: integer
                    minimum: 0
      description: List Webhooks in the Webhooks area. Use this operation to retrieve webhook data without
        mutating tenant state.
    post:
      tags:
        - Webhooks
      summary: Create a webhook configuration.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/WebhookCreate"
      responses:
        "201":
          description: Webhook created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookMutationResponse"
        "400":
          $ref: "#/components/responses/Error"
      description: Create Webhook in the Webhooks area. The request body is JSON unless the detailed
        schema for this operation states otherwise.
  /api/admin/webhooks/{id}:
    get:
      tags:
        - Webhooks
      summary: Get a webhook configuration.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - &a5
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Webhook response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - webhook
                properties:
                  webhook:
                    $ref: "#/components/schemas/Webhook"
        "404":
          $ref: "#/components/responses/Error"
      description: Get Webhook in the Webhooks area. Use this operation to retrieve webhook data without
        mutating tenant state.
    put:
      tags:
        - Webhooks
      summary: Update a webhook configuration.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - *a5
      requestBody:
        $ref: "#/components/requestBodies/WebhookUpdate"
      responses:
        "200":
          description: Webhook updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookMutationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
      description: Replace Webhook in the Webhooks area. The request body is JSON unless the detailed
        schema for this operation states otherwise.
    delete:
      tags:
        - Webhooks
      summary: Delete a webhook configuration.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - *a5
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/Error"
      description: Delete Webhook in the Webhooks area. The operation changes tenant state and should be
        protected by the documented admin authorization and audit controls.
  /api/admin/webhooks/{id}/test:
    post:
      tags:
        - Webhooks
      summary: Send a test webhook delivery.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
      description: Test Webhook in the Webhooks area. The request body is JSON unless the detailed schema
        for this operation states otherwise.
  /api/admin/webhooks/{id}/deliveries:
    get:
      tags:
        - Webhooks
      summary: List webhook delivery logs.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/List"
      description: Get Delivery in the Webhooks area. Use this operation to retrieve delivery data without
        mutating tenant state.
  /api/admin/webhooks/{id}/replay:
    post:
      tags:
        - Webhooks
      summary: Replay a failed webhook delivery.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/Error"
      description: Replay Webhook in the Webhooks area. The request body is JSON unless the detailed
        schema for this operation states otherwise.
  /api/admin/audit-logs:
    get:
      tags:
        - Admin Miscellaneous
      summary: List audit log entries.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/List"
      description: List Audit Logs in the Admin Miscellaneous area. Use this operation to retrieve audit
        log data without mutating tenant state.
  /api/admin/audit-logs/{id}:
    get:
      tags:
        - Admin Miscellaneous
      summary: Get an audit log entry.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Id"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
      description: Get Audit Log in the Admin Miscellaneous area. Use this operation to retrieve audit log
        data without mutating tenant state.
  /api/admin/settings:
    get:
      tags:
        - Admin Miscellaneous
      summary: Get legacy tenant settings.
      deprecated: true
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
      description: List Settings in the Admin Miscellaneous area. Use this operation to retrieve setting
        data without mutating tenant state.
    put:
      tags:
        - Admin Miscellaneous
      summary: Update legacy tenant settings.
      deprecated: true
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
      description: Replace Setting in the Admin Miscellaneous area. The request body is JSON unless the
        detailed schema for this operation states otherwise.
  /api/admin/settings/schema:
    get:
      tags:
        - Settings - General
