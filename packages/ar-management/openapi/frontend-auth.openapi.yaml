openapi: 3.2.0
info:
  title: Authrim Frontend Auth Discovery API
  version: 0.4.0
  summary: Login UI discovery and grant bootstrap endpoints.
  description: OpenAPI contract for frontend authentication discovery endpoints owned by the management Worker.
servers:
  - url: https://{tenant_domain}
    variables:
      tenant_domain:
        default: auth.example.com
        description: Tenant runtime domain serving `/api/admin/*`.
tags:
  - name: Frontend Auth Discovery
paths:
  /api/assets/{tenantId}/login-ui/{kind}/{filename}:
    get:
      tags:
        - Frontend Auth Discovery
      operationId: getApiAssetsTenantLoginUiKindFilename
      summary: Download a public Login UI image asset.
      description: Streams a tenant-scoped public image asset uploaded for Login UI branding or themes.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum:
              - logo
              - background
              - panel-background
              - favicon
              - thumbnail
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image bytes.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      security: []
  /api/auth/authentication-methods:
    get:
      tags:
        - Frontend Auth Discovery
      operationId: getApiAuthAuthenticationMethods
      summary: List public login authentication methods.
      description:
        Returns the enabled login methods and Login UI configuration for the current tenant,
        including passkey, email code, TOTP, directory password, human verification, SAML, and external
        provider options when configured.
      parameters:
        - name: client_id
          in: query
          required: false
          description: Optional OAuth client id used to resolve client-level Login UI theme overrides.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/AuthMethods'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      security: []
  /api/auth/discovery:
    get:
      tags:
        - Frontend Auth Discovery
      operationId: getApiAuthDiscovery
      summary: Read tenant discovery configuration.
      description:
        Returns common-login discovery settings, Login UI branding, and candidate tenant hints
        for the current host.
      responses:
        '200':
          $ref: '#/components/responses/DiscoveryConfig'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      security: []
    post:
      tags:
        - Frontend Auth Discovery
      operationId: postApiAuthDiscovery
      summary: Resolve a tenant discovery input.
      description:
        Resolves an email domain, tenant code, tenant slug, invitation token, WAYF choice, or
        app hint into one or more tenant login candidates.
      responses:
        '200':
          $ref: '#/components/responses/Discovery'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      requestBody:
        $ref: '#/components/requestBodies/Discovery'
      security: []
  /api/auth/discovery/grant:
    post:
      tags:
        - Frontend Auth Discovery
      operationId: postApiAuthDiscoveryGrant
      summary: Create a tenant discovery grant.
      description:
        Issues a short-lived signed grant that allows the Login UI to continue from common
        discovery to the selected tenant login surface.
      responses:
        '200':
          $ref: '#/components/responses/DiscoveryGrant'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      requestBody:
        $ref: '#/components/requestBodies/DiscoveryGrant'
      security: []
  /api/auth/discovery/grant/verify:
    post:
      tags:
        - Frontend Auth Discovery
      operationId: postApiAuthDiscoveryGrantVerify
      summary: Verify a tenant discovery grant.
      description:
        Validates a discovery grant for the current URL and returns the selected tenant login
        target when the grant is still valid.
      responses:
        '200':
          $ref: '#/components/responses/DiscoveryGrantVerify'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      requestBody:
        $ref: '#/components/requestBodies/DiscoveryGrantVerify'
      security: []
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      description: Admin API bearer token for headless/API usage.
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: authrim_admin_session
      description: Admin UI session cookie for browser usage.
  parameters:
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: false
      schema:
        type: string
      description: Tenant selector for multi-tenant admin requests.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Idempotency key for state-changing operations that support replay protection.
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
    TenantIdPath:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
    Category:
      name: category
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    JsonObject:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonObject'
    AdminClientCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminClientCreate'
    AdminClientUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminClientUpdate'
    AdminUserCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminUserCreate'
    AdminUserUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminUserUpdate'
    AdminUserStatusChange:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminUserStatusChange'
    WebhookCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookCreate'
    WebhookUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookUpdate'
    Discovery:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiscoveryRequest'
          example:
            mode: email
            value: user@example.com
    DiscoveryGrant:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiscoveryGrantRequest'
          example:
            tenant_id: tenant_123
            return_to: https://app.example.com/
    DiscoveryGrantVerify:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiscoveryGrantVerifyRequest'
          example:
            grant: eyJhbGciOiJIUzI1NiJ9...
            current_url: https://auth.example.com/login
  responses:
    Ok:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonObject'
    List:
      description: Successful JSON list response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonObject'
    AdminClient:
      description: OAuth/OIDC client response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminClientResponse'
    AdminClientMutation:
      description: OAuth/OIDC client mutation response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminClientMutationResponse'
    AdminClientList:
      description: OAuth/OIDC client list response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminClientListResponse'
    AdminUser:
      description: Admin end-user response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminUserResponse'
    AdminUserDetail:
      description: Admin end-user detail response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminUserDetailResponse'
    AdminUserList:
      description: Admin end-user list response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminUserListResponse'
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthMethods:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthMethodsResponse'
          example:
            methods:
              passkey:
                enabled: true
                loginEnabled: true
                signupEnabled: true
                capabilities:
                  - conditional
                  - discoverable
              emailCode:
                enabled: true
                steps:
                  - email
                  - code
              totp:
                enabled: false
                loginEnabled: false
                signupEnabled: false
                reauthEnabled: false
                accountLinkEnabled: false
              external:
                enabled: false
                providers: []
            ui:
              theme: light
              variant: beige
              supportedLocales:
                - en
                - ja
              defaultLocale: en
              branding:
                brandName: Authrim
            meta:
              cacheTTL: 60
              revision: 2026-06-19T00:00:00.000Z
    DiscoveryConfig:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiscoveryConfigResponse'
          example:
            config:
              tenant_id: default
              mode: direct
              discovery_methods:
                - email_domain
                - tenant_code
              allow_manual_tenant_entry: true
            ui:
              theme: light
              variant: beige
              brand_name: Authrim
            single_tenant_mode: false
            is_common_entry_host: true
            common_discover_url: https://auth.example.com/discover
    Discovery:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiscoveryResponse'
          example:
            result: resolved
            candidate:
              tenant_id: tenant_123
              tenant_code: acme
              display_name: Acme
              logo_url: null
              login_url: https://acme.auth.example.com/login
              source: email_domain
    DiscoveryGrant:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiscoveryGrantResponse'
          example:
            grant: eyJhbGciOiJIUzI1NiJ9...
            login_url: https://acme.auth.example.com/login?discovery_grant=...
            expires_in: 300
    DiscoveryGrantVerify:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiscoveryGrantVerifyResponse'
          example:
            valid: true
            tenant_id: tenant_123
            target_url: https://acme.auth.example.com/login
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    UriString:
      type: string
      format: uri
    OriginString:
      type: string
      pattern: ^https?://[^/]+$
    StringArray:
      type: array
      items:
        type: string
    Pagination:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
        - hasNext
        - hasPrev
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
    AdminClientBase:
      type: object
      additionalProperties: true
      properties:
        client_name:
          type: string
          minLength: 1
        description:
          type:
            - string
            - 'null'
        redirect_uris:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UriString'
        grant_types:
          type: array
          items:
            type: string
            enum:
              - authorization_code
              - refresh_token
              - client_credentials
              - urn:ietf:params:oauth:grant-type:device_code
              - urn:openid:params:grant-type:ciba
              - urn:ietf:params:oauth:grant-type:token-exchange
        response_types:
          type: array
          items:
            type: string
            enum:
              - code
              - id_token
              - token
        scope:
          type: string
        logo_uri:
          $ref: '#/components/schemas/UriString'
        client_uri:
          $ref: '#/components/schemas/UriString'
        policy_uri:
          $ref: '#/components/schemas/UriString'
        tos_uri:
          $ref: '#/components/schemas/UriString'
        contacts:
          $ref: '#/components/schemas/StringArray'
        token_endpoint_auth_method:
          type: string
          enum:
            - none
            - client_secret_basic
            - client_secret_post
            - client_secret_jwt
            - private_key_jwt
        subject_type:
          type: string
          enum:
            - public
            - pairwise
        sector_identifier_uri:
          $ref: '#/components/schemas/UriString'
        is_trusted:
          type: boolean
        skip_consent:
          type: boolean
        allow_claims_without_scope:
          type: boolean
        allowed_redirect_origins:
          type: array
          items:
            $ref: '#/components/schemas/OriginString'
        web_origin_registry:
          type:
            - object
            - 'null'
          additionalProperties: true
        require_pkce:
          type: boolean
        application_type:
          type: string
          enum:
            - web
            - native
            - service
        trust_group:
          type:
            - string
            - 'null'
        browser_public_client_mode:
          type:
            - string
            - 'null'
          enum:
            - disabled
            - enabled
            - required
            - null
        browser_refresh_token_policy:
          type:
            - string
            - 'null'
          enum:
            - disabled
            - rotation
            - persistent
            - null
        native_sso_enabled:
          type:
            - boolean
            - 'null'
        native_channel_allowed:
          type:
            - boolean
            - 'null'
        allowed_channels:
          type:
            - array
            - 'null'
          items:
            type: string
        token_exchange_allowed:
          type: boolean
        allowed_subject_token_clients:
          type:
            - array
            - 'null'
          items:
            type: string
        allowed_token_exchange_resources:
          type:
            - array
            - 'null'
          items:
            type: string
        delegation_mode:
          type: string
          enum:
            - none
            - delegation
            - impersonation
        client_credentials_allowed:
          type: boolean
        allowed_scopes:
          type:
            - array
            - 'null'
          items:
            type: string
        default_scope:
          type:
            - string
            - 'null'
        default_audience:
          type:
            - string
            - 'null'
        default_resource:
          type:
            - string
            - 'null'
    AdminClientCreate:
      allOf:
        - $ref: '#/components/schemas/AdminClientBase'
        - type: object
          required:
            - client_name
            - redirect_uris
    AdminClientUpdate:
      allOf:
        - $ref: '#/components/schemas/AdminClientBase'
        - type: object
          properties:
            initiate_login_uri:
              $ref: '#/components/schemas/UriString'
            login_ui_url:
              $ref: '#/components/schemas/UriString'
    AdminClient:
      allOf:
        - $ref: '#/components/schemas/AdminClientBase'
        - type: object
          additionalProperties: true
          required:
            - client_id
            - client_name
            - redirect_uris
            - grant_types
            - response_types
          properties:
            client_id:
              type: string
            client_secret:
              type: string
              writeOnly: true
              description: Returned only on secret-issuing operations such as client creation or regeneration.
            tenant_id:
              type: string
            created_at:
              oneOf:
                - type: integer
                - type: string
            updated_at:
              oneOf:
                - type: integer
                - type: string
    AdminClientResponse:
      type: object
      required:
        - client
      properties:
        client:
          $ref: '#/components/schemas/AdminClient'
    AdminClientMutationResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        client:
          $ref: '#/components/schemas/AdminClient'
    AdminClientListResponse:
      type: object
      required:
        - clients
        - pagination
      properties:
        clients:
          type: array
          items:
            $ref: '#/components/schemas/AdminClient'
        pagination:
          $ref: '#/components/schemas/Pagination'
    AdminUserCreate:
      type: object
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: 'null'
      required:
        - email
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        nickname:
          type: string
        preferred_username:
          type: string
        picture:
          type: string
          format: uri
        email_verified:
          type: boolean
        phone_number:
          type: string
        phone_number_verified:
          type: boolean
        user_type:
          type: string
    AdminUser:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        legacy_user_id:
          type: string
        tenant_id:
          type: string
        email:
          type:
            - string
            - 'null'
          format: email
        name:
          type:
            - string
            - 'null'
        given_name:
          type:
            - string
            - 'null'
        family_name:
          type:
            - string
            - 'null'
        nickname:
          type:
            - string
            - 'null'
        preferred_username:
          type:
            - string
            - 'null'
        picture:
          type:
            - string
            - 'null'
          format: uri
        email_verified:
          type: boolean
        phone_number:
          type:
            - string
            - 'null'
        phone_number_verified:
          type: boolean
        user_type:
          type: string
        active:
          type: boolean
        lifecycle_state:
          type: string
        created_at:
          oneOf:
            - type: integer
            - type: string
        updated_at:
          oneOf:
            - type: integer
            - type: string
    AdminUserResponse:
      type: object
      required:
        - user
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AdminUser'
            - type: 'null'
    AdminUserDetailResponse:
      allOf:
        - $ref: '#/components/schemas/AdminUserResponse'
        - type: object
          properties:
            passkeys:
              type: array
              items:
                type: object
                additionalProperties: true
                properties:
                  id:
                    type: string
                  credential_id:
                    type: string
                  device_name:
                    type:
                      - string
                      - 'null'
                  created_at:
                    oneOf:
                      - type: integer
                      - type: string
                      - type: 'null'
                  last_used_at:
                    oneOf:
                      - type: integer
                      - type: string
                      - type: 'null'
            missing_required_fields:
              type: array
              items:
                type: object
                additionalProperties: true
            customFields:
              type: array
              items:
                type: object
                additionalProperties: true
    AdminUserListResponse:
      type: object
      required:
        - users
        - pagination
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        pagination:
          $ref: '#/components/schemas/Pagination'
    AdminUserUpdate:
      type: object
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: 'null'
      properties:
        name:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        nickname:
          type: string
        preferred_username:
          type: string
        picture:
          type: string
          format: uri
        email_verified:
          type: boolean
        phone_number:
          type: string
        phone_number_verified:
          type: boolean
        user_type:
          type: string
    AdminUserStatusChange:
      type: object
      additionalProperties: false
      properties:
        reason_code:
          type: string
        reason_detail:
          type: string
        duration_hours:
          type: number
          minimum: 0
    WebhookRetryPolicy:
      type: object
      additionalProperties: false
      properties:
        maxRetries:
          type: integer
          minimum: 0
          maximum: 10
        initialDelayMs:
          type: integer
          minimum: 0
        backoffMultiplier:
          type: number
          minimum: 1
        maxDelayMs:
          type: integer
          minimum: 0
    WebhookCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - url
        - events
      properties:
        name:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
        events:
          type: array
          minItems: 1
          items:
            type: string
        secret:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        retryPolicy:
          $ref: '#/components/schemas/WebhookRetryPolicy'
        timeoutMs:
          type: integer
          minimum: 1000
          maximum: 60000
        clientId:
          type: string
    WebhookUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
        events:
          type: array
          minItems: 1
          items:
            type: string
        secret:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        retryPolicy:
          $ref: '#/components/schemas/WebhookRetryPolicy'
        timeoutMs:
          type: integer
          minimum: 1000
          maximum: 60000
        active:
          type: boolean
    Webhook:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        tenantId:
          type: string
        clientId:
          type:
            - string
            - 'null'
        scope:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        hasSecret:
          type: boolean
        headers:
          type: object
          additionalProperties:
            type: string
        retryPolicy:
          $ref: '#/components/schemas/WebhookRetryPolicy'
        timeoutMs:
          type: integer
        active:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
        lastSuccessAt:
          type:
            - string
            - 'null'
        lastFailureAt:
          type:
            - string
            - 'null'
    WebhookMutationResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        webhook:
          oneOf:
            - $ref: '#/components/schemas/Webhook'
            - type: 'null'
    Error:
      type: object
      additionalProperties: true
      properties:
        error:
          type: string
        message:
          type: string
        error_description:
          type: string
    AuthMethodsResponse:
      type: object
      required:
        - methods
        - ui
        - meta
      properties:
        methods:
          type: object
          additionalProperties: true
          properties:
            passkey:
              type: object
              additionalProperties: true
            emailCode:
              type: object
              additionalProperties: true
            totp:
              type: object
              additionalProperties: true
            directoryPassword:
              type: object
              additionalProperties: true
            humanVerification:
              type: object
              additionalProperties: true
            external:
              type: object
              additionalProperties: true
        ui:
          type: object
          additionalProperties: true
          required:
            - supportedLocales
            - defaultLocale
          properties:
            supportedLocales:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                enum:
                  - en
                  - ja
                  - zh-CN
                  - zh-TW
                  - es
                  - pt
                  - fr
                  - de
                  - ko
                  - ru
                  - id
            defaultLocale:
              type: string
              description: Fallback locale. The value is always included in supportedLocales.
              enum:
                - en
                - ja
                - zh-CN
                - zh-TW
                - es
                - pt
                - fr
                - de
                - ko
                - ru
                - id
        meta:
          type: object
          required:
            - cacheTTL
            - revision
          properties:
            cacheTTL:
              type: integer
            revision:
              type: string
              format: date-time
    DiscoveryCandidate:
      type: object
      required:
        - tenant_id
        - tenant_code
        - display_name
        - login_url
        - source
      properties:
        tenant_id:
          type: string
        tenant_code:
          type: string
        display_name:
          type: string
        logo_url:
          type:
            - string
            - 'null'
          format: uri
        login_url:
          type: string
          format: uri
        source:
          type: string
          enum:
            - email_domain
            - tenant_code
            - tenant_slug
            - wayf
            - invitation
            - app_hint
    DiscoveryConfigResponse:
      type: object
      required:
        - config
        - ui
        - single_tenant_mode
        - is_common_entry_host
      properties:
        config:
          type: object
          additionalProperties: true
        ui:
          type: object
          additionalProperties: true
        single_tenant_mode:
          type: boolean
        is_common_entry_host:
          type: boolean
        common_discover_url:
          type:
            - string
            - 'null'
          format: uri
        wayf_candidates:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryCandidate'
        single_active_tenant_candidate:
          $ref: '#/components/schemas/DiscoveryCandidate'
        default_candidate:
          $ref: '#/components/schemas/DiscoveryCandidate'
    DiscoveryRequest:
      type: object
      required:
        - mode
        - value
      properties:
        mode:
          type: string
          enum:
            - email
            - tenant_code
            - tenant_slug
            - wayf
            - invite_token
            - app_hint
        value:
          type: string
          maxLength: 2048
    DiscoveryResponse:
      oneOf:
        - type: object
          required:
            - result
            - candidate
          properties:
            result:
              type: string
              enum:
                - resolved
            candidate:
              $ref: '#/components/schemas/DiscoveryCandidate'
            invited_email:
              type:
                - string
                - 'null'
        - type: object
          required:
            - result
            - candidates
          properties:
            result:
              type: string
              enum:
                - multiple
            candidates:
              type: array
              items:
                $ref: '#/components/schemas/DiscoveryCandidate'
        - type: object
          required:
            - result
            - methods
            - allow_manual_tenant_entry
          properties:
            result:
              type: string
              enum:
                - manual_required
            methods:
              type: array
              items:
                type: string
            allow_manual_tenant_entry:
              type: boolean
        - type: object
          required:
            - result
            - code
          properties:
            result:
              type: string
              enum:
                - not_found
            code:
              type: string
    DiscoveryGrantRequest:
      type: object
      required:
        - tenant_id
      properties:
        tenant_id:
          type: string
        expected_tenant_id:
          type: string
        return_to:
          type: string
          format: uri
        login_hint:
          type: string
          maxLength: 320
    DiscoveryGrantResponse:
      type: object
      required:
        - grant
        - login_url
        - expires_in
      properties:
        grant:
          type: string
        login_url:
          type: string
          format: uri
        expires_in:
          type: integer
    DiscoveryGrantVerifyRequest:
      type: object
      required:
        - grant
        - current_url
      properties:
        grant:
          type: string
        current_url:
          type: string
          format: uri
    DiscoveryGrantVerifyResponse:
      type: object
      required:
        - valid
        - tenant_id
        - target_url
      properties:
        valid:
          type: boolean
          enum:
            - true
        tenant_id:
          type: string
        target_url:
          type: string
          format: uri
        login_hint:
          type: string
