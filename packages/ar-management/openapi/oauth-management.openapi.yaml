openapi: 3.2.0
info:
  title: Authrim OAuth Management API
  version: 0.3.3
  summary: Dynamic client registration, token introspection, revocation, and self-service devices.
  description: >
    Initial OpenAPI contract for OAuth-adjacent management endpoints owned by
    `@authrim/ar-management`. Admin UI routes remain in `admin.openapi.yaml`.
servers:
  - name: Tenant runtime
    url: https://{tenant_domain}
    variables:
      tenant_domain:
        default: auth.example.com
tags:
  - name: Dynamic Client Registration
    summary: Dynamic client registration
    kind: nav
  - name: Token Management
    summary: Token management
    kind: nav
  - name: Devices
    summary: Self-service devices
    kind: nav
  - name: Admin Route Coverage
paths:
  /register:
    post:
      tags:
        - Dynamic Client Registration
      summary: Register an OAuth/OIDC client.
      security:
        - initialAccessToken: []
      requestBody:
        $ref: "#/components/requestBodies/ClientRegistration"
      responses:
        "201":
          $ref: "#/components/responses/ClientRegistration"
        "400":
          $ref: "#/components/responses/OAuthError"
        "401":
          $ref: "#/components/responses/OAuthError"
  /clients/{client_id}:
    get:
      tags:
        - Dynamic Client Registration
      summary: Read a dynamically registered client.
      security:
        - registrationAccessToken: []
      parameters:
        - $ref: "#/components/parameters/ClientId"
      responses:
        "200":
          $ref: "#/components/responses/Json"
        "401":
          $ref: "#/components/responses/OAuthError"
    put:
      tags:
        - Dynamic Client Registration
      summary: Replace a dynamically registered client.
      security:
        - registrationAccessToken: []
      parameters:
        - $ref: "#/components/parameters/ClientId"
      requestBody:
        $ref: "#/components/requestBodies/ClientRegistration"
      responses:
        "200":
          $ref: "#/components/responses/ClientRegistration"
        "400":
          $ref: "#/components/responses/OAuthError"
    delete:
      tags:
        - Dynamic Client Registration
      summary: Delete a dynamically registered client.
      security:
        - registrationAccessToken: []
      parameters:
        - $ref: "#/components/parameters/ClientId"
      responses:
        "204":
          description: Client deleted.
        "401":
          $ref: "#/components/responses/OAuthError"
  /introspect:
    post:
      tags:
        - Token Management
      summary: Introspect an OAuth token.
      security:
        - clientAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
              properties:
                token:
                  type: string
                token_type_hint:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/Json"
        "401":
          $ref: "#/components/responses/OAuthError"
  /revoke:
    post:
      tags:
        - Token Management
      summary: Revoke an OAuth token.
      security:
        - clientAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
              properties:
                token:
                  type: string
                token_type_hint:
                  type: string
      responses:
        "200":
          description: Token revocation request accepted.
        "401":
          $ref: "#/components/responses/OAuthError"
  /revoke/batch:
    post:
      tags:
        - Token Management
      summary: Revoke OAuth tokens in batch.
      security:
        - clientAuth: []
      requestBody:
        $ref: "#/components/requestBodies/BatchRevoke"
      responses:
        "200":
          $ref: "#/components/responses/BatchRevoke"
  /me/devices:
    get:
      tags:
        - Devices
      summary: List current user's remembered devices.
      security:
        - sessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/Json"
  /me/devices/{id}:
    patch:
      tags:
        - Devices
      summary: Update current user's remembered device metadata.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/MyDeviceUpdate"
      responses:
        "200":
          $ref: "#/components/responses/MyDevice"
    delete:
      tags:
        - Devices
      summary: Delete a remembered device for the current user.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Json"
  /clients/{client_id}/config:
    get:
      tags:
        - Dynamic Client Registration
      operationId: getClientsByClientIdConfig
      summary: Read public OAuth client configuration.
      description: Returns non-sensitive public client metadata for SDK initialization before
        authentication. Client secrets and private registration metadata are never returned.
      responses:
        "200":
          $ref: "#/components/responses/PublicClientConfig"
        "404":
          $ref: "#/components/responses/OAuthError"
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
      security: []
components:
  securitySchemes:
    initialAccessToken:
      type: http
      scheme: bearer
      description: Initial access token for dynamic client registration.
    registrationAccessToken:
      type: http
      scheme: bearer
      description: Registration access token for client configuration endpoint operations.
    clientAuth:
      type: http
      scheme: bearer
      description: OAuth client authentication represented as bearer where applicable.
    sessionCookie:
      type: apiKey
      in: cookie
      name: authrim_session
  parameters:
    ClientId:
      name: client_id
      in: path
      required: true
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    JsonObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    ClientRegistration:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientRegistrationRequest"
          example:
            redirect_uris:
              - https://app.example.com/callback
            client_name: Example App
            grant_types:
              - authorization_code
              - refresh_token
            response_types:
              - code
            scope: openid profile email
            require_pkce: true
    BatchRevoke:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BatchRevokeRequest"
          example:
            tokens:
              - token: eyJhbGciOiJSUzI1NiJ9...
                token_type_hint: access_token
    MyDeviceUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MyDeviceUpdateRequest"
          example:
            display_name: Work MacBook
  responses:
    Json:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    OAuthError:
      description: OAuth error response.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              error:
                type: string
              error_description:
                type: string
    ClientRegistration:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientRegistrationResponse"
          example:
            client_id: client_123
            client_secret: secret_123
            client_id_issued_at: 1770000000
            client_secret_expires_at: 0
            registration_access_token: reg_access_123
            registration_client_uri: https://auth.example.com/clients/client_123
            redirect_uris:
              - https://app.example.com/callback
            require_pkce: true
    BatchRevoke:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BatchRevokeResponse"
          example:
            results:
              - token_hint: eyJhbGci...abcd
                status: revoked
            summary:
              total: 1
              revoked: 1
              invalid: 0
    MyDevice:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MyDeviceResponse"
          example:
            device:
              id: inst_123
              display_name: Work MacBook
              is_current: true
              app_display_name: Example App
    PublicClientConfig:
      description: Public client configuration.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicClientConfig"
  schemas:
    ClientRegistrationRequest:
      type: object
      properties:
        redirect_uris:
          type: array
          minItems: 1
          items:
            type: string
            format: uri
        client_name:
          type: string
        grant_types:
          type: array
          items:
            type: string
        response_types:
          type: array
          items:
            type: string
        scope:
          type: string
        token_endpoint_auth_method:
          type: string
        require_pkce:
          type: boolean
        client_credentials_allowed:
          type: boolean
          description: Must be true when grant_types contains client_credentials.
        allowed_scopes:
          type: array
          items:
            type: string
        default_scope:
          type: string
        default_audience:
          type: string
        default_resource:
          type: string
          format: uri
        jwks:
          type: object
          additionalProperties: true
        jwks_uri:
          type: string
          format: uri
        sector_identifier_uri:
          type: string
          format: uri
        logo_uri:
          type: string
          format: uri
        policy_uri:
          type: string
          format: uri
        tos_uri:
          type: string
          format: uri
        logout_webhook_uri:
          type: string
          format: uri
      additionalProperties: true
    ClientRegistrationResponse:
      type: object
      required:
        - client_id
        - client_id_issued_at
        - redirect_uris
        - require_pkce
      additionalProperties: true
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        client_id_issued_at:
          type: integer
        client_secret_expires_at:
          type: integer
        registration_access_token:
          type: string
        registration_client_uri:
          type: string
          format: uri
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
        require_pkce:
          type: boolean
    BatchRevokeRequest:
      type: object
      required:
        - tokens
      properties:
        tokens:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - token
            properties:
              token:
                type: string
              token_type_hint:
                type: string
                enum:
                  - access_token
                  - refresh_token
                  - device_secret
    BatchRevokeResponse:
      type: object
      required:
        - results
        - summary
      properties:
        results:
          type: array
          items:
            type: object
            required:
              - token_hint
              - status
            properties:
              token_hint:
                type: string
              status:
                type: string
                enum:
                  - revoked
                  - invalid
        summary:
          type: object
          required:
            - total
            - revoked
            - invalid
          properties:
            total:
              type: integer
            revoked:
              type: integer
            invalid:
              type: integer
    MyDeviceUpdateRequest:
      type: object
      required:
        - display_name
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 64
    MyDeviceItem:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        display_name:
          type: string
        fallback_display_name:
          type: string
        app_display_name:
          type: string
        is_current:
          type: boolean
        last_used_at:
          type: integer
        created_at:
          type: integer
    MyDeviceResponse:
      type: object
      required:
        - device
      properties:
        device:
          $ref: "#/components/schemas/MyDeviceItem"
    PublicClientConfig:
      type: object
      required:
        - client_id
      properties:
        client_id:
          type: string
          example: client_123
        client_name:
          type: string
          example: Example App
        logo_uri:
          type: string
          format: uri
          example: https://app.example.com/logo.png
        client_uri:
          type: string
          format: uri
          example: https://app.example.com/
        policy_uri:
          type: string
          format: uri
          example: https://app.example.com/privacy
        tos_uri:
          type: string
          format: uri
          example: https://app.example.com/terms
        login_ui_url:
          type: string
          format: uri
          example: https://auth.example.com/login
        initiate_login_uri:
          type: string
          format: uri
          example: https://app.example.com/login/start
