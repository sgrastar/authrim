openapi: 3.2.0
info:
  title: Authrim OAuth Management API
  version: 0.4.0
  summary: Dynamic client registration, token introspection, revocation, and self-service devices.
  description: >
    Initial OpenAPI contract for OAuth-adjacent management endpoints owned by
    `@authrim/ar-management`. Admin UI routes remain in `admin.openapi.yaml`.
servers:
  - name: Tenant runtime
    url: https://{tenant_domain}
    variables:
      tenant_domain:
        default: auth.example.com
tags:
  - name: Dynamic Client Registration
    summary: Dynamic client registration
    kind: nav
  - name: Token Management
    summary: Token management
    kind: nav
  - name: Devices
    summary: Self-service devices
    kind: nav
  - name: Admin Route Coverage
paths:
  /register:
    post:
      tags:
        - Dynamic Client Registration
      summary: Register an OAuth/OIDC client.
      security:
        - initialAccessToken: []
      requestBody:
        $ref: '#/components/requestBodies/ClientRegistration'
      responses:
        '201':
          $ref: '#/components/responses/ClientRegistration'
        '400':
          $ref: '#/components/responses/OAuthError'
        '401':
          $ref: '#/components/responses/OAuthError'
  /oauth/admin-agent/register:
    post:
      tags:
        - Dynamic Client Registration
      operationId: registerRestrictedAdminAgentClient
      summary: Register a short-lived public OAuth client for interactive Admin MCP access.
      description: >-
        Restricted RFC 7591 profile used by MCP hosts. No Initial Access Token is required.
        The endpoint accepts only public Authorization Code clients with PKCE, exact redirect URIs,
        and the three interactive Agent scopes. It never returns a client secret, cannot request
        trusted or skip-consent behavior, and does not issue an RFC 7592 registration management
        token. It is tenant scoped, rate limited, and expires after 30 days of inactivity.
      security: []
      requestBody:
        $ref: '#/components/requestBodies/AdminAgentClientRegistration'
      responses:
        '201':
          $ref: '#/components/responses/AdminAgentClientRegistration'
        '400':
          $ref: '#/components/responses/OAuthError'
        '403':
          $ref: '#/components/responses/OAuthError'
        '429':
          $ref: '#/components/responses/OAuthError'
        '503':
          $ref: '#/components/responses/OAuthError'
  /clients/{client_id}:
    get:
      tags:
        - Dynamic Client Registration
      summary: Read a dynamically registered client.
      security:
        - registrationAccessToken: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          $ref: '#/components/responses/Json'
        '401':
          $ref: '#/components/responses/OAuthError'
    put:
      tags:
        - Dynamic Client Registration
      summary: Replace a dynamically registered client.
      security:
        - registrationAccessToken: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        $ref: '#/components/requestBodies/ClientRegistration'
      responses:
        '200':
          $ref: '#/components/responses/ClientRegistration'
        '400':
          $ref: '#/components/responses/OAuthError'
    delete:
      tags:
        - Dynamic Client Registration
      summary: Delete a dynamically registered client.
      security:
        - registrationAccessToken: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '204':
          description: Client deleted.
        '401':
          $ref: '#/components/responses/OAuthError'
  /introspect:
    post:
      tags:
        - Token Management
      summary: Introspect an OAuth token.
      security:
        - clientAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
              properties:
                token:
                  type: string
                token_type_hint:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Json'
        '401':
          $ref: '#/components/responses/OAuthError'
  /revoke:
    post:
      tags:
        - Token Management
      summary: Revoke an OAuth token.
      security:
        - clientAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
              properties:
                token:
                  type: string
                token_type_hint:
                  type: string
      responses:
        '200':
          description: Token revocation request accepted.
        '401':
          $ref: '#/components/responses/OAuthError'
  /revoke/batch:
    post:
      tags:
        - Token Management
      summary: Revoke OAuth tokens in batch.
      security:
        - clientAuth: []
      requestBody:
        $ref: '#/components/requestBodies/BatchRevoke'
      responses:
        '200':
          $ref: '#/components/responses/BatchRevoke'
  /me/devices:
    get:
      tags:
        - Devices
      summary: List current user's remembered devices.
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/Json'
  /me/devices/{id}:
    patch:
      tags:
        - Devices
      summary: Update current user's remembered device metadata.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/MyDeviceUpdate'
      responses:
        '200':
          $ref: '#/components/responses/MyDevice'
    delete:
      tags:
        - Devices
      summary: Delete a remembered device for the current user.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Json'
  /clients/{client_id}/config:
    get:
      tags:
        - Dynamic Client Registration
      operationId: getClientsByClientIdConfig
      summary: Read public OAuth client configuration.
      description: Returns non-sensitive public client metadata for SDK initialization before
        authentication. Client secrets and private registration metadata are never returned.
      responses:
        '200':
          $ref: '#/components/responses/PublicClientConfig'
        '404':
          $ref: '#/components/responses/OAuthError'
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
      security: []
components:
  securitySchemes:
    initialAccessToken:
      type: http
      scheme: bearer
      description: Initial access token for dynamic client registration.
    registrationAccessToken:
      type: http
      scheme: bearer
      description: Registration access token for client configuration endpoint operations.
    clientAuth:
      type: http
      scheme: bearer
      description: OAuth client authentication represented as bearer where applicable.
    sessionCookie:
      type: apiKey
      in: cookie
      name: authrim_session
  parameters:
    ClientId:
      name: client_id
      in: path
      required: true
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    JsonObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    ClientRegistration:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClientRegistrationRequest'
          example:
            redirect_uris:
              - https://app.example.com/callback
            client_name: Example App
            grant_types:
              - authorization_code
              - refresh_token
            response_types:
              - code
            scope: openid profile email
            require_pkce: true
    AdminAgentClientRegistration:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminAgentClientRegistrationRequest'
          example:
            redirect_uris:
              - http://127.0.0.1:49152/callback/random-id
            client_name: Codex
            grant_types: [authorization_code, refresh_token]
            response_types: [code]
            token_endpoint_auth_method: none
            scope: 'agent:read agent:user-data:read agent:write'
    BatchRevoke:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BatchRevokeRequest'
          example:
            tokens:
              - token: eyJhbGciOiJSUzI1NiJ9...
                token_type_hint: access_token
    MyDeviceUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MyDeviceUpdateRequest'
          example:
            display_name: Work MacBook
  responses:
    Json:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    OAuthError:
      description: OAuth error response.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              error:
                type: string
              error_description:
                type: string
    ClientRegistration:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClientRegistrationResponse'
          example:
            client_id: client_123
            client_secret: secret_123
            client_id_issued_at: 1770000000
            client_secret_expires_at: 0
            registration_access_token: reg_access_123
            registration_client_uri: https://auth.example.com/clients/client_123
            redirect_uris:
              - https://app.example.com/callback
            require_pkce: true
    AdminAgentClientRegistration:
      description: Restricted public Agent client registration without any secret.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminAgentClientRegistrationResponse'
    BatchRevoke:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BatchRevokeResponse'
          example:
            results:
              - token_hint: eyJhbGci...abcd
                status: revoked
            summary:
              total: 1
              revoked: 1
              invalid: 0
    MyDevice:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MyDeviceResponse'
          example:
            device:
              id: inst_123
              display_name: Work MacBook
              is_current: true
              app_display_name: Example App
    PublicClientConfig:
      description: Public client configuration.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicClientConfig'
  schemas:
    AdminAgentClientRegistrationRequest:
      type: object
      additionalProperties: false
      required: [redirect_uris]
      properties:
        redirect_uris:
          type: array
          description: Required and non-empty for redirect-based grants; omitted or empty for CIBA-only clients.
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uri
            description: Exact HTTPS URI or RFC 8252 loopback-IP HTTP URI.
        client_name:
          type: string
          minLength: 1
          maxLength: 100
        grant_types:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [authorization_code, refresh_token]
        response_types:
          type: array
          uniqueItems: true
          items: { type: string, const: code }
        token_endpoint_auth_method:
          type: string
          const: none
        scope:
          type: string
          description: >-
            Space-separated subset of agent:read, agent:user-data:read, and agent:write. If present,
            agent:read is required. If omitted, the server registers all three as requestable
            ceilings; the Admin still selects the granted subset on the consent screen.
        dpop_bound_access_tokens:
          type: boolean
          description: Optional request for sender-constrained tokens when the MCP host supports DPoP.
    AdminAgentClientRegistrationResponse:
      type: object
      additionalProperties: true
      required:
        [
          client_id,
          client_id_issued_at,
          redirect_uris,
          grant_types,
          response_types,
          token_endpoint_auth_method,
          scope,
          require_pkce,
        ]
      properties:
        client_id: { type: string }
        client_id_issued_at: { type: integer }
        redirect_uris:
          type: array
          items: { type: string, format: uri }
        grant_types:
          type: array
          items: { type: string }
        response_types:
          type: array
          items: { type: string }
        token_endpoint_auth_method: { type: string, const: none }
        scope: { type: string }
        require_pkce: { type: boolean, const: true }
        dpop_bound_access_tokens: { type: boolean }
    ClientRegistrationRequest:
      type: object
      properties:
        redirect_uris:
          type: array
          minItems: 1
          items:
            type: string
            format: uri
        client_name:
          type: string
        grant_types:
          type: array
          items:
            type: string
        response_types:
          type: array
          items:
            type: string
        scope:
          type: string
        token_endpoint_auth_method:
          type: string
        token_endpoint_auth_signing_alg:
          type: string
          enum:
            - RS256
            - ES256
            - PS256
        id_token_signed_response_alg:
          type: string
          default: RS256
          enum:
            - RS256
            - ES256
            - PS256
        userinfo_signed_response_alg:
          type: string
          default: none
          enum:
            - none
            - RS256
            - ES256
            - PS256
        request_object_signing_alg:
          type: string
          enum:
            - none
            - RS256
            - ES256
            - PS256
        backchannel_token_delivery_mode:
          type: string
          enum: [poll, ping, push]
        backchannel_client_notification_endpoint:
          type: string
          format: uri
        backchannel_authentication_request_signing_alg:
          type: string
          enum: [RS256, ES256, PS256]
        backchannel_user_code_parameter:
          type: boolean
        tls_client_certificate_bound_access_tokens:
          type: boolean
            - PS256
            - EdDSA
        authorization_signed_response_alg:
          type: string
          default: RS256
          description: JWS algorithm used for JWT-secured authorization responses (JARM).
          enum:
            - RS256
            - ES256
        authorization_encrypted_response_alg:
          type: string
          description: JWE key-management algorithm used to encrypt JARM responses.
          enum:
            - RSA-OAEP
            - RSA-OAEP-256
            - ECDH-ES
            - ECDH-ES+A128KW
            - ECDH-ES+A192KW
            - ECDH-ES+A256KW
        authorization_encrypted_response_enc:
          type: string
          description: JWE content-encryption algorithm used to encrypt JARM responses.
          enum:
            - A128GCM
            - A192GCM
            - A256GCM
            - A128CBC-HS256
            - A192CBC-HS384
            - A256CBC-HS512
        require_pkce:
          type: boolean
        client_credentials_allowed:
          type: boolean
          description: Must be true when grant_types contains client_credentials.
        allowed_scopes:
          type: array
          items:
            type: string
        default_scope:
          type: string
        default_audience:
          type: string
        default_resource:
          type: string
          format: uri
        jwks:
          type: object
          additionalProperties: true
        jwks_uri:
          type: string
          format: uri
        sector_identifier_uri:
          type: string
          format: uri
        logo_uri:
          type: string
          format: uri
        policy_uri:
          type: string
          format: uri
        tos_uri:
          type: string
          format: uri
        logout_webhook_uri:
          type: string
          format: uri
      additionalProperties: true
    ClientRegistrationResponse:
      type: object
      required:
        - client_id
        - client_id_issued_at
        - redirect_uris
        - require_pkce
      additionalProperties: true
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        client_id_issued_at:
          type: integer
        client_secret_expires_at:
          type: integer
        registration_access_token:
          type: string
        registration_client_uri:
          type: string
          format: uri
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
        require_pkce:
          type: boolean
        token_endpoint_auth_method:
          type: string
        token_endpoint_auth_signing_alg:
          type: string
          enum:
            - RS256
            - ES256
            - PS256
        id_token_signed_response_alg:
          type: string
          enum:
            - RS256
            - ES256
            - PS256
        userinfo_signed_response_alg:
          type: string
          enum:
            - none
            - RS256
            - ES256
            - PS256
        request_object_signing_alg:
          type: string
          enum:
            - none
            - RS256
            - ES256
            - PS256
        backchannel_token_delivery_mode:
          type: string
          enum: [poll, ping, push]
        backchannel_client_notification_endpoint:
          type: string
          format: uri
        backchannel_authentication_request_signing_alg:
          type: string
          enum: [RS256, ES256, PS256]
        backchannel_user_code_parameter:
          type: boolean
        tls_client_certificate_bound_access_tokens:
          type: boolean
            - PS256
            - EdDSA
        authorization_signed_response_alg:
          type: string
          enum:
            - RS256
            - ES256
        authorization_encrypted_response_alg:
          type: string
          enum:
            - RSA-OAEP
            - RSA-OAEP-256
            - ECDH-ES
            - ECDH-ES+A128KW
            - ECDH-ES+A192KW
            - ECDH-ES+A256KW
        authorization_encrypted_response_enc:
          type: string
          enum:
            - A128GCM
            - A192GCM
            - A256GCM
            - A128CBC-HS256
            - A192CBC-HS384
            - A256CBC-HS512
    BatchRevokeRequest:
      type: object
      required:
        - tokens
      properties:
        tokens:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - token
            properties:
              token:
                type: string
              token_type_hint:
                type: string
                enum:
                  - access_token
                  - refresh_token
                  - device_secret
    BatchRevokeResponse:
      type: object
      required:
        - results
        - summary
      properties:
        results:
          type: array
          items:
            type: object
            required:
              - token_hint
              - status
            properties:
              token_hint:
                type: string
              status:
                type: string
                enum:
                  - revoked
                  - invalid
        summary:
          type: object
          required:
            - total
            - revoked
            - invalid
          properties:
            total:
              type: integer
            revoked:
              type: integer
            invalid:
              type: integer
    MyDeviceUpdateRequest:
      type: object
      required:
        - display_name
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 64
    MyDeviceItem:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        display_name:
          type: string
        fallback_display_name:
          type: string
        app_display_name:
          type: string
        is_current:
          type: boolean
        last_used_at:
          type: integer
        created_at:
          type: integer
    MyDeviceResponse:
      type: object
      required:
        - device
      properties:
        device:
          $ref: '#/components/schemas/MyDeviceItem'
    PublicClientConfig:
      type: object
      required:
        - client_id
      properties:
        client_id:
          type: string
          example: client_123
        client_name:
          type: string
          example: Example App
        logo_uri:
          type: string
          format: uri
          example: https://app.example.com/logo.png
        client_uri:
          type: string
          format: uri
          example: https://app.example.com/
        policy_uri:
          type: string
          format: uri
          example: https://app.example.com/privacy
        tos_uri:
          type: string
          format: uri
          example: https://app.example.com/terms
        login_ui_url:
          type: string
          format: uri
          example: https://auth.example.com/login
        initiate_login_uri:
          type: string
          format: uri
          example: https://app.example.com/login/start
