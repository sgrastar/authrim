  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    AccountProfileResponse:
      type: object
      required:
        - profile
        - session
      properties:
        profile:
          type: object
          required:
            - user_id
            - email_verified
          properties:
            user_id:
              type: string
            email:
              type:
                - string
                - 'null'
              format: email
            email_verified:
              type: boolean
            name:
              type:
                - string
                - 'null'
            given_name:
              type:
                - string
                - 'null'
            family_name:
              type:
                - string
                - 'null'
            locale:
              type:
                - string
                - 'null'
            picture:
              type:
                - string
                - 'null'
        session:
          type: object
          required:
            - id
            - created_at
            - expires_at
            - auth_time
          properties:
            id:
              type: string
            created_at:
              type: integer
            expires_at:
              type: integer
            auth_time:
              type: integer
            acr:
              type: string
            amr:
              type: array
              items:
                type: string
    AccountReauthStatusResponse:
      type: object
      required:
        - reauth
      properties:
        reauth:
          type: object
          required:
            - required
            - authenticated_at
            - expires_at
            - ttl_seconds
            - methods
          properties:
            required:
              type: boolean
            authenticated_at:
              type: integer
            expires_at:
              type: integer
            ttl_seconds:
              type: integer
            methods:
              type: array
              items:
                type: string
    AccountReauthCompleteResponse:
      type: object
      required:
        - ok
        - reauth
      properties:
        ok:
          type: boolean
        reauth:
          type: object
          required:
            - authenticated_at
            - expires_at
            - methods
          properties:
            authenticated_at:
              type: integer
            expires_at:
              type: integer
            methods:
              type: array
              items:
                type: string
    AccountEmailReauthSendResponse:
      type: object
      required:
        - challenge_id
        - expires_in
        - masked_email
      properties:
        challenge_id:
          type: string
        expires_in:
          type: integer
        masked_email:
          type: string
    AccountCapability:
      type: object
      required:
        - id
        - status
        - requires_reauth
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - available
            - planned
        requires_reauth:
          type: boolean
        planned_phase:
          type: string
    AccountSectionCapability:
      type: object
      required:
        - id
        - status
        - capabilities
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - available
            - planned
        capabilities:
          type: array
          items:
            type: string
    AccountThemeCapabilities:
      type: object
      required:
        - version
