openapi: 3.2.0
info:
  title: Authrim User Self-Service API
  version: 0.4.0
  summary: Authenticated user consent and data export endpoints.
  description: OpenAPI contract for user-facing self-service endpoints owned by the management Worker.
servers:
  - url: https://{tenant_domain}
    variables:
      tenant_domain:
        default: auth.example.com
        description: Tenant runtime domain serving `/api/admin/*`.
security:
  - userBearer: []
  - userSessionCookie: []
tags:
  - name: Account Page
  - name: User Consent
  - name: User Data Export
paths:
  /api/account/profile:
    get:
      tags:
        - Account Page
      operationId: getApiAccountProfile
      summary: Read the current Account Page profile.
      description: Returns the authenticated Account Page user's minimal profile and current Authrim
        browser session metadata. Authentication uses the `authrim_session` cookie.
      responses:
        '200':
          $ref: '#/components/responses/AccountProfile'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      security: &accountSession
        - accountSessionCookie: []
    patch:
      tags:
        - Account Page
      operationId: patchApiAccountProfile
      summary: Update current Account Page profile.
      description:
        Updates mutable profile fields for the authenticated Account Page user. The initial
        implementation supports name changes.
      responses:
        '200':
          $ref: '#/components/responses/AccountProfile'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 100
      security: *accountSession
  /api/account/capabilities:
    get:
      tags:
        - Account Page
      operationId: getApiAccountCapabilities
      summary: Read Account Page feature capabilities.
      description: Returns Account Page capabilities together with the published page composition,
        resolved reusable screens, and theme integration status for the authenticated user.
      responses:
        '200':
          $ref: '#/components/responses/AccountCapabilities'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      security: *accountSession
  /api/account/reauth/status:
    get:
      tags:
        - Account Page
      operationId: getApiAccountReauthStatus
      summary: Read Account Page reauthentication status.
      description:
        Returns whether sensitive Account Page operations currently require reauthentication.
        The initial reauthentication window is five minutes from the session auth_time.
      responses:
        '200':
          $ref: '#/components/responses/AccountReauthStatus'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      security: *accountSession
  /api/account/reauth/passkey/options:
    post:
      tags:
        - Account Page
      operationId: postApiAccountReauthPasskeyOptions
      summary: Create passkey reauthentication options.
      description:
        Starts a WebAuthn authentication ceremony for the current Account Page session user.
        The returned allowCredentials list is limited to the user's registered passkeys.
      responses:
        '200':
          $ref: '#/components/responses/AccountPasskeyOptions'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      security: *accountSession
  /api/account/reauth/passkey/complete:
    post:
      tags:
        - Account Page
      operationId: postApiAccountReauthPasskeyComplete
      summary: Complete passkey reauthentication.
      description:
        Verifies a WebAuthn authentication response for the current Account Page session user
        and refreshes the session auth_time used by sensitive Account Page operations.
      responses:
        '200':
          $ref: '#/components/responses/AccountReauthComplete'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - challenge_id
                - credential
              properties:
                challenge_id:
                  type: string
                credential:
                  type: object
                  additionalProperties: true
      security: *accountSession
  /api/account/reauth/email-code/send:
    post:
      tags:
        - Account Page
      operationId: postApiAccountReauthEmailCodeSend
      summary: Send an email code for reauthentication.
      description:
        Sends a one-time verification code to the verified email address of the current Account
        Page session user. This endpoint only uses email code when it is enabled for
        reauthentication in the tenant authentication method settings.
      responses:
        '200':
          $ref: '#/components/responses/AccountEmailReauthSend'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      security: *accountSession
  /api/account/reauth/email-code/complete:
    post:
      tags:
        - Account Page
      operationId: postApiAccountReauthEmailCodeComplete
      summary: Complete email code reauthentication.
      description:
        Verifies a one-time email code for the current Account Page session and refreshes the
        session auth_time used by sensitive Account Page operations.
      responses:
        '200':
          $ref: '#/components/responses/AccountReauthComplete'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - challenge_id
                - code
              properties:
                challenge_id:
                  type: string
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
      security: *accountSession
  /api/account/reauth/totp/complete:
    post:
      tags:
        - Account Page
      operationId: postApiAccountReauthTotpComplete
      summary: Complete TOTP reauthentication.
      description: Verifies a TOTP code for the current Account Page session and refreshes the reauthentication window.
      responses:
        '200':
          $ref: '#/components/responses/AccountReauthComplete'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  pattern: '^(?:[0-9]{6}|[0-9]{8})$'
      security: *accountSession
  /api/account/operations:
    get:
      tags:
        - Account Page
      operationId: getApiAccountOperations
      summary: List current user's Account Page operation history.
      description: Returns non-sensitive Account Page operation events for the authenticated user.
      responses:
        '200':
          $ref: '#/components/responses/AccountOperations'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      security: *accountSession
  /api/account/consents:
    get:
      tags:
        - Account Page
      operationId: getApiAccountConsents
      summary: List current user's consent confirmations for the Account Page.
      description:
        Returns OAuth consent records granted by the authenticated Account Page user using the
        `authrim_session` cookie.
      responses:
        '200':
          $ref: '#/components/responses/AccountConsents'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      security: *accountSession
  /api/account/return:
    post:
      tags:
        - Account Page
      operationId: postApiAccountReturn
      summary: Create an Account Page return transaction.
      description: Creates a short-lived return transaction for unauthenticated Account Page deep
        links. The path must be a relative URL under the configured Account Page path.
      responses:
        '201':
          $ref: '#/components/responses/AccountReturnCreate'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - path
              properties:
                path:
                  type: string
                  example: /account/security?tab=passkeys
      security: []
  /api/account/return/{id}/consume:
    post:
      tags:
        - Account Page
      operationId: postApiAccountReturnByIdConsume
      summary: Consume an Account Page return transaction.
      description: Consumes a short-lived Account Page return transaction and returns the validated
        relative redirect URL. The transaction is single-use.
      responses:
        '200':
          $ref: '#/components/responses/AccountReturnConsume'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/Id'
      security: []
  /api/account/sessions:
    get:
      tags:
        - Account Page
      operationId: getApiAccountSessions
      summary: List current user's Authrim browser sessions.
      description: Returns active Authrim browser sessions owned by the authenticated Account Page user.
      responses:
        '200':
          $ref: '#/components/responses/AccountSessions'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      security: *accountSession
  /api/account/sessions/{id}:
    delete:
      tags:
        - Account Page
      operationId: deleteApiAccountSessionById
      summary: Revoke one current user's Authrim browser session.
      description: Invalidates a session owned by the authenticated Account Page user. Revoking the
        current session also clears the Account Page session cookie.
      responses:
        '200':
          $ref: '#/components/responses/AccountSessionRevoke'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/Id'
      security: *accountSession
  /api/account/passkeys:
    get:
      tags:
        - Account Page
      operationId: getApiAccountPasskeys
      summary: List current user's passkeys.
      description:
        Returns passkeys registered to the authenticated Account Page user without credential
        IDs, public keys, or counters on each display item. The response may include a separate
        WebAuthn Signal API payload for browser-side passkey provider synchronization.
      responses:
        '200':
          $ref: '#/components/responses/AccountPasskeys'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      security: *accountSession
  /api/account/passkeys/options:
    post:
      tags:
        - Account Page
      operationId: postApiAccountPasskeyOptions
      summary: Create passkey registration options.
      description:
        Starts a WebAuthn passkey registration ceremony for the authenticated Account Page
        user. Recent authentication and a valid browser Origin are required.
      responses:
        '200':
          $ref: '#/components/responses/AccountPasskeyOptions'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                device_name:
                  type: string
                  maxLength: 100
      security: *accountSession
  /api/account/passkeys/complete:
    post:
      tags:
        - Account Page
      operationId: postApiAccountPasskeyComplete
      summary: Complete passkey registration.
      description:
        Verifies a WebAuthn registration response against the stored challenge and registers
        the passkey for the authenticated Account Page user.
      responses:
        '201':
          $ref: '#/components/responses/AccountPasskeyCreate'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - challenge_id
                - passkey_response
              properties:
                challenge_id:
                  type: string
                passkey_response:
                  type: object
                  additionalProperties: true
                device_name:
                  type: string
                  maxLength: 100
      security: *accountSession
  /api/account/passkeys/{id}:
    patch:
      tags:
        - Account Page
      operationId: patchApiAccountPasskeyById
      summary: Rename one current user's passkey.
      description: Updates the display name of a passkey owned by the authenticated Account Page user.
      responses:
        '200':
          $ref: '#/components/responses/AccountPasskey'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - device_name
              properties:
                device_name:
                  type: string
                  maxLength: 100
      security: *accountSession
    delete:
      tags:
        - Account Page
      operationId: deleteApiAccountPasskeyById
      summary: Delete one current user's passkey.
      description:
        Deletes a passkey owned by the authenticated Account Page user. Recent authentication
        is required, and at least one other login method must remain.
      responses:
        '200':
          $ref: '#/components/responses/AccountPasskeyDelete'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/Id'
      security: *accountSession
  /api/account/totp:
    get:
      tags:
        - Account Page
      operationId: getApiAccountTotp
      summary: List current user's TOTP credentials.
      description: Returns pending and active TOTP credentials plus backup-code count metadata.
      responses:
        '200':
          $ref: '#/components/responses/AccountTotpCredentials'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      security: *accountSession
  /api/account/totp/options:
    post:
      tags:
        - Account Page
      operationId: postApiAccountTotpOptions
      summary: Create TOTP enrollment options.
      description: Creates a pending TOTP credential, Base32 secret, and otpauth URI for the current user when TOTP login or TOTP account linking is enabled. Recent authentication is required.
      responses:
        '201':
          $ref: '#/components/responses/AccountTotpOptions'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 100
      security: *accountSession
  /api/account/totp/activate:
    post:
      tags:
        - Account Page
      operationId: postApiAccountTotpActivate
      summary: Activate a pending TOTP credential.
      description: Verifies the first TOTP code, activates the credential, and returns newly generated backup codes when TOTP login or TOTP account linking is enabled.
      responses:
        '200':
          $ref: '#/components/responses/AccountTotpActivate'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - credential_id
                - code
              properties:
                credential_id:
                  type: string
                code:
                  type: string
                  pattern: '^(?:[0-9]{6}|[0-9]{8})$'
      security: *accountSession
  /api/account/totp/backup-codes/regenerate:
    post:
      tags:
        - Account Page
      operationId: postApiAccountTotpBackupCodesRegenerate
      summary: Regenerate TOTP backup codes.
      description: Invalidates existing backup codes and returns a new one-time set. Recent TOTP or passkey reauthentication is required.
      responses:
        '200':
          $ref: '#/components/responses/AccountTotpBackupCodes'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: '^(?:[0-9]{6}|[0-9]{8})$'
      security: *accountSession
  /api/account/totp/{id}:
    patch:
      tags:
        - Account Page
      operationId: patchApiAccountTotpById
      summary: Rename one current user's TOTP credential.
      responses:
        '200':
          $ref: '#/components/responses/AccountTotpCredential'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  type: string
                  maxLength: 100
      security: *accountSession
    delete:
      tags:
        - Account Page
      operationId: deleteApiAccountTotpById
      summary: Delete one current user's TOTP credential.
      description: Deletes a TOTP credential. A current TOTP code or backup code is required for active credentials unless the session was recently reauthenticated with TOTP.
      responses:
        '200':
          $ref: '#/components/responses/AccountTotpDelete'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: '^(?:[0-9]{6}|[0-9]{8})$'
                backup_code:
                  type: string
      security: *accountSession
  /api/account/devices:
    get:
      tags:
        - Account Page
      operationId: getApiAccountDevices
      summary: List current user's device inventory for Account Page.
      description:
        Lists device installations visible to the authenticated Account Page user. This is
        the cookie-session Account Page alias for the existing self-service device inventory.
      responses:
        '200':
          $ref: '#/components/responses/AccountDevices'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      security: *accountSession
  /api/account/devices/{id}:
    patch:
      tags:
        - Account Page
      operationId: patchApiAccountDeviceById
      summary: Rename one current user's device.
      description: Renames a device installation owned by the authenticated Account Page user.
      responses:
        '200':
          $ref: '#/components/responses/AccountDevice'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - display_name
              properties:
                display_name:
                  type: string
                  maxLength: 64
      security: *accountSession
    delete:
      tags:
        - Account Page
      operationId: deleteApiAccountDeviceById
      summary: Unlink one current user's device.
      description: Revokes or unlinks a device installation owned by the authenticated Account Page user.
      responses:
        '200':
          $ref: '#/components/responses/AccountDeviceUnlink'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/Id'
      security: *accountSession
  /api/user/consents:
    get:
      tags:
        - User Consent
      operationId: getApiUserConsents
      summary: List the current user's OAuth consents.
      description:
        Returns consent records granted by the authenticated end user, including client display
        metadata, scopes, grant time, expiry, and policy versions when available.
      responses:
        '200':
          $ref: '#/components/responses/UserConsents'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      security: &a1
        - userBearer: []
        - userSessionCookie: []
  /api/user/consents/{clientId}:
    delete:
      tags:
        - User Consent
      operationId: deleteApiUserConsentsByClientId
      summary: Revoke the current user's consent for a client.
      description:
        Deletes the authenticated user's consent for the requested client, records consent
        history, optionally revokes related tokens, and publishes a consent revoked event.
      responses:
        '200':
          $ref: '#/components/responses/ConsentRevoke'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      security: *a1
  /api/user/data-export:
    post:
      tags:
        - User Data Export
      operationId: postApiUserDataExport
      summary: Request a personal data export.
      description:
        Creates a GDPR data portability export for the authenticated user. Small exports can
        complete synchronously; larger exports return a pending request for later polling.
      responses:
        '200':
          $ref: '#/components/responses/DataExportCreate'
        '202':
          $ref: '#/components/responses/DataExportCreate'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      requestBody:
        $ref: '#/components/requestBodies/DataExportCreate'
      security: *a1
  /api/user/data-export/{id}:
    get:
      tags:
        - User Data Export
      operationId: getApiUserDataExportById
      summary: Read a personal data export request.
      description: Returns status and metadata for an export request owned by the authenticated user.
      responses:
        '200':
          $ref: '#/components/responses/DataExportStatus'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security: *a1
  /api/user/data-export/{id}/download:
    get:
      tags:
        - User Data Export
      operationId: getApiUserDataExportByIdDownload
      summary: Download a completed personal data export.
      description:
        Downloads the completed export owned by the authenticated user as JSON or CSV. The
        endpoint returns not_ready until asynchronous exports complete and expired when the export
        is no longer available.
      responses:
        '200':
          description:
            Export file download. Returns application/json or text/csv depending on the export
            format.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security: *a1
  /api/user/data-export/artifacts/{artifactId}:
    get:
      tags:
        - User Data Export
      operationId: getApiUserDataExportArtifactsByArtifactId
      summary: Read a materialized export artifact manifest.
      description: Returns the manifest for a materialized data export artifact owned by the authenticated user.
      responses:
        '200':
          $ref: '#/components/responses/DataExportArtifactManifest'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
      security: *a1
  /api/user/data-export/artifacts/{artifactId}/chunks/{index}:
    get:
      tags:
        - User Data Export
      operationId: getApiUserDataExportArtifactsByArtifactIdChunksByIndex
      summary: Read a materialized export artifact chunk.
      description: Returns a single chunk from a materialized data export artifact owned by the
        authenticated user.
      responses:
        '200':
          $ref: '#/components/responses/DataExportArtifactChunk'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: path
          required: true
          schema:
            type: string
      security: *a1
  /api/user/data-export/artifacts/{artifactId}/download:
    get:
      tags:
        - User Data Export
      operationId: getApiUserDataExportArtifactsByArtifactIdDownload
      summary: Download a materialized export artifact.
      description: Downloads a materialized data export artifact owned by the authenticated user as JSON or CSV.
      responses:
        '200':
          description:
            Artifact file download. Returns application/json or text/csv depending on the requested
            format.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
      security: *a1
components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      description:
        End-user access token. Data export requires a data_export or authrim:data_export scope
        when bearer authentication is used.
    userSessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: End-user browser session cookie.
    accountSessionCookie:
      type: apiKey
      in: cookie
      name: authrim_session
      description: LoginUI Account Page browser session cookie.
  parameters:
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: false
      schema:
        type: string
      description: Tenant selector for multi-tenant admin requests.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Idempotency key for state-changing operations that support replay protection.
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
    TenantIdPath:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
    Category:
      name: category
      in: path
      required: true
      schema:
        type: string
