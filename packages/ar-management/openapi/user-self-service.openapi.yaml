        - source
        - account_page_overrides_supported
        - planned_tokens
      properties:
        version:
          type: integer
        scope:
          type: string
        source:
          type: string
        account_page_overrides_supported:
          type: boolean
        planned_tokens:
          type: array
          items:
            type: string
    AccountCapabilitiesResponse:
      type: object
      required:
        - capabilities
        - sections
        - theme
        - account_page
      properties:
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/AccountCapability'
