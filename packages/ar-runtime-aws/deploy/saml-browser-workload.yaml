    Metadata:
      com.aws.cloudformation.Context:
        why: Publishes the root HTTPS origin only after both integrations and explicit routes exist.
        must:
          - 'No path-prefix stage: WebAuthn/SAML origins use ApiEndpoint.'
          - Bound throttles and concurrency; no account-wide access-log delivery configuration.
    Properties:
      ApiId:
        Ref: BrowserApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        DetailedMetricsEnabled: true
        ThrottlingRateLimit:
          Ref: ApiRateLimit
        ThrottlingBurstLimit:
          Ref: ApiBurstLimit
Outputs:
  ApiId:
    Description: New isolated API ID; bind into the access stack before phase two.
    Value:
      Ref: BrowserApi
  IssuerOrigin:
    Description: AWS-owned HTTPS origin; phase one has no active routes.
    Value:
      Fn::GetAtt:
        - BrowserApi
        - ApiEndpoint
  TestSpUrl:
    Description: Synthetic SP start page; available only after phase two.
    Value:
      Fn::Sub: ${BrowserApi.ApiEndpoint}/test-sp/start
  IdpFunctionArn:
    Condition: HasWorkload
    Description: Dedicated synthetic IdP serving function.
    Value:
      Fn::GetAtt:
        - IdpFunction
        - Arn
  SpFunctionArn:
    Condition: HasWorkload
    Description: Dedicated synthetic SP serving function.
    Value:
      Fn::GetAtt:
        - SpFunction
        - Arn
