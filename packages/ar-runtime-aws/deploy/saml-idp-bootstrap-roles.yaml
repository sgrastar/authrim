AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Authrim SAML DR deployment roles and serving-role permissions boundary. This
  bootstrap stack creates no application resources or long-lived credentials.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: Separate deployment roles and independent serving/maintenance boundaries.
    must:
      - Keep this stack under a separately controlled bootstrap administrator; neither service role can edit it.
      - Bind the exact asset bucket, object prefix, and runtime secret after foundation creation and before workload creation.
      - Supply CAPABILITY_NAMED_IAM when creating or updating this stack and the workload stack.

Parameters:
  OperatorPrincipalArn:
    Type: String
    Default: ''
    Description: >-
      Exact same-account human or federated role ARN permitted to assume the operator role.
      Empty creates a dormant role with no Allow trust statement.
    AllowedPattern: '^$|^arn:(aws|aws-cn|aws-us-gov):iam::[0-9]{12}:(user|role)/[A-Za-z0-9+=,.@_/-]+$'
  OperatorPrincipalMode:
    Type: String
    Default: iam-user
    AllowedValues:
      - iam-user
      - federated-role
    Description: >-
      IAM users must present MFA when assuming OperatorRole. Federated roles use
      MFA enforced by their identity provider instead of aws:MultiFactorAuthPresent.
  FoundationStackName:
    Type: String
    Default: authrim-dr-foundation
    MaxLength: 28
    AllowedPattern: '^[A-Za-z][A-Za-z0-9-]{0,127}$'
    Description: Exact foundation stack permitted to use the foundation service role.
  WorkloadStackName:
    Type: String
    Default: authrim-dr-saml
    MaxLength: 56
    AllowedPattern: '^[A-Za-z][A-Za-z0-9-]{0,127}$'
    Description: Exact one-issuer workload stack permitted to use the workload service role.
  AssetsBucketName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    Description: >-
      Exact AssetsBucketName foundation output. Empty until foundation is created;
      serving S3 reads remain denied while empty.
  AssetObjectPrefix:
    Type: String
    Default: ''
    AllowedPattern: "^$|^[A-Za-z0-9!_.'()-]+(/[A-Za-z0-9!_.'()-]+)*/$"
    Description: >-
      Pinned S3 key prefix containing the Lambda ZIP, runtime manifest, backup parts,
      and supplement for this workload. Empty keeps all S3 reads denied.
  RuntimeSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:(aws|aws-cn|aws-us-gov):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
    Description: Exact existing runtime secret ARN; empty keeps secret reads denied.
  FoundationVpcId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^vpc-[0-9a-f]+$'
    Description: Exact VpcId foundation output; empty denies workload security-group creation.
  DatabaseSecurityGroupId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^sg-[0-9a-f]+$'
    Description: Exact DatabaseSecurityGroupId foundation output; empty denies workload ingress edits.
  SecretsEndpointSecurityGroupId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^sg-[0-9a-f]+$'
    Description: Exact SecretsEndpointSecurityGroupId foundation output; empty denies workload ingress edits.
  HttpApiId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]+$'
    Description: Exact empty HttpApiId foundation output; empty denies workload API child writes.
  IssuerHost:
    Type: String
    Default: ''
    AllowedPattern: '^$|^([a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z][a-z0-9-]*[a-z0-9]$'
    Description: Exact pre-existing issuer hostname for the workload domain; empty denies domain writes.
  RuntimeSecretKmsKeyArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:(aws|aws-cn|aws-us-gov):kms:[a-z0-9-]+:[0-9]{12}:key/[A-Za-z0-9-]+$'
    Description: Optional exact customer managed key for the runtime secret.
  SnapshotKmsKeyArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:(aws|aws-cn|aws-us-gov):kms:[a-z0-9-]+:[0-9]{12}:key/[A-Za-z0-9-]+$'
    Description: Optional exact customer managed key for versioned snapshot objects.

  DbBootstrapStackName:
    Type: String
    Default: authrim-dr-db-bootstrap
    MaxLength: 56
    AllowedPattern: '^[A-Za-z][A-Za-z0-9-]{0,55}$'
  DbBootstrapAssetsBucketName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  DbBootstrapAssetPrefix:
    Type: String
    Default: ''
    AllowedPattern: "^$|^[A-Za-z0-9!_.'()-]+(/[A-Za-z0-9!_.'()-]+)*/$"
  DbBootstrapMasterSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:(aws|aws-cn|aws-us-gov):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@!-]+$'
  DbBootstrapJobConfigSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:(aws|aws-cn|aws-us-gov):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@!-]+$'
  DbBootstrapVpcId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^vpc-[0-9a-f]+$'
  DbBootstrapSubnetIds:
    Type: CommaDelimitedList
    Default: ''
    AllowedPattern: '^$|^subnet-[0-9a-f]+$'
  DbBootstrapSecurityGroupId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^sg-[0-9a-f]+$'

Rules:
  SeparateMaintenanceInputSecret:
    RuleCondition: !Not [!Equals [!Ref DbBootstrapJobConfigSecretArn, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref DbBootstrapMasterSecretArn, !Ref DbBootstrapJobConfigSecretArn]]
        AssertDescription: Input and master secrets must differ.

Conditions:
  HasOperatorPrincipal: !Not [!Equals [!Ref OperatorPrincipalArn, '']]
  IsIamUserOperator: !Equals [!Ref OperatorPrincipalMode, iam-user]
  HasIamUserOperator: !And [!Condition HasOperatorPrincipal, !Condition IsIamUserOperator]
  HasAssetsBucket: !Not [!Equals [!Ref AssetsBucketName, '']]
  HasAssetObjectPrefix: !Not [!Equals [!Ref AssetObjectPrefix, '']]
  HasRuntimeSecret: !Not [!Equals [!Ref RuntimeSecretArn, '']]
  HasFoundationVpcId: !Not [!Equals [!Ref FoundationVpcId, '']]
  HasDatabaseSecurityGroup: !Not [!Equals [!Ref DatabaseSecurityGroupId, '']]
  HasSecretsEndpointSecurityGroup: !Not [!Equals [!Ref SecretsEndpointSecurityGroupId, '']]
  HasHttpApiId: !Not [!Equals [!Ref HttpApiId, '']]
  HasIssuerHost: !Not [!Equals [!Ref IssuerHost, '']]
  HasFoundationIngressBinding: !And
    - !Condition HasDatabaseSecurityGroup
    - !Condition HasSecretsEndpointSecurityGroup
  HasSnapshotBinding: !And [!Condition HasAssetsBucket, !Condition HasAssetObjectPrefix]
  HasRuntimeSecretKmsKey: !And
    - !Condition HasRuntimeSecret
    - !Not [!Equals [!Ref RuntimeSecretKmsKeyArn, '']]
  HasSnapshotKmsKey: !And
    - !Condition HasSnapshotBinding
    - !Not [!Equals [!Ref SnapshotKmsKeyArn, '']]

  HasDbBootstrapBinding: !And
    - !Not [!Equals [!Ref DbBootstrapAssetsBucketName, '']]
    - !Not [!Equals [!Ref DbBootstrapAssetPrefix, '']]
    - !Not [!Equals [!Ref DbBootstrapMasterSecretArn, '']]
    - !Not [!Equals [!Ref DbBootstrapJobConfigSecretArn, '']]
    - !Not [!Equals [!Ref DbBootstrapVpcId, '']]
    - !Not [!Equals [!Select [0, !Ref DbBootstrapSubnetIds], '']]
    - !Not [!Equals [!Ref DbBootstrapSecurityGroupId, '']]

Resources:
  RuntimePermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Caps the serving role even if a future workload change adds an inline allow.
        must:
          - Snapshot and secret reads are absent until exact phase-two bindings are supplied.
          - Keep the policy on the workload RuntimeRole and never grant deployment or IAM actions.
    Properties:
      Path: /authrim-dr/boundary/
      ManagedPolicyName: !Sub '${AWS::StackName}-runtime-boundary'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: FunctionLogsOnly
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/authrim/aws-saml/${WorkloadStackName}/lambda:*'
          - Sid: LambdaVpcSetupOnly
            Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSubnets
              - ec2:DeleteNetworkInterface
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
            Resource: '*'
          - !If
            - HasSnapshotBinding
            - Sid: BoundVersionedSnapshotObjects
              Effect: Allow
              Action: s3:GetObjectVersion
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${AssetsBucketName}/${AssetObjectPrefix}*'
            - !Ref 'AWS::NoValue'
          - !If
            - HasRuntimeSecret
            - Sid: BoundRuntimeSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref RuntimeSecretArn
            - !Ref 'AWS::NoValue'
          - !If
            - HasRuntimeSecretKmsKey
            - Sid: BoundRuntimeSecretDecrypt
              Effect: Allow
              Action: kms:Decrypt
              Resource: !Ref RuntimeSecretKmsKeyArn
              Condition:
                StringEquals:
                  kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.${AWS::URLSuffix}'
                  kms:EncryptionContext:SecretARN: !Ref RuntimeSecretArn
            - !Ref 'AWS::NoValue'
          - !If
            - HasSnapshotKmsKey
            - Sid: BoundSnapshotDecrypt
              Effect: Allow
              Action: kms:Decrypt
              Resource: !Ref SnapshotKmsKeyArn
              Condition:
                StringEquals:
                  kms:ViaService: !Sub 's3.${AWS::Region}.${AWS::URLSuffix}'
            - !Ref 'AWS::NoValue'
          - Sid: DenyFunctionCodeVpcManagement
            Effect: Deny
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSubnets
              - ec2:DeleteNetworkInterface
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
            Resource: '*'
            Condition:
              ArnLike:
                lambda:SourceFunctionArn: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${WorkloadStackName}-*'

  FoundationCfnServiceRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Builds the private network, retained asset bucket and RDS instance, and one empty hidden HTTP API for the fixed foundation stack.
        must:
          - Never manage Authrim IAM roles, policies, Lambda functions, API Gateway routes or domains, or secrets directly.
          - Create only the tagged, execute-api-disabled foundation API; leave its properties immutable afterward.
          - Use only for the exact FoundationStackName through the operator change-set policy.
    Properties:
      Path: /authrim-dr/cfn/
      RoleName: !Sub '${AWS::StackName}-foundation-cfn'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: foundation-resources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CreateTaggedFoundationNetwork
                Effect: Allow
                Action:
                  - ec2:CreateVpc
                  - ec2:CreateSubnet
                  - ec2:CreateRouteTable
                  - ec2:CreateVpcEndpoint
                  - ec2:CreateSecurityGroup
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref 'AWS::Region'
                    aws:RequestTag/authrim:stack: !Ref FoundationStackName
              - Sid: CreateOnlyWithinTaggedFoundationNetwork
                Effect: Allow
                Action:
                  - ec2:CreateSubnet
                  - ec2:CreateRouteTable
                  - ec2:CreateSecurityGroup
                  - ec2:CreateVpcEndpoint
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:route-table/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref 'AWS::Region'
                    aws:ResourceTag/authrim:stack: !Ref FoundationStackName
              - Sid: ManageOnlyTaggedFoundationNetwork
                Effect: Allow
                Action:
                  - ec2:DeleteVpc
                  - ec2:ModifyVpcAttribute
                  - ec2:DeleteSubnet
                  - ec2:ModifySubnetAttribute
                  - ec2:DeleteRouteTable
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:DeleteVpcEndpoints
                  - ec2:ModifyVpcEndpoint
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:route-table/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc-endpoint/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref 'AWS::Region'
                    aws:ResourceTag/authrim:stack: !Ref FoundationStackName
              - Sid: TagFoundationResourcesDuringCreation
                Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:route-table/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc-endpoint/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*'
                Condition:
                  StringEquals:
                    aws:RequestTag/authrim:stack: !Ref FoundationStackName
                    ec2:CreateAction:
                      - CreateVpc
                      - CreateSubnet
                      - CreateRouteTable
                      - CreateVpcEndpoint
                      - CreateSecurityGroup
              - Sid: MaintainOnlyOwnNetworkTags
                Effect: Allow
                Action:
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:route-table/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc-endpoint/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/authrim:stack: !Ref FoundationStackName
              - Sid: PreserveFoundationOwnershipTag
                Effect: Deny
                Action: ec2:DeleteTags
                Resource: '*'
                Condition:
                  ForAnyValue:StringEqualsIgnoreCase:
                    aws:TagKeys: authrim:stack
              - Sid: DenyFoundationOwnershipRetag
                Effect: Deny
                Action: ec2:CreateTags
                Resource: '*'
                Condition:
                  StringNotEquals:
                    aws:RequestTag/authrim:stack: !Ref FoundationStackName
                  'Null':
                    aws:RequestTag/authrim:stack: 'false'
              - Sid: InspectRegionalNetwork
                Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeRouteTables
                  - ec2:DescribeVpcEndpoints
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribePrefixLists
                  - ec2:DescribeManagedPrefixLists
                  - ec2:DescribeVpcAttribute
                  - ec2:DescribeVpcEncryptionControls
                  - ec2:DescribeNetworkAcls
                  - ec2:DescribeSecurityGroupRules
                  - ec2:DescribeAccountAttributes
                  - ec2:DescribeInternetGateways
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref 'AWS::Region'
              - Sid: CreateOnlyTaggedPrivateFoundationApi
                Effect: Allow
                Action: apigateway:POST
                Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis'
                Condition:
                  StringEquals:
                    aws:RequestTag/authrim:stack: !Ref FoundationStackName
                    apigateway:Request/ApiName: !Sub '${FoundationStackName}-saml-idp'
                  Bool:
                    apigateway:Request/DisableExecuteApiEndpoint: 'true'
              - Sid: TagOnlyRegionalFoundationApiOnCreation
                Effect: Allow
                Action: apigateway:POST
                Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/arn%3A${AWS::Partition}%3Aapigateway%3A${AWS::Region}%3A%3A%2Fv2%2Fapis%2F*'
                Condition:
                  StringEquals:
                    aws:RequestTag/authrim:stack: !Ref FoundationStackName
              - Sid: InspectOnlyTaggedFoundationApi
                Effect: Allow
                Action: apigateway:GET
                Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/authrim:stack: !Ref FoundationStackName
              - Sid: ManageExactFoundationBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:GetBucketVersioning
                  - s3:PutBucketVersioning
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketOwnershipControls
                  - s3:PutBucketOwnershipControls
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                  - s3:ListBucket
                  - s3:ListTagsForResource
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${FoundationStackName}-${AWS::AccountId}-${AWS::Region}-assets'
              - Sid: ManageNamedFoundationDatabase
                Effect: Allow
                Action:
                  - rds:CreateDBInstance
                  - rds:DeleteDBInstance
                  - rds:ModifyDBInstance
                  - rds:DescribeDBInstances
                  - rds:CreateDBSubnetGroup
                  - rds:DeleteDBSubnetGroup
                  - rds:ModifyDBSubnetGroup
                  - rds:DescribeDBSubnetGroups
                  - rds:CreateDBParameterGroup
                  - rds:DeleteDBParameterGroup
                  - rds:ModifyDBParameterGroup
                  - rds:DescribeDBParameterGroups
                  - rds:DescribeDBParameters
                  - rds:AddTagsToResource
                  - rds:RemoveTagsFromResource
                  - rds:ListTagsForResource
                Resource:
                  - !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:${FoundationStackName}-postgres'
                  - !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:subgrp:${FoundationStackName}-db-subnets'
                  - !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:pg:${FoundationStackName}-*'
              - Sid: DescribeDatabaseCreationDependencies
                Effect: Allow
                Action:
                  - rds:DescribeDBEngineVersions
                  - rds:DescribeOrderableDBInstanceOptions
                  - rds:DescribeEngineDefaultParameters
                Resource: '*'
              - Sid: CreateRdsManagedMasterSecretOnly
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:TagResource
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!*'
              - Sid: DescribeRdsManagedSecretKey
                Effect: Allow
                Action: kms:DescribeKey
                Resource: '*'
              - Sid: DenyUnmanagedMasterPasswordAtCreation
                Effect: Deny
                Action: rds:CreateDBInstance
                Resource: !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:${FoundationStackName}-postgres'
                Condition:
                  BoolIfExists:
                    rds:ManageMasterUserPassword: 'false'
              - Sid: DenyDisablingManagedMasterPassword
                Effect: Deny
                Action: rds:ModifyDBInstance
                Resource: !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:${FoundationStackName}-postgres'
                Condition:
                  Bool:
                    rds:ManageMasterUserPassword: 'false'
              - Sid: InitialRdsServiceLinkedRoleOnly
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/rds.amazonaws.com/AWSServiceRoleForRDS'
                Condition:
                  StringEquals:
                    iam:AWSServiceName: rds.amazonaws.com

  WorkloadCfnServiceRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Builds one Lambda/API workload and its exact boundary-capped serving role.
        must:
          - IAM writes target only the workload RuntimeRole name and path.
          - CreateRole requires RuntimePermissionsBoundary; no boundary removal or bootstrap policy changes.
          - Use only for the exact WorkloadStackName through the operator change-set policy.
    Properties:
      Path: /authrim-dr/cfn/
      RoleName: !Sub '${AWS::StackName}-workload-cfn'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: workload-resources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CreateOnlyBoundaryCappedServingRole
                Effect: Allow
                Action: iam:CreateRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/authrim-dr/workload/${WorkloadStackName}-runtime'
                Condition:
                  ArnEquals:
                    iam:PermissionsBoundary: !Ref RuntimePermissionsBoundary
              - Sid: ManageOnlyServingRoleInlinePolicy
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/authrim-dr/workload/${WorkloadStackName}-runtime'
              - Sid: PassOnlyServingRoleToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/authrim-dr/workload/${WorkloadStackName}-runtime'
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: ManageStackLambda
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionCodeSigningConfig
                  - lambda:GetFunctionRecursionConfig
                  - lambda:GetRuntimeManagementConfig
                  - lambda:GetFunctionScalingConfig
                  - lambda:GetPolicy
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                  - lambda:GetFunctionConcurrency
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${WorkloadStackName}-*'
              - Sid: ManageOnlyStackLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DescribeLogStreams
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/authrim/aws-saml/${WorkloadStackName}/*'
              - Sid: DescribeLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              - Sid: CreateTaggedWorkloadSecurityGroup
                Effect: Allow
                Action: ec2:CreateSecurityGroup
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref 'AWS::Region'
                    aws:RequestTag/authrim:stack: !Ref WorkloadStackName
              - !If
                - HasFoundationVpcId
                - Sid: CreateWorkloadGroupOnlyInBoundFoundationVpc
                  Effect: Allow
                  Action: ec2:CreateSecurityGroup
                  Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/${FoundationVpcId}'
                  Condition:
                    StringEquals:
                      aws:RequestedRegion: !Ref 'AWS::Region'
                      aws:ResourceTag/authrim:stack: !Ref FoundationStackName
                - !Ref 'AWS::NoValue'
              - Sid: ManageOnlyTaggedWorkloadSecurityGroup
                Effect: Allow
                Action:
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/authrim:stack: !Ref WorkloadStackName
              - Sid: TagWorkloadSecurityGroupDuringCreation
                Effect: Allow
                Action: ec2:CreateTags
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*'
                Condition:
                  StringEquals:
                    aws:RequestTag/authrim:stack: !Ref WorkloadStackName
                    ec2:CreateAction: CreateSecurityGroup
              - Sid: MaintainOnlyOwnWorkloadGroupTags
                Effect: Allow
                Action:
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/authrim:stack: !Ref WorkloadStackName
              - Sid: PreserveWorkloadOwnershipTag
                Effect: Deny
                Action: ec2:DeleteTags
                Resource: '*'
                Condition:
                  ForAnyValue:StringEqualsIgnoreCase:
                    aws:TagKeys: authrim:stack
              - Sid: DenyWorkloadOwnershipRetag
                Effect: Deny
                Action: ec2:CreateTags
                Resource: '*'
                Condition:
                  StringNotEquals:
                    aws:RequestTag/authrim:stack: !Ref WorkloadStackName
                  'Null':
                    aws:RequestTag/authrim:stack: 'false'
              - !If
                - HasFoundationIngressBinding
                - Sid: EditOnlyBoundFoundationIngress
                  Effect: Allow
                  Action:
                    - ec2:AuthorizeSecurityGroupIngress
                    - ec2:RevokeSecurityGroupIngress
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${DatabaseSecurityGroupId}'
                    - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${SecretsEndpointSecurityGroupId}'
                - !Ref 'AWS::NoValue'
              - Sid: InspectWorkloadNetwork
                Effect: Allow
                Action:
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroupRules
                  - ec2:DescribeNetworkInterfaces
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref 'AWS::Region'
              - !If
                - HasHttpApiId
                - Sid: InspectBoundHttpApi
                  Effect: Allow
                  Action: apigateway:GET
                  Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/${HttpApiId}'
                - !Ref 'AWS::NoValue'
              - !If
                - HasHttpApiId
                - Sid: ManageOnlyBoundHttpApiChildren
                  Effect: Allow
                  Action:
                    - apigateway:GET
                    - apigateway:POST
                    - apigateway:PATCH
                    - apigateway:PUT
                    - apigateway:DELETE
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/${HttpApiId}/*'
                - !Ref 'AWS::NoValue'
              - !If
                - HasIssuerHost
                - Sid: CreateTaggedRegionalIssuerDomain
                  Effect: Allow
                  Action: apigateway:POST
                  Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/domainnames'
                  Condition:
                    StringEquals:
                      aws:RequestTag/authrim:stack: !Ref WorkloadStackName
                - !Ref 'AWS::NoValue'
              - !If
                - HasIssuerHost
                - Sid: ManageOnlyExactIssuerDomain
                  Effect: Allow
                  Action:
                    - apigateway:GET
                    - apigateway:POST
                    - apigateway:PATCH
                    - apigateway:PUT
                    - apigateway:DELETE
                    - apigateway:AddCertificateToDomain
                    - apigateway:RemoveCertificateFromDomain
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/domainnames/${IssuerHost}'
                    - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/domainnames/${IssuerHost}/*'
                - !Ref 'AWS::NoValue'
              - Sid: ManageStackAlarms
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                  - cloudwatch:ListTagsForResource
                Resource: !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${WorkloadStackName}-*'
              - Sid: InspectExistingCertificate
                Effect: Allow
                Action: acm:DescribeCertificate
                Resource: !Sub 'arn:${AWS::Partition}:acm:${AWS::Region}:${AWS::AccountId}:certificate/*'
              - !If
                - HasSnapshotBinding
                - Sid: ReadBoundLambdaArtifact
                  Effect: Allow
                  Action: s3:GetObjectVersion
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${AssetsBucketName}/${AssetObjectPrefix}*'
                - !Ref 'AWS::NoValue'
              - Sid: InitialApiGatewayServiceLinkedRoleOnly
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/ops.apigateway.amazonaws.com/AWSServiceRoleForAPIGateway'
                Condition:
                  StringEquals:
                    iam:AWSServiceName: ops.apigateway.amazonaws.com

  DbBootstrapPermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasDbBootstrapBinding
    Metadata:
      com.aws.cloudformation.Context:
        why: Caps maintenance permissions.
        must:
          - Exact inputs read; runtime read/write.
          - No IAM, code-driven ENIs, or unversioned reads.
    Properties:
      Path: /authrim-dr/boundary/
      ManagedPolicyName: !Sub '${AWS::StackName}-db-bootstrap-boundary'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/authrim/aws-saml/${DbBootstrapStackName}/job:*'
          - Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSubnets
              - ec2:DeleteNetworkInterface
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
            Resource: '*'
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: [!Ref DbBootstrapMasterSecretArn, !Ref DbBootstrapJobConfigSecretArn]
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:PutSecretValue
              - secretsmanager:DescribeSecret
            Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbBootstrapStackName}-runtime-??????'
          - Effect: Allow
            Action: s3:GetObjectVersion
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${DbBootstrapAssetsBucketName}/${DbBootstrapAssetPrefix}*'
          - Effect: Deny
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSubnets
              - ec2:DeleteNetworkInterface
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
            Resource: '*'
            Condition:
              ArnEquals:
                lambda:SourceFunctionArn: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${DbBootstrapStackName}-job'

  DbBootstrapCfnServiceRole:
    Type: AWS::IAM::Role
    Condition: HasDbBootstrapBinding
    Metadata:
      com.aws.cloudformation.Context:
        why: Deploys the private job.
        must:
          - Exact resource, role and boundary scope.
          - No network, public URLs, or serving resource changes.
    Properties:
      Path: /authrim-dr/cfn/
      RoleName: !Sub '${AWS::StackName}-db-bootstrap-cfn'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: private-maintenance-stack-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: iam:CreateRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/authrim-dr/maintenance/${DbBootstrapStackName}-job'
                Condition:
                  ArnEquals:
                    iam:PermissionsBoundary: !Ref DbBootstrapPermissionsBoundary
              - Effect: Allow
                # prettier-ignore
                Action: [iam:GetRole, iam:DeleteRole, iam:PutRolePolicy, iam:DeleteRolePolicy, iam:GetRolePolicy, iam:ListRolePolicies, iam:ListAttachedRolePolicies, iam:TagRole, iam:UntagRole]
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/authrim-dr/maintenance/${DbBootstrapStackName}-job'
              - Effect: Allow
                Action:
                  [
                    iam:GetRole,
                    iam:GetRolePolicy,
                    iam:ListRolePolicies,
                    iam:ListAttachedRolePolicies,
                  ]
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${DbBootstrapStackName}-job'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/authrim-dr/maintenance/${DbBootstrapStackName}-job'
                Condition:
                  StringEquals: { 'iam:PassedToService': lambda.amazonaws.com }
              - Effect: Allow
                Action: [lambda:CreateFunction, lambda:UpdateFunctionConfiguration]
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${DbBootstrapStackName}-job'
                Condition:
                  StringEquals:
                    lambda:VpcIds: !Ref DbBootstrapVpcId
                  ForAllValues:StringEquals:
                    lambda:SubnetIds: !Ref DbBootstrapSubnetIds
                    lambda:SecurityGroupIds: [!Ref DbBootstrapSecurityGroupId]
                  'Null':
                    lambda:VpcIds: 'false'
                    lambda:SubnetIds: 'false'
                    lambda:SecurityGroupIds: 'false'
              - Effect: Allow
                # prettier-ignore
                Action: [lambda:DeleteFunction, lambda:GetFunction, lambda:GetFunctionConfiguration, lambda:GetFunctionCodeSigningConfig, lambda:GetFunctionRecursionConfig, lambda:GetRuntimeManagementConfig, lambda:GetFunctionScalingConfig, lambda:UpdateFunctionCode, lambda:PutFunctionConcurrency, lambda:DeleteFunctionConcurrency, lambda:GetFunctionConcurrency, lambda:TagResource, lambda:UntagResource, lambda:ListTags]
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${DbBootstrapStackName}-job'
              - Effect: Allow
                Action:
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:GetSecurityGroupsForVpc
                  - ec2:DescribeNetworkInterfaces
                Resource: '*'
                Condition:
                  StringEquals: { 'aws:RequestedRegion': !Ref 'AWS::Region' }
              - Effect: Allow
                # prettier-ignore
                Action: [logs:CreateLogGroup, logs:DeleteLogGroup, logs:PutRetentionPolicy, logs:DescribeLogStreams, logs:TagResource, logs:UntagResource, logs:ListTagsForResource, logs:GetDataProtectionPolicy]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/authrim/aws-saml/${DbBootstrapStackName}/job'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/authrim/aws-saml/${DbBootstrapStackName}/job:*'
              - Effect: Allow
                Action:
                  [
                    logs:DescribeLogGroups,
                    logs:DescribeResourcePolicies,
                    logs:DescribeIndexPolicies,
                  ]
                Resource: '*'
                Condition:
                  StringEquals: { 'aws:RequestedRegion': !Ref 'AWS::Region' }
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:UpdateSecret
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbBootstrapStackName}-runtime-??????'
              - Effect: Allow
                Action: s3:GetObjectVersion
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DbBootstrapAssetsBucketName}/${DbBootstrapAssetPrefix}*'

  OperatorRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Controls changes to fixed foundation, workload and maintenance stacks.
        must:
          - Keep trust dormant until an exact same-account principal is selected.
          - Never grant IAM policy editing, direct foundation or serving mutation, or bootstrap-stack updates.
          - Permit preflight reads only for these stacks, deployment roles and the selected IAM user; policy simulation is advisory.
    Properties:
      Path: /authrim-dr/operator/
      RoleName: !Sub '${AWS::StackName}-operator'
      MaxSessionDuration: 3600
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/SignInLocalDevelopmentAccess'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - !If
            - HasOperatorPrincipal
            - Effect: Allow
              Principal:
                AWS: !Ref OperatorPrincipalArn
              Action: sts:AssumeRole
              Condition:
                StringEquals:
                  aws:PrincipalAccount: !Ref 'AWS::AccountId'
                  aws:PrincipalType: !If [IsIamUserOperator, User, AssumedRole]
                Bool: !If
                  - IsIamUserOperator
                  - aws:MultiFactorAuthPresent: 'true'
                  - !Ref 'AWS::NoValue'
            - Effect: Deny
              Principal:
                AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
              Action: sts:AssumeRole
      Policies:
        - PolicyName: exact-stack-change-sets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: FoundationChangesUseFoundationServiceRole
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${FoundationStackName}/*'
                Condition:
                  ArnEquals:
                    cloudformation:RoleArn: !GetAtt FoundationCfnServiceRole.Arn
              - Sid: WorkloadChangesUseWorkloadServiceRole
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${WorkloadStackName}/*'
                Condition:
                  ArnEquals:
                    cloudformation:RoleArn: !GetAtt WorkloadCfnServiceRole.Arn
              - Sid: ExecuteAndInspectOnlyPinnedStacks
                Effect: Allow
                Action:
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:TagResource
                  - cloudformation:UntagResource
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${FoundationStackName}/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${WorkloadStackName}/*'
              - Sid: ValidateTemplates
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: InspectBootstrapForPreflight
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref 'AWS::StackId'
              - Sid: InspectDedicatedRolesForPreflight
                Effect: Allow
                Action: iam:GetRole
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/authrim-dr/operator/${AWS::StackName}-operator'
                  - !GetAtt FoundationCfnServiceRole.Arn
                  - !GetAtt WorkloadCfnServiceRole.Arn
              - Sid: SimulateOnlyOperatorPermissions
                Effect: Allow
                Action: iam:SimulatePrincipalPolicy
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/authrim-dr/operator/${AWS::StackName}-operator'
              - !If
                - HasIamUserOperator
                - Sid: InspectSelectedUserMfa
                  Effect: Allow
                  Action: iam:ListMFADevices
                  Resource: !Ref OperatorPrincipalArn
                - !Ref 'AWS::NoValue'
              - Sid: PassOnlyDedicatedCfnRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt FoundationCfnServiceRole.Arn
                  - !GetAtt WorkloadCfnServiceRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

  DbBootstrapOperatorPolicy:
    Type: AWS::IAM::Policy
    Condition: HasDbBootstrapBinding
    Metadata:
      com.aws.cloudformation.Context:
        why: Allows scoped maintenance operations.
        must:
          - No master-secret access or serving changes.
    Properties:
      PolicyName: private-maintenance-operator
      Roles: [!Ref OperatorRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: cloudformation:CreateChangeSet
            Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${DbBootstrapStackName}/*'
            Condition:
              ArnEquals:
                cloudformation:RoleArn: !GetAtt DbBootstrapCfnServiceRole.Arn
          - Effect: Allow
            Action:
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:ListStackResources
              - cloudformation:GetTemplate
              - cloudformation:TagResource
              - cloudformation:UntagResource
            Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${DbBootstrapStackName}/*'
          - Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt DbBootstrapCfnServiceRole.Arn
            Condition:
              StringEquals: { 'iam:PassedToService': cloudformation.amazonaws.com }
          - Effect: Allow
            Action: [lambda:InvokeFunction, lambda:GetFunctionConfiguration]
            Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${DbBootstrapStackName}-job'
          - Effect: Allow
            Action: [s3:PutObject, s3:GetObject, s3:GetObjectVersion]
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${DbBootstrapAssetsBucketName}/${DbBootstrapAssetPrefix}*'
          - Effect: Allow
            Action: [logs:DescribeLogStreams, logs:FilterLogEvents, logs:GetLogEvents]
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/authrim/aws-saml/${DbBootstrapStackName}/job'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/authrim/aws-saml/${DbBootstrapStackName}/job:*'
          - Effect: Allow
            Action: secretsmanager:PutSecretValue
            Resource: !Ref DbBootstrapJobConfigSecretArn

Outputs:
  DbBootstrapCfnServiceRoleArn:
    Condition: HasDbBootstrapBinding
    Value: !GetAtt DbBootstrapCfnServiceRole.Arn
  DbBootstrapPermissionsBoundaryArn:
    Condition: HasDbBootstrapBinding
    Value: !Ref DbBootstrapPermissionsBoundary
  OperatorRoleArn:
    Description: Dormant until OperatorPrincipalArn names an authorized same-account principal.
    Value: !GetAtt OperatorRole.Arn
  FoundationCfnServiceRoleArn:
    Description: Supply for change sets on FoundationStackName only.
    Value: !GetAtt FoundationCfnServiceRole.Arn
  WorkloadCfnServiceRoleArn:
    Description: Supply for change sets on WorkloadStackName only.
    Value: !GetAtt WorkloadCfnServiceRole.Arn
  RuntimePermissionsBoundaryArn:
    Description: Required RuntimePermissionsBoundaryArn workload parameter.
    Value: !Ref RuntimePermissionsBoundary
