components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: authrim_admin_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    JsonObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    SamlForm:
      required: false
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            additionalProperties: true
            properties:
              SAMLRequest:
                type: string
              SAMLResponse:
                type: string
              RelayState:
                type: string
  responses:
    Json:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Xml:
      description: Successful XML response.
      content:
        application/xml:
          schema:
            type: string
    Html:
      description: Successful HTML response.
      content:
        text/html:
          schema:
            type: string
