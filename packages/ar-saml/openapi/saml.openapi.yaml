openapi: 3.2.0
info:
  title: Authrim SAML API
  version: 0.4.2
  summary: SAML protocol endpoints and SAML administration API.
  description: >
    Initial OpenAPI contract for `@authrim/ar-saml`. SAML XML and browser binding responses are
    represented at a high level; detailed SAML message schemas remain defined by the SAML
    specifications.
servers:
  - url: https://{tenant_domain}
    variables:
      tenant_domain:
        default: auth.example.com
tags:
  - name: Health
  - name: SAML IdP
  - name: SAML SP
  - name: SAML Admin
paths:
  /saml/health:
    get:
      tags:
        - Health
      summary: Return SAML Worker health.
      responses:
        '200':
          $ref: '#/components/responses/Json'
  /saml/idp/metadata:
    get:
      tags:
        - SAML IdP
      summary: Return SAML IdP metadata XML.
      description: >-
        For a tenant that has set its institution (the institution.scopes and
        institution.display_names settings, which only the platform can change), the
        IDPSSODescriptor starts with md:Extensions holding one shibmd:Scope (xmlns:shibmd
        urn:mace:shibboleth:metadata:1.0, regexp="false") per registered scope, and md:Organization
        names the institution in each language it was given (the name and the display name are the
        institution's name). A tenant that has set none gets the metadata it always had (no scope,
        an organization named Authrim). The metadata is signed as before, with these in it, and its
        ETag changes with them; a service provider may keep it for up to a day. If the tenant's
        settings cannot be read the endpoint answers 500 rather than metadata without its scopes.
      responses:
        '200':
          $ref: '#/components/responses/Xml'
  /saml/idp/sso:
    get:
      tags:
        - SAML IdP
      summary: Handle IdP SSO redirect binding.
      description: >-
        While the tenant has registered institution scopes (institution.scopes), the attributes
        eduPersonScopedAffiliation and eduPersonPrincipalName (recognised on what the mapping
        produced, by whatever rule or transform: the name, friendly name or OID of the attribute,
        the short forms eppn and epsa, the destination's catalog entry and path, and the fields the
        value is read from, through transforms) are released only with values under one of those scopes: a value
        under another scope, with nothing before or after the @, with more than one @, or empty,
        is withheld, a value with no scope gets the default (the first scope), and if the settings cannot be read none is released. A required attribute left
        without a value is answered as a missing required attribute. What was withheld is recorded
        in the audit log as saml.attribute.withheld (attribute, reason code and the scope, never
        a value). Values released as schacHomeOrganization or o are held to what the tenant registered: the former only when
        it equals a registered scope, the latter only when it equals a registered name, whatever source
        the mapping took it from (otherwise withheld, reason organization_not_registered). A tenant
        that has registered neither a scope nor a name has no institution to name, so neither
        attribute is released (withheld, reason institution_not_registered). A service provider
        whose field mapping set maps the system sources Home
        Organization (schac_home_organization) or Organization Name (organization_name) to an
        attribute gets the default scope as schacHomeOrganization or the institution's English
        name as o; nothing is added otherwise. A tenant that has set no scopes releases
        eduPersonScopedAffiliation and eduPersonPrincipalName as before.
      responses:
        '200':
          $ref: '#/components/responses/Html'
        '302':
          description: Redirect response.
    post:
      tags:
        - SAML IdP
      summary: Handle IdP SSO POST binding.
      requestBody:
        $ref: '#/components/requestBodies/SamlForm'
      responses:
        '200':
          $ref: '#/components/responses/Html'
  /saml/idp/slo:
    get:
      tags:
        - SAML IdP
      summary: Handle IdP SLO redirect binding.
      responses:
        '200':
          $ref: '#/components/responses/Html'
        '302':
          description: Redirect response.
    post:
      tags:
        - SAML IdP
      summary: Handle IdP SLO POST binding.
      requestBody:
        $ref: '#/components/requestBodies/SamlForm'
      responses:
        '200':
          $ref: '#/components/responses/Html'
  /saml/metadata:
    get:
      tags:
        - SAML SP
      summary: Return SAML SP metadata XML.
      responses:
        '200':
          $ref: '#/components/responses/Xml'
  /saml/sp/metadata:
    get:
      tags:
        - SAML SP
      summary: Return SAML SP metadata XML.
      responses:
        '200':
          $ref: '#/components/responses/Xml'
  /saml/sp/login:
    get:
      tags:
        - SAML SP
      summary: Start SAML SP login.
      description: >-
        With an idp parameter, creates an SP-initiated authentication request and starts the
        configured redirect or POST binding. Without idp, returns the provider selection page.
        A well-formed runtime_interaction_id is retained on its provider links as an opaque hint;
        the selected start checks the interaction's tenant, live state and expiry again.
      parameters:
        - name: runtime_interaction_id
          in: query
          required: false
          description: >-
            Optional Flow interaction identifier for associating failed sign-in attempts with an
            existing interaction of this tenant. The value is trimmed and used only when it names
            an unexpired interaction in the created or active state. An absent, empty, malformed,
            unknown, expired, or other-tenant value is ignored. If the interaction cannot be checked,
            sign-in continues without this association. This parameter adds no rejection response
            and does not change the existing sign-in redirects or errors.
          schema:
            type: string
      responses:
        '200':
          description: Provider selection page or an auto-submitting SAML POST-binding form.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirects to the selected identity provider using the SAML redirect binding.
  /saml/sp/acs:
    post:
      tags:
        - SAML SP
      summary: Receive SAML SP assertion consumer POST.
      requestBody:
        $ref: '#/components/requestBodies/SamlForm'
      responses:
        '200':
          $ref: '#/components/responses/Html'
        '302':
          description: Redirect response.
  /saml/sp/slo:
    get:
      tags:
        - SAML SP
      summary: Handle SAML SP logout redirect binding.
      responses:
        '200':
          $ref: '#/components/responses/Html'
    post:
      tags:
        - SAML SP
      summary: Handle SAML SP logout POST binding.
      requestBody:
        $ref: '#/components/requestBodies/SamlForm'
      responses:
        '200':
          $ref: '#/components/responses/Html'
  /api/admin/saml-settings:
    get:
      tags:
        - SAML Admin
      summary: Get SAML settings.
      security:
        - adminBearer: []
        - adminSessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/Json'
    put:
      tags:
        - SAML Admin
      summary: Update SAML settings.
      security:
        - adminBearer: []
        - adminSessionCookie: []
      requestBody:
        $ref: '#/components/requestBodies/SAMLSettingsUpdate'
      responses:
        '200':
          $ref: '#/components/responses/SAMLSettings'
  /api/admin/saml-providers:
    get:
      tags:
        - SAML Admin
      summary: List SAML providers.
      security:
        - adminBearer: []
        - adminSessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/Json'
    post:
      tags:
        - SAML Admin
      summary: Create a SAML provider.
      security:
        - adminBearer: []
        - adminSessionCookie: []
      requestBody:
        $ref: '#/components/requestBodies/SAMLProviderCreate'
      responses:
        '200':
          $ref: '#/components/responses/SAMLProvider'
        '201':
          $ref: '#/components/responses/SAMLProvider'
  /api/admin/saml-providers/{id}:
    get:
      tags:
        - SAML Admin
      summary: Get a SAML provider.
      security:
        - adminBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Json'
    put:
      tags:
        - SAML Admin
      summary: Update a SAML provider.
      security:
        - adminBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/SAMLProviderUpdate'
      responses:
        '200':
          $ref: '#/components/responses/SAMLProvider'
    delete:
      tags:
        - SAML Admin
      summary: Delete a SAML provider.
      security:
        - adminBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Json'
  /api/admin/saml-attribute-presets:
    get:
      tags:
        - SAML Admin
      summary: List SAML attribute presets.
      security:
        - adminBearer: []
        - adminSessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/Json'
    post:
      tags:
        - SAML Admin
      summary: Create a SAML attribute preset.
      security:
        - adminBearer: []
        - adminSessionCookie: []
      requestBody:
        $ref: '#/components/requestBodies/SAMLAttributePresetCreate'
      responses:
        '200':
          $ref: '#/components/responses/SAMLAttributePreset'
        '201':
          $ref: '#/components/responses/SAMLAttributePreset'
  /api/admin/saml-metadata/preview:
    post:
      tags:
        - SAML Admin
      summary: Preview SAML metadata import.
      security:
        - adminBearer: []
        - adminSessionCookie: []
      requestBody:
        $ref: '#/components/requestBodies/SAMLAggregateMetadataInput'
      responses:
        '200':
          $ref: '#/components/responses/SAMLMetadataPreview'
  /api/admin/saml-attribute-presets/{id}:
    delete:
      tags:
        - SAML Admin
      operationId: deleteApiAdminSamlAttributePresetsById
      summary: Delete SAML attribute preset.
      description:
        Deletes a custom SAML attribute preset for the current tenant. Only presets whose id
        starts with `custom:` are deletable; built-in presets are rejected.
      responses:
        '200':
          $ref: '#/components/responses/SAMLDeleteSuccess'
      parameters:
        - name: id
          in: path
          required: true
          description: Custom SAML attribute preset id.
          schema:
            type: string
      security: &a1
        - adminBearer: []
        - adminSessionCookie: []
  /api/admin/saml-metadata/batches/{batchId}:
    get:
      tags:
        - SAML Admin
      operationId: getApiAdminSamlMetadataBatchesByBatchId
      summary: Get aggregate metadata batch status.
      description:
        Returns the status, progress counters, and per-entity results for an aggregate SAML
        metadata batch-create job.
      responses:
        '200':
          $ref: '#/components/responses/SAMLBatchStatus'
      parameters:
        - name: batchId
          in: path
          required: true
          description: Aggregate metadata batch id.
          schema:
            type: string
      security: *a1
  /api/admin/saml-metadata/certificate-preview:
    post:
      tags:
        - SAML Admin
      operationId: postApiAdminSamlMetadataCertificatePreview
      summary: Preview federation trust certificate.
      description: Parses a PEM certificate or fetches a certificate from an HTTPS URL, then returns
        normalized certificate metadata and validation diagnostics.
      responses:
        '200':
          $ref: '#/components/responses/SAMLTrustCertificatePreview'
      requestBody:
        $ref: '#/components/requestBodies/SAMLTrustCertificatePreview'
      security: *a1
  /api/admin/saml-metadata/previews/{previewId}/batch-create:
    post:
      tags:
        - SAML Admin
      operationId: postApiAdminSamlMetadataPreviewsByPreviewIdBatchCreate
      summary: Start aggregate metadata batch create.
      description:
        Starts an asynchronous provider creation job from selected EntityDescriptor entries in
        an aggregate metadata preview. When enabled is false and identityMapping is omitted, mixed IdP and
        SP selections are registered as disabled providers so each provider can be mapped and enabled later.
      responses:
        '202':
          $ref: '#/components/responses/SAMLBatchStatus'
        '400':
          description: >
            The selected entities, provider role, Mapping Set, enabled-state requirement, or per-SP
            destination field policy is invalid. No asynchronous batch is started.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      parameters:
        - name: previewId
          in: path
          required: true
          description: Aggregate metadata preview id.
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/SAMLMetadataBatchCreate'
      security: *a1
  /api/admin/saml-metadata/previews/{previewId}/entities:
    get:
      tags:
        - SAML Admin
      operationId: getApiAdminSamlMetadataPreviewsByPreviewIdEntities
      summary: List aggregate metadata preview entities.
      description:
        Lists EntityDescriptor summaries discovered in an aggregate metadata preview, with
        optional text and keyword filtering.
      responses:
        '200':
          $ref: '#/components/responses/SAMLMetadataEntityList'
      parameters:
        - name: previewId
          in: path
          required: true
          description: Aggregate metadata preview id.
          schema:
            type: string
        - name: query
          in: query
          required: false
          description: Free-text search over entity identifiers and display names.
          schema:
            type: string
        - name: keyword
          in: query
          required: false
          description: Keyword facet filter. Repeat the parameter to apply multiple keywords.
          schema:
            type: string
        - name: offset
          in: query
          required: false
          description: Pagination offset.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: Maximum number of entities to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      security: *a1
  /api/admin/saml-providers/{id}/import-metadata:
    post:
      tags:
        - SAML Admin
      operationId: postApiAdminSamlProvidersByIdImportMetadata
      summary: Import SAML provider metadata.
      description: Imports single-entity SAML metadata into an existing provider, preserving custom
        settings while updating metadata-derived configuration and refresh status.
      responses:
        '200':
          $ref: '#/components/responses/SAMLMetadataImport'
      parameters:
        - name: id
          in: path
          required: true
          description: SAML provider id.
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/SAMLMetadataInput'
      security: *a1
  /api/admin/saml-providers/{id}/refresh-metadata:
    post:
      tags:
        - SAML Admin
      operationId: postApiAdminSamlProvidersByIdRefreshMetadata
      summary: Refresh SAML provider metadata.
      description:
        Fetches metadata from the configured or supplied HTTPS metadata URL and updates the
        provider configuration, certificate validation state, and metadata refresh status. The
        metadata-refresh permission is sufficient only when the configured URL and entityID remain
        unchanged. Supplying a different URL or approving an entityID change also requires the
        provider-update permission.
      responses:
        '200':
          $ref: '#/components/responses/SAMLMetadataRefresh'
      parameters:
        - name: id
          in: path
          required: true
          description: SAML provider id.
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/SAMLMetadataRefresh'
      security: *a1
  /api/admin/saml-federation-sources/{id}/refresh-metadata:
    post:
      tags:
        - SAML Admin
      operationId: postApiAdminSamlFederationSourcesByIdRefreshMetadata
      summary: Refresh federation aggregate metadata.
      description:
        Fetches and verifies the aggregate metadata source immediately, records the validated
        document and entity summaries, and reconciles already activated providers. This manual
        operation is available whether scheduled polling is automatic or manual.
      responses:
        '200':
          $ref: '#/components/responses/SAMLFederationMetadataRefresh'
        '409':
          description: Another refresh or trust-source update superseded this operation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      parameters:
        - name: id
          in: path
          required: true
          description: Federation trust source id.
          schema:
            type: string
      security: *a1
  /api/admin/saml-providers/{id}/signing-rollover/promote-next:
    post:
      tags:
        - SAML Admin
      operationId: postApiAdminSamlProvidersByIdSigningRolloverPromoteNext
      summary: Promote next SAML signing certificate.
      description:
        Promotes the provider signing policy next certificate to active and can retain the
        previous active certificate as backup.
      responses:
        '200':
          $ref: '#/components/responses/SAMLSigningRollover'
      parameters:
        - name: id
          in: path
          required: true
          description: SAML provider id.
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/SAMLSigningRollover'
      security: *a1
  /api/admin/saml-providers/{id}/signing-rollover/publish-next:
    post:
      tags:
        - SAML Admin
      operationId: postApiAdminSamlProvidersByIdSigningRolloverPublishNext
      summary: Publish next SAML signing certificate.
      description:
        Adds a next signing certificate to the provider signing policy for metadata publication
        before activation.
      responses:
        '200':
          $ref: '#/components/responses/SAMLSigningRollover'
      parameters:
        - name: id
          in: path
          required: true
          description: SAML provider id.
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/SAMLSigningRollover'
      security: *a1
  /api/admin/saml-providers/{id}/signing-rollover/retire-backup:
    post:
      tags:
        - SAML Admin
      operationId: postApiAdminSamlProvidersByIdSigningRolloverRetireBackup
      summary: Retire backup SAML signing certificate.
      description: Removes the backup signing certificate from the provider signing policy after a
        rollover has completed.
      responses:
        '200':
          $ref: '#/components/responses/SAMLSigningRollover'
      parameters:
        - name: id
          in: path
          required: true
          description: SAML provider id.
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/SAMLSigningRollover'
      security: *a1
  /api/admin/saml-settings/local-signing:
    post:
      tags:
        - SAML Admin
      operationId: postApiAdminSamlSettingsLocalSigning
      summary: Update local SAML signing keys.
      description:
        Creates, publishes, promotes, deletes, or retires tenant-local SAML signing keys for
        the IdP or SP role and returns the updated SAML settings.
      responses:
        '200':
          $ref: '#/components/responses/SAMLSettings'
      requestBody:
        $ref: '#/components/requestBodies/SAMLLocalSigning'
      security: *a1
  /api/admin/saml-settings/local-signing/dr-bundle:
    post:
      tags:
        - SAML Admin
      operationId: postApiAdminSamlSettingsLocalSigningDrBundle
      summary: Export local SAML signing DR bundle.
      description:
        Exports a passphrase-encrypted disaster recovery bundle containing tenant-local SAML
        signing settings and private signing keys. The response is marked no-store.
      responses:
        '200':
          $ref: '#/components/responses/SAMLDRBundle'
      requestBody:
        $ref: '#/components/requestBodies/SAMLDRBundleExport'
      security: *a1
  /api/admin/saml-settings/local-signing/dr-bundle/import:
    post:
      tags:
        - SAML Admin
      operationId: postApiAdminSamlSettingsLocalSigningDrBundleImport
      summary: Import local SAML signing DR bundle.
      description:
        Decrypts and imports a local SAML signing disaster recovery bundle into the current
        tenant, then returns the reloaded SAML settings.
      responses:
        '200':
          $ref: '#/components/responses/SAMLSettings'
      requestBody:
        $ref: '#/components/requestBodies/SAMLDRBundleImport'
      security: *a1
  /saml/idp/attribute-release-consent:
    post:
      tags:
        - SAML IdP
      operationId: postSamlIdpAttributeReleaseConsent
      summary: Submit SAML attribute release consent.
      description:
        Processes the browser form submitted from the SAML attribute release consent challenge.
        Approval stores consent and redirects back to the SSO resume URL; denial returns a SAML
        protocol error response to the Service Provider.
      responses:
        '200':
          $ref: '#/components/responses/Html'
        '302':
          $ref: '#/components/responses/Redirect'
      requestBody:
        $ref: '#/components/requestBodies/SAMLAttributeReleaseConsentForm'
  /saml/idp/init:
    get:
      tags:
        - SAML IdP
      operationId: getSamlIdpInit
      summary: Start IdP-initiated SAML SSO.
      description:
        Starts IdP-initiated SSO for the `sp` EntityID. Without `sp`, returns an HTML Service
        Provider selection page. If the user is not authenticated, redirects to the configured login
        URL.
      responses:
        '200':
          $ref: '#/components/responses/Html'
        '302':
          $ref: '#/components/responses/Redirect'
        '400':
          description: The RelayState exceeds the SAML binding size limit.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      parameters:
        - name: sp
          in: query
          required: false
          description: Service Provider EntityID to start IdP-initiated SSO for.
          schema:
            type: string
        - name: relay_state
          in: query
          required: false
          description: Optional RelayState forwarded to the Service Provider. Limited to 80 UTF-8 bytes.
          schema:
            type: string
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: authrim_admin_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    JsonObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    SamlForm:
      required: false
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            additionalProperties: true
            properties:
              SAMLRequest:
                type: string
              SAMLResponse:
                type: string
              RelayState:
                type: string
    SAMLSettingsUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SAMLSettingsUpdateRequest'
          example:
            entityIdStyle: tenant_path
            interactiveLoginUrlPolicy: tenant_login_url
    SAMLProviderCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SAMLProviderCreateRequest'
          example:
            name: Example SAML IdP
            providerType: saml_idp
            config:
              entityId: https://idp.example.com/metadata
              ssoUrl: https://idp.example.com/sso
              certificate: -----BEGIN CERTIFICATE-----...
    SAMLProviderUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SAMLProviderUpdateRequest'
          example:
            expectedUpdatedAt: '2026-09-02T00:00:00.000Z'
            name: Example SAML IdP
            enabled: true
            config:
              ssoUrl: https://idp.example.com/sso
    SAMLAttributePresetCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SAMLAttributePresetCreateRequest'
          example:
            label: Custom profile attributes
            attributeReleasePolicy:
              attributes:
                - name: email
                  source: email
    SAMLMetadataInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SAMLMetadataInput'
          example:
            metadataUrl: https://idp.example.com/metadata.xml
    SAMLAggregateMetadataInput:
      required: true
      description: The JSON request body is limited to 12 MiB; inline aggregate XML is limited to 10 MiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SAMLAggregateMetadataInput'
          example:
            metadataUrl: https://federation.example.com/aggregate-metadata.xml
    SAMLTrustCertificatePreview:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SAMLTrustCertificatePreviewRequest'
          example:
            certificate: -----BEGIN CERTIFICATE-----...
    SAMLMetadataBatchCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SAMLMetadataBatchCreateRequest'
          example:
            entityIds:
              - https://idp.example.com/metadata
            providerType: saml_idp
            enabled: true
    SAMLMetadataRefresh:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SAMLMetadataRefreshRequest'
          example:
            metadataUrl: https://idp.example.com/metadata.xml
    SAMLSigningRollover:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SAMLSigningRolloverRequest'
          example:
            certificate: -----BEGIN CERTIFICATE-----...
            metadataCertificatePublication: active_next
    SAMLLocalSigning:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SAMLLocalSigningRequest'
          example:
            role: idp
            action: publish_next
    SAMLDRBundleExport:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SAMLDRBundleExportRequest'
          example:
            passphrase: correct horse battery staple
    SAMLDRBundleImport:
