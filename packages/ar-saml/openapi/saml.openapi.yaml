openapi: 3.2.0
info:
  title: Authrim SAML API
  version: 0.3.2
  summary: SAML protocol endpoints and SAML administration API.
  description: >
    Initial OpenAPI contract for `@authrim/ar-saml`. SAML XML and browser binding responses are
    represented at a high level; detailed SAML message schemas remain defined by the SAML
    specifications.
servers:
  - url: https://{tenant_domain}
    variables:
      tenant_domain:
        default: auth.example.com
tags:
  - name: Health
  - name: SAML IdP
  - name: SAML SP
  - name: SAML Admin
paths:
  /saml/health:
    get:
      tags:
        - Health
      summary: Return SAML Worker health.
      responses:
        "200":
          $ref: "#/components/responses/Json"
  /saml/idp/metadata:
    get:
      tags:
        - SAML IdP
      summary: Return SAML IdP metadata XML.
      responses:
        "200":
          $ref: "#/components/responses/Xml"
  /saml/idp/sso:
    get:
      tags:
        - SAML IdP
      summary: Handle IdP SSO redirect binding.
      responses:
        "200":
          $ref: "#/components/responses/Html"
        "302":
          description: Redirect response.
    post:
      tags:
        - SAML IdP
      summary: Handle IdP SSO POST binding.
      requestBody:
        $ref: "#/components/requestBodies/SamlForm"
      responses:
        "200":
          $ref: "#/components/responses/Html"
  /saml/idp/slo:
    get:
      tags:
        - SAML IdP
      summary: Handle IdP SLO redirect binding.
      responses:
        "200":
          $ref: "#/components/responses/Html"
        "302":
          description: Redirect response.
    post:
      tags:
        - SAML IdP
      summary: Handle IdP SLO POST binding.
      requestBody:
        $ref: "#/components/requestBodies/SamlForm"
      responses:
        "200":
          $ref: "#/components/responses/Html"
  /saml/metadata:
    get:
      tags:
        - SAML SP
      summary: Return SAML SP metadata XML.
      responses:
        "200":
          $ref: "#/components/responses/Xml"
  /saml/sp/metadata:
    get:
      tags:
        - SAML SP
      summary: Return SAML SP metadata XML.
      responses:
        "200":
          $ref: "#/components/responses/Xml"
  /saml/sp/login:
    get:
      tags:
        - SAML SP
      summary: Start SAML SP login.
      responses:
        "302":
          description: Redirect response.
  /saml/sp/acs:
    post:
      tags:
        - SAML SP
      summary: Receive SAML SP assertion consumer POST.
      requestBody:
        $ref: "#/components/requestBodies/SamlForm"
      responses:
        "200":
          $ref: "#/components/responses/Html"
        "302":
          description: Redirect response.
  /saml/sp/slo:
    get:
      tags:
        - SAML SP
      summary: Handle SAML SP logout redirect binding.
      responses:
        "200":
          $ref: "#/components/responses/Html"
    post:
      tags:
        - SAML SP
      summary: Handle SAML SP logout POST binding.
      requestBody:
        $ref: "#/components/requestBodies/SamlForm"
      responses:
        "200":
          $ref: "#/components/responses/Html"
  /api/admin/saml-settings:
    get:
      tags:
        - SAML Admin
      summary: Get SAML settings.
      security:
        - adminBearer: []
        - adminSessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/Json"
    put:
      tags:
        - SAML Admin
      summary: Update SAML settings.
      security:
        - adminBearer: []
        - adminSessionCookie: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/Json"
  /api/admin/saml-providers:
    get:
      tags:
        - SAML Admin
      summary: List SAML providers.
      security:
        - adminBearer: []
        - adminSessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/Json"
    post:
      tags:
        - SAML Admin
      summary: Create a SAML provider.
      security:
        - adminBearer: []
        - adminSessionCookie: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "201":
          $ref: "#/components/responses/Json"
  /api/admin/saml-providers/{id}:
    get:
      tags:
        - SAML Admin
      summary: Get a SAML provider.
      security:
        - adminBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - &a1
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Json"
    put:
      tags:
        - SAML Admin
      summary: Update a SAML provider.
      security:
        - adminBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - *a1
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/Json"
    delete:
      tags:
        - SAML Admin
      summary: Delete a SAML provider.
      security:
        - adminBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - *a1
      responses:
        "200":
          $ref: "#/components/responses/Json"
  /api/admin/saml-attribute-presets:
    get:
      tags:
        - SAML Admin
      summary: List SAML attribute presets.
      security:
        - adminBearer: []
        - adminSessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/Json"
    post:
      tags:
        - SAML Admin
      summary: Create a SAML attribute preset.
      security:
        - adminBearer: []
        - adminSessionCookie: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "201":
          $ref: "#/components/responses/Json"
  /api/admin/saml-metadata/preview:
    post:
      tags:
        - SAML Admin
      summary: Preview SAML metadata import.
      security:
        - adminBearer: []
        - adminSessionCookie: []
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/Json"
  /api/admin/saml-attribute-presets/{id}:
    delete:
      tags:
        - SAML Admin
      operationId: deleteApiAdminSamlAttributePresetsById
      summary: DELETE /api/admin/saml-attribute-presets/{id}
      description: Route coverage stub generated from the Worker route table. Replace this with a detailed
        request and response contract when changing this API.
      x-authrim-route-coverage: inferred-from-source
      responses:
        "200":
          $ref: "#/components/responses/Json"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /api/admin/saml-metadata/batches/{batchId}:
