openapi: 3.2.0
info:
  title: Authrim Token API
  version: 0.4.2
  summary: OAuth/OIDC token endpoint.
  description: Initial OpenAPI contract for `@authrim/ar-token`.
servers:
  - url: https://{tenant_domain}
    variables:
      tenant_domain:
        default: auth.example.com
tags:
  - name: Health
  - name: OAuth
paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Return token Worker health.
      responses:
        '200':
          $ref: '#/components/responses/TokenHealth'
  /health/live:
    get:
      tags:
        - Health
      summary: Return liveness probe status.
      responses:
        '200':
          $ref: '#/components/responses/ProbeHealth'
  /health/ready:
    get:
      tags:
        - Health
      summary: Return readiness probe status.
      responses:
        '200':
          $ref: '#/components/responses/ProbeHealth'
  /token:
    post:
      tags:
        - OAuth
      summary: Exchange an OAuth grant for tokens.
      description: >
        Processes supported OAuth grants. Token exchange requests fail with `invalid_scope` when
        no requested scope remains after applying the subject token and client scope constraints.
        Native SSO scope requests must include `openid`, and client policy must permit it.
        Guest registration does not inject a user_type=anonymous claim into access or ID tokens.
        When RBAC user type claims are enabled, human guests are classified as end_user.
        Request account:lifecycle:read and call UserInfo for authrim_account_lifecycle,
        including registration_state and operational status; this object is not embedded in tokens.
        Guest scope restrictions and account availability checks also apply on refresh.
        With tenant assurance enabled, grants that issue tokens for a user (authorization code,
        refresh token, device code, CIBA, token exchange, Native SSO and JWT bearer) follow the
        default FAL: FAL2 and above with fal2_requires_dpop refuse a request without a DPoP proof
        with invalid_request (JWT bearer, which binds no token, is always refused then); FAL3 with
        fal3_requires_par refuses with unauthorized_client every such grant but an authorization
        code carrying the evidence that its request was pushed with a request object the client
        signed (a Direct Auth code never carries it), and a refresh token whose family such a
        code began (recorded on the family when it was made). A Direct Auth
        finish, which issues tokens without the authorization endpoint, is refused with
        invalid_grant when the AAL its authentication reached (none recorded counts as AAL0) is
        below the required AAL: the tenant default when it is above AAL1 (AAL1, the baseline every
        login has always passed, is not required), and each requested scope's requirement. With include_in_access_token, an access token from the
        authorization code grant carries auth_time and, from the assurance evidence the code
        recorded when it was issued, the acr of the AAL reached (none at AAL0) and amr with the
        methods the authentication proved (none merely registered; none when no method was
        proven), whether or not ID tokens carry assurance claims (RFC 9068). A code issued while
        assurance was off records no such evidence, so its access token carries auth_time only.
        A refresh keeps to how the user first authenticated, recorded on the token family: with
        assurance enabled, the refreshed ID token carries the original auth_time, acr and amr
        (OIDC Core 12.2), and the refreshed access token the claims described above. Assurance settings
        that cannot be read return 503 temporarily_unavailable.
        Identity assurance (IAL): a client's minimum_ial applies whether or not assurance is on, and
        the scope-to-IAL map (assurance.scope_ial_requirements) while it is on. Every grant that
        issues tokens for a user checks the IAL the user's evidence supports now (read each time,
        never cached) against the highest requirement: authorization code (including Direct Auth),
        refresh token (against the whole scope of its family, however much a refresh asks for),
        token exchange (against the scope the new token carries; a subject with no account in the
        tenant counts as IAL1) and Native SSO refuse with invalid_grant; device code and CIBA with
        access_denied. The JWT bearer grant, whose subject an external issuer vouches for and so
        has no evidence here, is refused with invalid_grant for a scope the map holds to a level.
        When nothing is required, no evidence is read. Evidence that cannot be read returns 503
        temporarily_unavailable (an authorization code or Native SSO exchange, whose credential is
        spent by then, returns invalid_grant asking the client to start again). Access tokens
        already issued stay valid until they expire (UserInfo and introspection are not affected);
        revoking evidence stops new tokens, refreshes and exchanges from the next request.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
              properties:
                grant_type:
                  type: string
                code:
                  type: string
                refresh_token:
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
                code_verifier:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/OAuthToken'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /oauth/admin-agent/token:
    post:
      tags:
        - OAuth
      operationId: exchangeAdminAgentTokenGrant
      summary: Issue Mode A tokens or exchange a Mode B machine actor delegation.
      description: >
        Consumes only authorization codes bound to the dedicated Admin Agent issuer, admin subject
        namespace, exact tenant MCP resource, Grant generation, and consent version. The endpoint
        rechecks client authentication, PKCE, the active Grant, both consent records, current
        delegator permissions, scopes, and optional DPoP before issuing a tenant-capped access
        token and rotating refresh token. Refresh grants additionally require an active DB_ADMIN
        family row and the current RefreshTokenRotator version; public clients have a 12-hour idle
        and 7-day absolute limit, while confidential clients have a 24-hour idle and 30-day limit.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AdminAgentAuthorizationCodeTokenRequest'
                - $ref: '#/components/schemas/AdminAgentRefreshTokenRequest'
                - $ref: '#/components/schemas/AdminAgentModeBTokenExchangeRequest'
      responses:
        '200':
          $ref: '#/components/responses/OAuthToken'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /oauth/admin-agent/delegation:
    post:
      tags: [OAuth]
      operationId: issueAdminAgentModeBDelegation
      summary: Issue a JIT one-time Agent delegation JWT for a DPoP-bound Machine Principal.
      description: >
        Requires a DPoP-scheme Admin Machine Access Token and matching DPoP proof. Rechecks the
        active pre-authorized Grant, explicit tenant scope, Machine Principal and credential,
        delegator permission ceiling, principal permission ceiling, scope, and feature flag. The
        returned JWT is audience-bound to the Admin Agent token endpoint, expires within five
        minutes, and is consumed once during RFC 8693 exchange.
      security:
        - DPoP: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [grant_id]
              properties:
                grant_id: { type: string, minLength: 1, maxLength: 128 }
                scope: { type: string }
                resource: { type: string, format: uri }
      responses:
        '200':
          description: Short-lived one-time delegation JWT.
          content:
            application/json:
              schema:
                type: object
                required: [delegation_token, delegation_token_type, expires_in, scope]
                properties:
                  delegation_token: { type: string, writeOnly: true }
                  delegation_token_type:
                    type: string
                    const: urn:authrim:token-type:agent-delegation
                  expires_in: { type: integer, maximum: 300 }
                  scope: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    DPoP:
      type: http
      scheme: DPoP
      description: DPoP-bound Machine Access Token plus a matching DPoP proof header.
  responses:
    Ok:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Error:
      description: OAuth error response.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              error:
                type: string
              error_description:
                type: string
    TokenHealth:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenHealth'
          example:
            status: ok
            service: op-token
            timestamp: 2026-06-19T00:00:00.000Z
    ProbeHealth:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProbeHealth'
          example:
            status: ok
            service: op-token
            version: 0.1.0
            timestamp: 2026-06-19T00:00:00.000Z
    OAuthToken:
      description: Successful JSON response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthTokenResponse'
          example:
            access_token: eyJhbGciOiJSUzI1NiJ9...
            token_type: Bearer
            expires_in: 3600
            id_token: eyJhbGciOiJSUzI1NiJ9...
            refresh_token: refresh_123
            scope: openid profile offline_access
  schemas:
    AdminAgentAuthorizationCodeTokenRequest:
      type: object
      additionalProperties: false
      required:
        - grant_type
        - code
        - redirect_uri
        - client_id
        - code_verifier
        - resource
      properties:
        grant_type:
          type: string
          const: authorization_code
        code:
          type: string
          pattern: '^aac_'
        redirect_uri:
          type: string
          format: uri
        client_id:
          type: string
        client_secret:
          type: string
          writeOnly: true
        client_assertion:
          type: string
          writeOnly: true
        client_assertion_type:
          type: string
          const: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
        resource:
          type: string
          format: uri
    AdminAgentRefreshTokenRequest:
      type: object
      additionalProperties: false
      required:
        - grant_type
        - refresh_token
        - client_id
      properties:
        grant_type:
          type: string
          const: refresh_token
        refresh_token:
          type: string
          writeOnly: true
        scope:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
          writeOnly: true
        client_assertion:
          type: string
          writeOnly: true
        client_assertion_type:
          type: string
          const: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
        resource:
          type: string
          format: uri
    AdminAgentModeBTokenExchangeRequest:
      type: object
      additionalProperties: false
      required:
        - grant_type
        - subject_token
        - subject_token_type
        - actor_token
        - actor_token_type
        - resource
      properties:
        grant_type:
          type: string
          const: urn:ietf:params:oauth:grant-type:token-exchange
        subject_token: { type: string, writeOnly: true }
        subject_token_type:
          type: string
          const: urn:authrim:token-type:agent-delegation
        actor_token: { type: string, writeOnly: true }
        actor_token_type:
          type: string
          const: urn:ietf:params:oauth:token-type:access_token
        requested_token_type:
          type: string
          const: urn:ietf:params:oauth:token-type:access_token
        client_id: { type: string }
        scope: { type: string }
        resource: { type: string, format: uri }
    TokenHealth:
      type: object
      required:
        - status
        - service
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          enum:
            - op-token
        timestamp:
          type: string
          format: date-time
    ProbeHealth:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties: true
    OAuthTokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      additionalProperties: true
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
            - DPoP
        expires_in:
          type: integer
        id_token:
          type: string
          description: >-
            Returned when the granted scope includes openid. On the
            refresh_token grant it is returned only while the tenant setting
            oauth.refresh_id_token_reissue is enabled.
        refresh_token:
          type: string
          description: >-
            On a new grant (authorization_code, device_code, CIBA) for OpenID
            Connect (scope includes openid), returned only when the granted
            scope includes offline_access, unless the tenant setting
            oauth.offline_access_required is disabled. Requests without openid
            are not affected by that setting. The refresh_token grant returns
            one for an existing grant whatever its scope, and so does a Native
            SSO exchange (the device_secret was issued only with a grant that
            got a refresh token).
        refresh_token_expires_in:
          type: integer
          description: >-
            Seconds until the refresh token expires. With sliding expiry each
            rotation extends it, but never past the absolute lifetime counted
            from the first issuance of the token family.
        refresh_token_expires_at:
          type: string
          format: date-time
        refresh_token_expires_at_unix:
          type: integer
        scope:
          type: string
        issued_token_type:
          type: string
        authorization_details:
          type: array
          description: RFC 9396 authorization details preserved in the issued token grant.
          items:
            type: object
            required: [type]
            additionalProperties: true
            properties:
              type:
                type: string
