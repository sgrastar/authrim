# Authrim-operated Keyring wallet provider. Tenant-independent: no binding to any tenant resource
# (no DB_ADMIN, SETTINGS, tenant KV, KEY_MANAGER or service bindings), see design section 12.
#
# NOTHING HERE HAS BEEN DEPLOYED. The database ids and the custom domains below are placeholders
# until the owner approves the Cloudflare plan (design section 16). Secrets are never written to
# this file; they are set with `wrangler secret put` (see the list at the end).
name = "ar-wallet-provider"
main = "src/cloudflare/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false

[env.staging]
name = "ar-wallet-provider-staging"
routes = [{ pattern = "wallet-provider-staging.authrim.com", custom_domain = true }]

[env.staging.triggers]
crons = ["17 * * * *"] # purge expired rate-limit counters

[env.staging.vars]
ENVIRONMENT = "staging"
PROVIDER_ISSUER = "https://wallet-provider-staging.authrim.com"
WALLET_CLIENT_ID = "keyring-ios-staging"
APP_IDS = "BQ23XXWDX8.com.authrim.keyring.staging"
# Apple's public App Attest root (CN=Apple App Attestation Root CA, P-384, valid until 2045-03-15),
# downloaded from apple.com/certificateauthority and verified on 2026-11-25.
APPLE_ROOT_DER_B64 = ""
APPLE_ROOT_SHA256 = "1cb9823ba28ba6ad2d33a006941de2ae4f513ef1d4e831b9f7e0fa7b6242c932"
# SHA-256 (hex) of the two provider intermediates each signing chain must end at.
WALLET_INTERMEDIATE_SHA256 = ""
KEY_INTERMEDIATE_SHA256 = ""

[[env.staging.d1_databases]]
binding = "DB"
database_name = "wallet-provider-staging"
database_id = "00000000-0000-0000-0000-000000000000" # placeholder
migrations_dir = "migrations"

[env.production]
name = "ar-wallet-provider"
routes = [{ pattern = "wallet-provider.authrim.com", custom_domain = true }]

[env.production.triggers]
crons = ["17 * * * *"]

[env.production.vars]
ENVIRONMENT = "production"
PROVIDER_ISSUER = "https://wallet-provider.authrim.com"
WALLET_CLIENT_ID = "keyring-ios"
APP_IDS = "BQ23XXWDX8.com.authrim.keyring"
APPLE_ROOT_DER_B64 = ""
APPLE_ROOT_SHA256 = "1cb9823ba28ba6ad2d33a006941de2ae4f513ef1d4e831b9f7e0fa7b6242c932"
# SHA-256 (hex) of the two provider intermediates each signing chain must end at.
WALLET_INTERMEDIATE_SHA256 = ""
KEY_INTERMEDIATE_SHA256 = ""

[[env.production.d1_databases]]
binding = "DB"
database_name = "wallet-provider"
database_id = "00000000-0000-0000-0000-000000000000" # placeholder
migrations_dir = "migrations"

# Secrets per environment (wrangler secret put <NAME> --env <env>):
#   CHALLENGE_HMAC_KEY, CHALLENGE_HMAC_KEY_PREVIOUS (optional)   base64, >= 32 random bytes
#   WALLET_ATTESTATION_SIGNER, KEY_ATTESTATION_SIGNER            JSON {"privateKeyPkcs8","chain"}
